<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary · Advanced Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e12;--surface:#15171c;--surface2:#1b1e25;--text:#eef0f2;--muted:#8b929c;--border:#262932;
    --violet:#a78bfa;--violet-deep:#1c1433;--violet-line:rgba(167,139,250,0.35);
    --key-accent:#f0c75e;--key-deep:#2a2206;--radius:18px;
  }
  :root[data-theme="light"]{
    --bg:#f4f1ea;--surface:#ffffff;--surface2:#faf8f3;--text:#1a1815;--muted:#6b6660;--border:#e2ddd2;
    --violet:#7c3aed;--violet-deep:#ede9fe;--violet-line:rgba(124,58,237,0.3);
    --key-accent:#b8860b;--key-deep:#fbf2dc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;line-height:1.65;transition:background .3s,color .3s}
  .theme-toggle{position:fixed;top:1.25rem;right:1.25rem;z-index:30;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;
    align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s}
  .theme-toggle:hover{border-color:var(--text);color:var(--text);transform:scale(1.06)}
  .wrap{width:100%;max-width:980px;padding:4.5rem 1.5rem 4rem}
  .back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:500;color:var(--muted);
    text-decoration:none;margin-bottom:2.5rem;transition:color .2s}
  .back-link:hover{color:var(--violet)}
  .eyebrow{font-size:.72rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:1.1rem}
  h1{font-family:'Fraunces',serif;font-weight:700;font-optical-sizing:auto;font-size:clamp(2.2rem,5.5vw,3.4rem);
    line-height:1.05;letter-spacing:-1.5px;margin-bottom:.9rem}
  h1 .accent{background:linear-gradient(90deg,var(--violet),#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--muted);font-size:1.05rem;max-width:560px;font-weight:300;line-height:1.7;margin-bottom:2rem}

  /* ── CONTROLS ─────────────────────────────────────────────── */
  .controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.25rem}
  .search{flex:1 1 220px;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:.6rem .9rem;color:var(--text);font-family:inherit;font-size:.9rem}
  .search:focus{outline:none;border-color:var(--violet)}
  .btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.6rem .95rem;color:var(--muted);
    font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
  .btn:hover{border-color:var(--violet);color:var(--text)}
  .btn.on{border-color:var(--violet);color:var(--violet);background:var(--violet-deep)}
  .btn.primary{border-color:var(--violet-line);color:var(--violet)}
  .filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.6rem}
  .pill{background:none;border:1px solid var(--border);border-radius:999px;padding:.28rem .75rem;color:var(--muted);
    font-family:inherit;font-size:.75rem;cursor:pointer;transition:all .15s}
  .pill:hover{color:var(--text)}
  .pill.on{border-color:var(--violet);color:var(--violet);background:var(--violet-deep)}
  .count{font-size:.78rem;color:var(--muted);margin-bottom:1rem}

  /* ── WORD CARDS ───────────────────────────────────────────── */
  .list{display:flex;flex-direction:column;gap:.7rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s}
  .card.open{border-color:var(--violet-line)}
  .card-hd{display:flex;align-items:center;gap:.75rem;padding:.95rem 1.1rem;cursor:pointer}
  .card-hd:hover .word{color:var(--violet)}
  .word{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;letter-spacing:-.3px;transition:color .18s}
  .pos{font-size:.7rem;font-style:italic;color:var(--muted);flex-shrink:0}
  .def{flex:1;font-size:.88rem;color:var(--muted);font-weight:300;text-align:right;min-width:0}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:.15rem .3rem;
    border-radius:6px;line-height:1;transition:all .15s;flex-shrink:0}
  .icon-btn:hover{color:var(--violet);background:var(--violet-deep)}
  .icon-btn.starred{color:var(--key-accent)}
  .card-body{display:none;padding:0 1.1rem 1.15rem;border-top:1px solid var(--border);margin-top:.1rem;padding-top:1rem}
  .card.open .card-body{display:block}
  .row{display:grid;grid-template-columns:96px 1fr;gap:.7rem;margin-bottom:.7rem;font-size:.88rem}
  .row:last-child{margin-bottom:0}
  .row .lbl{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;padding-top:.28rem}
  .row .val{font-weight:300;line-height:1.7}
  .row .val em{color:var(--text);font-style:italic;font-weight:400}
  .colls{list-style:none;display:flex;flex-direction:column;gap:.18rem}
  .colls li::before{content:'·';color:var(--violet);margin-right:.5rem}
  .row.pit .val{border-left:2px solid var(--key-accent);padding-left:.75rem;background:var(--key-deep);border-radius:0 6px 6px 0;padding:.4rem .75rem}
  :root[data-theme="light"] .row.pit .val{background:var(--key-deep)}
  .tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.85rem}
  .tag{font-size:.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);
    border-radius:5px;padding:.1rem .45rem}
  .empty{text-align:center;color:var(--muted);font-weight:300;padding:3rem 1rem}

  /* ── MODAL ────────────────────────────────────────────────── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:center;justify-content:center;padding:1.5rem}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;max-width:420px;width:100%}
  .modal h3{font-family:'Fraunces',serif;font-size:1.25rem;margin-bottom:1.1rem}
  .field{margin-bottom:1.1rem}
  .field label{display:block;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
  .field select,.field input[type=range]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;
    padding:.55rem .7rem;color:var(--text);font-family:inherit;font-size:.88rem}
  .field input[type=range]{padding:.4rem 0}
  .modal-actions{display:flex;gap:.6rem;justify-content:flex-end}

  /* ── BOARD MODE ───────────────────────────────────────────── */
  .board{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:2rem;text-align:center}
  .board.show{display:flex}
  .board-word{font-family:'Fraunces',serif;font-size:clamp(2.8rem,9vw,6rem);font-weight:700;letter-spacing:-2px;line-height:1.05}
  .board-pos{font-size:1rem;font-style:italic;color:var(--muted);margin-top:.5rem}
  .board-reveal{max-width:720px;margin-top:2rem;display:none}
  .board-reveal.show{display:block}
  .board-def{font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:300;line-height:1.6;margin-bottom:1.2rem}
  .board-ex{font-size:clamp(1rem,2vw,1.25rem);font-style:italic;color:var(--violet);font-weight:300;line-height:1.6}
  .board-colls{margin-top:1.2rem;font-size:1rem;color:var(--muted);font-weight:300}
  .board-bar{position:fixed;bottom:1.4rem;left:0;right:0;display:flex;gap:.6rem;justify-content:center;align-items:center}
  .board-pos-count{position:fixed;top:1.4rem;left:1.6rem;font-size:.8rem;color:var(--muted);letter-spacing:2px}
  .hint{position:fixed;bottom:4.6rem;left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted);letter-spacing:1px}

  @media(max-width:600px){
    .wrap{padding:3.5rem 1.1rem 3rem}
    .def{display:none}
    .row{grid-template-columns:1fr;gap:.15rem}
    .row .lbl{padding-top:0}
  }
  @media print{
    .theme-toggle,.controls,.filters,.board,.overlay,.back-link,.count{display:none!important}
    body{background:#fff;color:#000}
    .card,.card-body{display:block!important;border-color:#ccc;break-inside:avoid}
    .def{text-align:left}
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" aria-label="Switch theme">🌙</button>

<div class="wrap">
  <a class="back-link" href="index.html">← Vocabulary</a>
  <div class="eyebrow" id="eyebrow">C1 Vocabulary</div>
  <h1><span class="accent" id="title">Loading</span></h1>
  <p class="lede" id="lede"></p>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Search words, collocations, notes…" autocomplete="off">
    <button class="btn" id="starBtn">★ Starred</button>
    <button class="btn" id="sortBtn">Sort: order</button>
    <button class="btn primary" id="boardBtn">Board mode</button>
    <button class="btn" id="voiceBtn" aria-label="Audio settings">🔊</button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</div>

<div class="overlay" id="voiceModal">
  <div class="modal">
    <h3>Audio</h3>
    <div class="field">
      <label for="voiceSel">Voice</label>
      <select id="voiceSel"></select>
    </div>
    <div class="field">
      <label for="rateSel">Speed — <span id="rateVal">0.9</span>×</label>
      <input type="range" id="rateSel" min="0.6" max="1.2" step="0.05" value="0.9">
    </div>
    <div class="modal-actions">
      <button class="btn" id="testVoice">Test</button>
      <button class="btn primary" id="closeVoice">Done</button>
    </div>
  </div>
</div>

<div class="board" id="board">
  <div class="board-pos-count" id="boardCount"></div>
  <div class="board-word" id="boardWord"></div>
  <div class="board-pos" id="boardPos"></div>
  <div class="board-reveal" id="boardReveal">
    <div class="board-def" id="boardDef"></div>
    <div class="board-ex" id="boardEx"></div>
    <div class="board-colls" id="boardColls"></div>
  </div>
  <div class="hint" id="boardHint">Space reveals · ← → moves · S shuffles · Esc exits</div>
  <div class="board-bar">
    <button class="btn" id="bPrev">←</button>
    <button class="btn" id="bSay">🔊</button>
    <button class="btn primary" id="bReveal">Reveal</button>
    <button class="btn" id="bShuffle">Shuffle</button>
    <button class="btn" id="bNext">→</button>
    <button class="btn" id="bExit">Exit</button>
  </div>
</div>

<script>
/* ── theme ─────────────────────────────────────────────────── */
var themeBtn = document.getElementById('themeBtn');
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'light' ? '☀️' : '🌙';
  localStorage.setItem('vocab-theme', t);
}
setTheme(localStorage.getItem('vocab-theme') === 'light' ? 'light' : 'dark');
themeBtn.addEventListener('click', function(){
  setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
});

/* ── state ─────────────────────────────────────────────────── */
var THEME = null, ITEMS = [], VIEW = [], starred = [], slug = '';
var showStarredOnly = false, sortMode = 'order', activeTags = [], query = '';
var boardIdx = 0, boardList = [];

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* ── data loading ──────────────────────────────────────────── */
var target = '';
function load(){
  var parts = (location.hash || '#work').slice(1).split('/');
  slug = parts[0].replace(/[^a-z0-9-]/g, '');
  target = parts[1] ? decodeURIComponent(parts[1]) : '';
  if(!slug) slug = 'work';
  var s = document.createElement('script');
  s.src = 'data/' + slug + '.js';
  s.onload = start;
  s.onerror = function(){
    document.getElementById('title').textContent = 'Theme not found';
    document.getElementById('lede').textContent = 'No word list is published at data/' + slug + '.js yet. Go back and pick a live theme.';
  };
  document.head.appendChild(s);
}

function start(){
  THEME = (window.VOCAB || {})[slug];
  if(!THEME){ return; }
  ITEMS = THEME.items;
  document.title = THEME.title + ' · C1 Vocabulary';
  document.getElementById('title').textContent = THEME.title;
  document.getElementById('lede').textContent = THEME.blurb;
  document.getElementById('eyebrow').textContent = 'C1 Vocabulary · ' + ITEMS.length + ' words';
  try{ starred = JSON.parse(localStorage.getItem('vocab-star-' + slug) || '[]'); }catch(e){ starred = []; }
  buildFilters();
  render();
  if(target) focusWord(target);
}

function focusWord(w){
  var idx = VIEW.map(function(it){ return it.word; }).indexOf(w);
  if(idx < 0) return;
  var card = document.getElementById('list').children[idx];
  if(!card) return;
  card.classList.add('open');
  card.scrollIntoView({behavior: 'smooth', block: 'center'});
}

/* ── filters ───────────────────────────────────────────────── */
function buildFilters(){
  var tags = [];
  ITEMS.forEach(function(it){
    (it.tags || []).forEach(function(t){ if(tags.indexOf(t) < 0) tags.push(t); });
  });
  tags.sort();
  var box = document.getElementById('filters');
  box.innerHTML = '';
  tags.forEach(function(t){
    var b = document.createElement('button');
    b.className = 'pill';
    b.textContent = t;
    b.addEventListener('click', function(){
      var i = activeTags.indexOf(t);
      if(i < 0){ activeTags.push(t); } else { activeTags.splice(i, 1); }
      b.classList.toggle('on');
      render();
    });
    box.appendChild(b);
  });
}

function matches(it){
  if(showStarredOnly && starred.indexOf(it.word) < 0) return false;
  if(activeTags.length){
    var has = activeTags.every(function(t){ return (it.tags || []).indexOf(t) >= 0; });
    if(!has) return false;
  }
  if(query){
    var hay = [it.word, it.def, it.ex, it.note, it.pitfall, it.family, (it.colls || []).join(' ')].join(' ').toLowerCase();
    if(hay.indexOf(query) < 0) return false;
  }
  return true;
}

/* ── render ────────────────────────────────────────────────── */
function render(){
  VIEW = ITEMS.filter(matches);
  if(sortMode === 'az'){
    VIEW = VIEW.slice().sort(function(a, b){ return a.word.localeCompare(b.word); });
  } else if(sortMode === 'pos'){
    VIEW = VIEW.slice().sort(function(a, b){
      return a.pos.localeCompare(b.pos) || a.word.localeCompare(b.word);
    });
  }
  document.getElementById('count').textContent =
    VIEW.length + ' of ' + ITEMS.length + ' words' + (starred.length ? ' · ' + starred.length + ' starred' : '');
  var list = document.getElementById('list');
  list.innerHTML = '';
  if(!VIEW.length){
    list.innerHTML = '<div class="empty">Nothing matches those filters. Clear the search or the tags.</div>';
    return;
  }
  VIEW.forEach(function(it){ list.appendChild(cardFor(it)); });
}

function cardFor(it){
  var card = document.createElement('div');
  card.className = 'card';

  var hd = document.createElement('div');
  hd.className = 'card-hd';
  hd.innerHTML =
    '<span class="word">' + esc(it.word) + '</span>' +
    '<span class="pos">' + esc(it.pos) + '</span>' +
    '<span class="def">' + esc(it.def) + '</span>';

  var say = document.createElement('button');
  say.className = 'icon-btn';
  say.textContent = '🔊';
  say.title = 'Hear it';
  say.addEventListener('click', function(e){ e.stopPropagation(); speak(it.word); });

  var star = document.createElement('button');
  star.className = 'icon-btn' + (starred.indexOf(it.word) >= 0 ? ' starred' : '');
  star.textContent = starred.indexOf(it.word) >= 0 ? '★' : '☆';
  star.title = 'Star this word';
  star.addEventListener('click', function(e){
    e.stopPropagation();
    toggleStar(it.word);
    star.textContent = starred.indexOf(it.word) >= 0 ? '★' : '☆';
    star.classList.toggle('starred', starred.indexOf(it.word) >= 0);
    if(showStarredOnly) render();
    else document.getElementById('count').textContent =
      VIEW.length + ' of ' + ITEMS.length + ' words' + (starred.length ? ' · ' + starred.length + ' starred' : '');
  });

  hd.appendChild(say);
  hd.appendChild(star);
  hd.addEventListener('click', function(){ card.classList.toggle('open'); });
  card.appendChild(hd);

  var body = document.createElement('div');
  body.className = 'card-body';
  var html = '';
  html += '<div class="row"><div class="lbl">Collocations</div><div class="val"><ul class="colls">' +
    (it.colls || []).map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div></div>';
  html += '<div class="row"><div class="lbl">In use</div><div class="val"><em>' + esc(it.ex) + '</em></div></div>';
  if(it.note) html += '<div class="row"><div class="lbl">Usage</div><div class="val">' + esc(it.note) + '</div></div>';
  if(it.pitfall) html += '<div class="row pit"><div class="lbl">Watch out</div><div class="val">' + esc(it.pitfall) + '</div></div>';
  if(it.family) html += '<div class="row"><div class="lbl">Word family</div><div class="val">' + esc(it.family) + '</div></div>';
  if((it.tags || []).length) html += '<div class="tags">' +
    it.tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
  body.innerHTML = html;
  card.appendChild(body);
  return card;
}

function toggleStar(w){
  var i = starred.indexOf(w);
  if(i < 0){ starred.push(w); } else { starred.splice(i, 1); }
  localStorage.setItem('vocab-star-' + slug, JSON.stringify(starred));
}

/* ── controls ──────────────────────────────────────────────── */
document.getElementById('search').addEventListener('input', function(e){
  query = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById('starBtn').addEventListener('click', function(){
  showStarredOnly = !showStarredOnly;
  this.classList.toggle('on', showStarredOnly);
  render();
});
document.getElementById('sortBtn').addEventListener('click', function(){
  sortMode = sortMode === 'order' ? 'az' : (sortMode === 'az' ? 'pos' : 'order');
  this.textContent = 'Sort: ' + (sortMode === 'order' ? 'order' : (sortMode === 'az' ? 'A–Z' : 'part of speech'));
  render();
});

/* ── speech ────────────────────────────────────────────────── */
var voices = [], voiceURI = localStorage.getItem('vocab-voice') || '';
var rate = parseFloat(localStorage.getItem('vocab-rate') || '0.9');
var voiceSel = document.getElementById('voiceSel');
var rateSel = document.getElementById('rateSel');

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices().filter(function(v){ return /^en/i.test(v.lang); });
  voiceSel.innerHTML = '';
  if(!voices.length){
    voiceSel.innerHTML = '<option value="">No English voices found in this browser</option>';
    return;
  }
  voices.forEach(function(v){
    var o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' · ' + v.lang;
    if(v.voiceURI === voiceURI) o.selected = true;
    voiceSel.appendChild(o);
  });
  if(!voiceURI){
    var us = voices.filter(function(v){ return /en[-_]US/i.test(v.lang); })[0];
    voiceURI = (us || voices[0]).voiceURI;
    voiceSel.value = voiceURI;
  }
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  var v = voices.filter(function(x){ return x.voiceURI === voiceURI; })[0];
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
  u.rate = rate;
  speechSynthesis.speak(u);
}

if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
rateSel.value = rate;
document.getElementById('rateVal').textContent = rate.toFixed(2).replace(/0$/, '');
voiceSel.addEventListener('change', function(){
  voiceURI = this.value;
  localStorage.setItem('vocab-voice', voiceURI);
});
rateSel.addEventListener('input', function(){
  rate = parseFloat(this.value);
  document.getElementById('rateVal').textContent = rate.toFixed(2).replace(/0$/, '');
  localStorage.setItem('vocab-rate', String(rate));
});
document.getElementById('testVoice').addEventListener('click', function(){
  speak('The vacancy was filled internally before it was ever advertised.');
});
var voiceModal = document.getElementById('voiceModal');
document.getElementById('voiceBtn').addEventListener('click', function(){ voiceModal.classList.add('show'); });
document.getElementById('closeVoice').addEventListener('click', function(){ voiceModal.classList.remove('show'); });
voiceModal.addEventListener('click', function(e){ if(e.target === voiceModal) voiceModal.classList.remove('show'); });

/* ── board mode ────────────────────────────────────────────── */
var board = document.getElementById('board');
function openBoard(){
  boardList = VIEW.length ? VIEW.slice() : ITEMS.slice();
  boardIdx = 0;
  board.classList.add('show');
  showBoard();
}
function showBoard(){
  var it = boardList[boardIdx];
  if(!it) return;
  document.getElementById('boardCount').textContent = (boardIdx + 1) + ' / ' + boardList.length;
  document.getElementById('boardWord').textContent = it.word;
  document.getElementById('boardPos').textContent = it.pos;
  document.getElementById('boardDef').textContent = it.def;
  document.getElementById('boardEx').textContent = '“' + it.ex + '”';
  document.getElementById('boardColls').textContent = (it.colls || []).join('  ·  ');
  document.getElementById('boardReveal').classList.remove('show');
}
function moveBoard(d){
  boardIdx = (boardIdx + d + boardList.length) % boardList.length;
  showBoard();
}
document.getElementById('boardBtn').addEventListener('click', openBoard);
document.getElementById('bNext').addEventListener('click', function(){ moveBoard(1); });
document.getElementById('bPrev').addEventListener('click', function(){ moveBoard(-1); });
document.getElementById('bReveal').addEventListener('click', function(){
  document.getElementById('boardReveal').classList.toggle('show');
});
document.getElementById('bSay').addEventListener('click', function(){
  if(boardList[boardIdx]) speak(boardList[boardIdx].word);
});
document.getElementById('bShuffle').addEventListener('click', function(){
  for(var i = boardList.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = boardList[i];
    boardList[i] = boardList[j]; boardList[j] = t;
  }
  boardIdx = 0;
  showBoard();
});
document.getElementById('bExit').addEventListener('click', function(){ board.classList.remove('show'); });

document.addEventListener('keydown', function(e){
  if(!board.classList.contains('show')) return;
  if(e.key === 'Escape'){ board.classList.remove('show'); }
  else if(e.key === 'ArrowRight'){ moveBoard(1); }
  else if(e.key === 'ArrowLeft'){ moveBoard(-1); }
  else if(e.key === ' '){ e.preventDefault(); document.getElementById('boardReveal').classList.toggle('show'); }
  else if(e.key === 's' || e.key === 'S'){ document.getElementById('bShuffle').click(); }
});

window.addEventListener('hashchange', function(){ location.reload(); });
load();
</script>
</body>
</html>
