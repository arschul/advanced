<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary · Advanced Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e12;--surface:#15171c;--surface2:#1b1e25;--text:#eef0f2;--muted:#8b929c;--border:#262932;
    --violet:#a78bfa;--violet-deep:#1c1433;--violet-line:rgba(167,139,250,0.35);
    --key-accent:#f0c75e;--key-deep:#2a2206;--radius:18px;
  }
  :root[data-theme="light"]{
    --bg:#f4f1ea;--surface:#ffffff;--surface2:#faf8f3;--text:#1a1815;--muted:#6b6660;--border:#e2ddd2;
    --violet:#7c3aed;--violet-deep:#ede9fe;--violet-line:rgba(124,58,237,0.3);
    --key-accent:#b8860b;--key-deep:#fbf2dc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;line-height:1.65;transition:background .3s,color .3s}
  .theme-toggle{position:fixed;top:1.25rem;right:1.25rem;z-index:30;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;
    align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s}
  .theme-toggle:hover{border-color:var(--text);color:var(--text);transform:scale(1.06)}
  .wrap{width:100%;max-width:980px;padding:4.5rem 1.5rem 4rem}
  .back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:500;color:var(--muted);
    text-decoration:none;margin-bottom:2.5rem;transition:color .2s}
  .back-link:hover{color:var(--violet)}
  .eyebrow{font-size:.72rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:1.1rem}
  h1{font-family:'Fraunces',serif;font-weight:700;font-optical-sizing:auto;font-size:clamp(2.2rem,5.5vw,3.4rem);
    line-height:1.05;letter-spacing:-1.5px;margin-bottom:.9rem}
  h1 .accent{background:linear-gradient(90deg,var(--violet),#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--muted);font-size:1.05rem;max-width:560px;font-weight:300;line-height:1.7;margin-bottom:2rem}

  /* ── CONTROLS ─────────────────────────────────────────────── */
  .controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.25rem}
  .search{flex:1 1 220px;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:.6rem .9rem;color:var(--text);font-family:inherit;font-size:.9rem}
  .search:focus{outline:none;border-color:var(--violet)}
  .btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.6rem .95rem;color:var(--muted);
    font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
  .btn:hover{border-color:var(--violet);color:var(--text)}
  .btn.on{border-color:var(--violet);color:var(--violet);background:var(--violet-deep)}
  .btn.primary{border-color:var(--violet-line);color:var(--violet)}
  .filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.6rem}
  .pill{background:none;border:1px solid var(--border);border-radius:999px;padding:.28rem .75rem;color:var(--muted);
    font-family:inherit;font-size:.75rem;cursor:pointer;transition:all .15s}
  .pill:hover{color:var(--text)}
  .pill.on{border-color:var(--violet);color:var(--violet);background:var(--violet-deep)}
  .count{font-size:.78rem;color:var(--muted);margin-bottom:1rem}

  /* ── WORD CARDS ───────────────────────────────────────────── */
  .list{display:flex;flex-direction:column;gap:.7rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s}
  .card.open{border-color:var(--violet-line)}
  .card-hd{display:flex;align-items:center;gap:.75rem;padding:.95rem 1.1rem;cursor:pointer}
  .card-hd:hover .word{color:var(--violet)}
  .word{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;letter-spacing:-.3px;transition:color .18s}
  .pos{font-size:.7rem;font-style:italic;color:var(--muted);flex-shrink:0}
  .def{flex:1;font-size:.88rem;color:var(--muted);font-weight:300;text-align:right;min-width:0}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:.15rem .3rem;
    border-radius:6px;line-height:1;transition:all .15s;flex-shrink:0}
  .icon-btn:hover{color:var(--violet);background:var(--violet-deep)}
  .icon-btn.starred{color:var(--key-accent)}
  .card-body{display:none;padding:0 1.1rem 1.15rem;border-top:1px solid var(--border);margin-top:.1rem;padding-top:1rem}
  .card.open .card-body{display:block}
  .row{display:grid;grid-template-columns:96px 1fr;gap:.7rem;margin-bottom:.7rem;font-size:.88rem}
  .row:last-child{margin-bottom:0}
  .row .lbl{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;padding-top:.28rem}
  .row .val{font-weight:300;line-height:1.7}
  .row .val em{color:var(--text);font-style:italic;font-weight:400}
  .colls{list-style:none;display:flex;flex-direction:column;gap:.18rem}
  .colls li::before{content:'·';color:var(--violet);margin-right:.5rem}
  .row.pit .val{border-left:2px solid var(--key-accent);padding-left:.75rem;background:var(--key-deep);border-radius:0 6px 6px 0;padding:.4rem .75rem}
  :root[data-theme="light"] .row.pit .val{background:var(--key-deep)}
  .tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.85rem}
  .tag{font-size:.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);
    border-radius:5px;padding:.1rem .45rem}
  .empty{text-align:center;color:var(--muted);font-weight:300;padding:3rem 1rem}

  /* ── MODAL ────────────────────────────────────────────────── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:center;justify-content:center;padding:1.5rem}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;max-width:420px;width:100%}
  .modal h3{font-family:'Fraunces',serif;font-size:1.25rem;margin-bottom:1.1rem}
  .field{margin-bottom:1.1rem}
  .field label{display:block;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
  .field select,.field input[type=range]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;
    padding:.55rem .7rem;color:var(--text);font-family:inherit;font-size:.88rem}
  .field input[type=range]{padding:.4rem 0}
  .modal-actions{display:flex;gap:.6rem;justify-content:flex-end}

  /* ── BOARD MODE ───────────────────────────────────────────── */
  .board{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:2rem;text-align:center}
  .board.show{display:flex}
  .board-word{font-family:'Fraunces',serif;font-size:clamp(2.8rem,9vw,6rem);font-weight:700;letter-spacing:-2px;line-height:1.05}
  .board-pos{font-size:1rem;font-style:italic;color:var(--muted);margin-top:.5rem}
  .board-reveal{max-width:720px;margin-top:2rem;display:none}
  .board-reveal.show{display:block}
  .board-def{font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:300;line-height:1.6;margin-bottom:1.2rem}
  .board-ex{font-size:clamp(1rem,2vw,1.25rem);font-style:italic;color:var(--violet);font-weight:300;line-height:1.6}
  .board-colls{margin-top:1.2rem;font-size:1rem;color:var(--muted);font-weight:300}
  .board-bar{position:fixed;bottom:1.4rem;left:0;right:0;display:flex;gap:.6rem;justify-content:center;align-items:center}
  .board-pos-count{position:fixed;top:1.4rem;left:1.6rem;font-size:.8rem;color:var(--muted);letter-spacing:2px}
  .hint{position:fixed;bottom:4.6rem;left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted);letter-spacing:1px}

  /* ── TABS & PANES ─────────────────────────────────────────── */
  .tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--border);margin-bottom:1.4rem}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:.6rem .9rem;color:var(--muted);
    font-family:inherit;font-size:.88rem;font-weight:500;cursor:pointer;transition:all .18s;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--violet);border-bottom-color:var(--violet)}
  .pane{display:none}
  .pane.on{display:block}

  /* ── FLASHCARDS ───────────────────────────────────────────── */
  .fc-top{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
  .fc-boxes{display:flex;gap:.45rem;font-size:.72rem;color:var(--muted)}
  .fc-box{border:1px solid var(--border);border-radius:7px;padding:.15rem .55rem}
  .fc-box b{color:var(--text);font-weight:600}
  .fc-box.b1{border-color:var(--violet-line)}
  .fc-box.b3{border-color:var(--key-accent)}
  .fc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-height:280px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:2.5rem 1.6rem;cursor:pointer;margin-bottom:1rem}
  .fc-card:hover{border-color:var(--violet-line)}
  .fc-front{font-family:'Fraunces',serif;font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:600;letter-spacing:-1px;line-height:1.15}
  .fc-front.small{font-family:'DM Sans',sans-serif;font-size:clamp(1.05rem,2.4vw,1.35rem);font-weight:300;max-width:560px;line-height:1.6}
  .fc-pos{font-size:.85rem;font-style:italic;color:var(--muted);margin-top:.45rem}
  .fc-back{display:none;margin-top:1.5rem;max-width:600px}
  .fc-back.show{display:block}
  .fc-def{font-size:1.02rem;font-weight:300;line-height:1.6;margin-bottom:.9rem}
  .fc-answer{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;margin-bottom:.7rem}
  .fc-ex{font-size:.92rem;font-style:italic;color:var(--violet);font-weight:300;line-height:1.6;margin-bottom:.8rem}
  .fc-colls{font-size:.82rem;color:var(--muted);font-weight:300}
  .fc-bar{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
  .fc-hint{text-align:center;font-size:.72rem;color:var(--muted);letter-spacing:1px;margin-top:.9rem}
  .fc-done{text-align:center;padding:3rem 1rem}
  .fc-done h3{font-family:'Fraunces',serif;font-size:1.6rem;margin-bottom:.6rem}
  .fc-done p{color:var(--muted);font-weight:300;margin-bottom:1.3rem}

  /* ── PRACTICE ─────────────────────────────────────────────── */
  .q{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:.8rem}
  .q-meta{font-size:.66rem;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin-bottom:.55rem}
  .q-prompt{font-size:1rem;font-weight:400;line-height:1.65;margin-bottom:.9rem}
  .q-prompt .blank{color:var(--violet);font-weight:600;letter-spacing:1px}
  .q-prompt .cue{font-family:'Fraunces',serif;font-weight:600}
  .opts{display:flex;flex-wrap:wrap;gap:.45rem}
  .opt{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:.45rem .85rem;color:var(--text);
    font-family:inherit;font-size:.88rem;cursor:pointer;transition:all .15s}
  .opt:hover:not(:disabled){border-color:var(--violet);color:var(--violet)}
  .opt:disabled{cursor:default;opacity:.55}
  .opt.right{border-color:var(--violet);background:var(--violet-deep);color:var(--violet);opacity:1}
  .opt.wrong{border-color:#f87171;color:#f87171;opacity:1}
  .type-row{display:flex;gap:.45rem;align-items:center}
  .type-row input{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:.45rem .8rem;
    color:var(--text);font-family:inherit;font-size:.9rem;width:190px}
  .type-row input:focus{outline:none;border-color:var(--violet)}
  .q-fb{font-size:.85rem;font-weight:300;margin-top:.75rem;padding-left:.75rem;border-left:2px solid var(--border);display:none}
  .q-fb.show{display:block}
  .q-fb.ok{border-color:var(--violet)}
  .q-fb.no{border-color:var(--key-accent)}
  .q-fb b{font-weight:600;color:var(--text)}
  .score{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:.9rem 0;
    font-size:.9rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
  .score b{font-family:'Fraunces',serif;font-size:1.15rem}

  @media(max-width:600px){
    .wrap{padding:3.5rem 1.1rem 3rem}
    .def{display:none}
    .row{grid-template-columns:1fr;gap:.15rem}
    .row .lbl{padding-top:0}
  }
  @media print{
    .theme-toggle,.controls,.filters,.board,.overlay,.back-link,.count,.tabs,#pane-cards,#pane-practice{display:none!important}
    #pane-study{display:block!important}
    body{background:#fff;color:#000}
    .card,.card-body{display:block!important;border-color:#ccc;break-inside:avoid}
    .def{text-align:left}
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" aria-label="Switch theme">🌙</button>

<div class="wrap">
  <a class="back-link" href="index.html">← Vocabulary</a>
  <div class="eyebrow" id="eyebrow">C1 Vocabulary</div>
  <h1><span class="accent" id="title">Loading</span></h1>
  <p class="lede" id="lede"></p>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Search words, collocations, notes…" autocomplete="off">
    <button class="btn" id="starBtn">★ Starred</button>
    <button class="btn" id="sortBtn">Sort: order</button>
    <button class="btn primary" id="boardBtn">Board mode</button>
    <button class="btn" id="voiceBtn" aria-label="Audio settings">🔊</button>
  </div>
  <div class="filters" id="filters"></div>

  <div class="tabs">
    <button class="tab on" data-pane="study">Study</button>
    <button class="tab" data-pane="cards">Flashcards</button>
    <button class="tab" data-pane="practice">Practice</button>
  </div>

  <div class="pane on" id="pane-study">
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </div>

  <div class="pane" id="pane-cards">
    <div class="fc-top">
      <div class="fc-boxes" id="fcBoxes"></div>
      <div style="display:flex;gap:.5rem">
        <button class="btn" id="fcDir">Word → meaning</button>
        <button class="btn" id="fcRestart">Restart</button>
      </div>
    </div>
    <div id="fcStage"></div>
  </div>

  <div class="pane" id="pane-practice">
    <div class="controls">
      <button class="btn primary" id="pNew">New set</button>
      <button class="btn" id="pLen">12 questions</button>
      <span class="count" id="pBest" style="margin:0 0 0 auto"></span>
    </div>
    <div class="filters" id="pTypes"></div>
    <div id="quiz"></div>
    <div class="score" id="score" style="display:none">
      <span id="scoreText"></span>
      <button class="btn primary" id="pAgain">Another set</button>
    </div>
  </div>
</div>

<div class="overlay" id="voiceModal">
  <div class="modal">
    <h3>Audio</h3>
    <div class="field">
      <label for="voiceSel">Voice</label>
      <select id="voiceSel"></select>
    </div>
    <div class="field">
      <label for="rateSel">Speed — <span id="rateVal">0.9</span>×</label>
      <input type="range" id="rateSel" min="0.6" max="1.2" step="0.05" value="0.9">
    </div>
    <div class="modal-actions">
      <button class="btn" id="testVoice">Test</button>
      <button class="btn primary" id="closeVoice">Done</button>
    </div>
  </div>
</div>

<div class="board" id="board">
  <div class="board-pos-count" id="boardCount"></div>
  <div class="board-word" id="boardWord"></div>
  <div class="board-pos" id="boardPos"></div>
  <div class="board-reveal" id="boardReveal">
    <div class="board-def" id="boardDef"></div>
    <div class="board-ex" id="boardEx"></div>
    <div class="board-colls" id="boardColls"></div>
  </div>
  <div class="hint" id="boardHint">Space reveals · ← → moves · S shuffles · Esc exits</div>
  <div class="board-bar">
    <button class="btn" id="bPrev">←</button>
    <button class="btn" id="bSay">🔊</button>
    <button class="btn primary" id="bReveal">Reveal</button>
    <button class="btn" id="bShuffle">Shuffle</button>
    <button class="btn" id="bNext">→</button>
    <button class="btn" id="bExit">Exit</button>
  </div>
</div>

<script>
/* ── theme ─────────────────────────────────────────────────── */
var themeBtn = document.getElementById('themeBtn');
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'light' ? '☀️' : '🌙';
  localStorage.setItem('vocab-theme', t);
}
setTheme(localStorage.getItem('vocab-theme') === 'light' ? 'light' : 'dark');
themeBtn.addEventListener('click', function(){
  setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
});

/* ── state ─────────────────────────────────────────────────── */
var THEME = null, ITEMS = [], VIEW = [], starred = [], slug = '';
var showStarredOnly = false, sortMode = 'order', activeTags = [], query = '';
var boardIdx = 0, boardList = [];

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* ── data loading ──────────────────────────────────────────── */
var target = '';
function load(){
  var parts = (location.hash || '#work').slice(1).split('/');
  slug = parts[0].replace(/[^a-z0-9-]/g, '');
  target = parts[1] ? decodeURIComponent(parts[1]) : '';
  if(!slug) slug = 'work';
  var s = document.createElement('script');
  s.src = 'data/' + slug + '.js';
  s.onload = start;
  s.onerror = function(){
    document.getElementById('title').textContent = 'Theme not found';
    document.getElementById('lede').textContent = 'No word list is published at data/' + slug + '.js yet. Go back and pick a live theme.';
  };
  document.head.appendChild(s);
}

function start(){
  THEME = (window.VOCAB || {})[slug];
  if(!THEME){ return; }
  ITEMS = THEME.items;
  document.title = THEME.title + ' · C1 Vocabulary';
  document.getElementById('title').textContent = THEME.title;
  document.getElementById('lede').textContent = THEME.blurb;
  document.getElementById('eyebrow').textContent = 'C1 Vocabulary · ' + ITEMS.length + ' words';
  try{ starred = JSON.parse(localStorage.getItem('vocab-star-' + slug) || '[]'); }catch(e){ starred = []; }
  buildFilters();
  render();
  loadBoxes();
  drawBest();
  if(target) focusWord(target);
}

function focusWord(w){
  var idx = VIEW.map(function(it){ return it.word; }).indexOf(w);
  if(idx < 0) return;
  var card = document.getElementById('list').children[idx];
  if(!card) return;
  card.classList.add('open');
  card.scrollIntoView({behavior: 'smooth', block: 'center'});
}

/* ── filters ───────────────────────────────────────────────── */
function buildFilters(){
  var tags = [];
  ITEMS.forEach(function(it){
    (it.tags || []).forEach(function(t){ if(tags.indexOf(t) < 0) tags.push(t); });
  });
  tags.sort();
  var box = document.getElementById('filters');
  box.innerHTML = '';
  tags.forEach(function(t){
    var b = document.createElement('button');
    b.className = 'pill';
    b.textContent = t;
    b.addEventListener('click', function(){
      var i = activeTags.indexOf(t);
      if(i < 0){ activeTags.push(t); } else { activeTags.splice(i, 1); }
      b.classList.toggle('on');
      render();
    });
    box.appendChild(b);
  });
}

function matches(it){
  if(showStarredOnly && starred.indexOf(it.word) < 0) return false;
  if(activeTags.length){
    var has = activeTags.every(function(t){ return (it.tags || []).indexOf(t) >= 0; });
    if(!has) return false;
  }
  if(query){
    var hay = [it.word, it.def, it.ex, it.note, it.pitfall, it.family, (it.colls || []).join(' '), it.contrast ? it.contrast.good + ' ' + it.contrast.why : ''].join(' ').toLowerCase();
    if(hay.indexOf(query) < 0) return false;
  }
  return true;
}

/* ── render ────────────────────────────────────────────────── */
function render(){
  VIEW = ITEMS.filter(matches);
  if(sortMode === 'az'){
    VIEW = VIEW.slice().sort(function(a, b){ return a.word.localeCompare(b.word); });
  } else if(sortMode === 'pos'){
    VIEW = VIEW.slice().sort(function(a, b){
      return a.pos.localeCompare(b.pos) || a.word.localeCompare(b.word);
    });
  }
  document.getElementById('count').textContent =
    VIEW.length + ' of ' + ITEMS.length + ' words' + (starred.length ? ' · ' + starred.length + ' starred' : '');
  var list = document.getElementById('list');
  list.innerHTML = '';
  if(!VIEW.length){
    list.innerHTML = '<div class="empty">Nothing matches those filters. Clear the search or the tags.</div>';
    return;
  }
  VIEW.forEach(function(it){ list.appendChild(cardFor(it)); });
}

function cardFor(it){
  var card = document.createElement('div');
  card.className = 'card';

  var hd = document.createElement('div');
  hd.className = 'card-hd';
  hd.innerHTML =
    '<span class="word">' + esc(it.word) + '</span>' +
    '<span class="pos">' + esc(it.pos) + '</span>' +
    '<span class="def">' + esc(it.def) + '</span>';

  var say = document.createElement('button');
  say.className = 'icon-btn';
  say.textContent = '🔊';
  say.title = 'Hear it';
  say.addEventListener('click', function(e){ e.stopPropagation(); speak(it.word); });

  var star = document.createElement('button');
  star.className = 'icon-btn' + (starred.indexOf(it.word) >= 0 ? ' starred' : '');
  star.textContent = starred.indexOf(it.word) >= 0 ? '★' : '☆';
  star.title = 'Star this word';
  star.addEventListener('click', function(e){
    e.stopPropagation();
    toggleStar(it.word);
    star.textContent = starred.indexOf(it.word) >= 0 ? '★' : '☆';
    star.classList.toggle('starred', starred.indexOf(it.word) >= 0);
    if(showStarredOnly) render();
    else document.getElementById('count').textContent =
      VIEW.length + ' of ' + ITEMS.length + ' words' + (starred.length ? ' · ' + starred.length + ' starred' : '');
  });

  hd.appendChild(say);
  hd.appendChild(star);
  hd.addEventListener('click', function(){ card.classList.toggle('open'); });
  card.appendChild(hd);

  var body = document.createElement('div');
  body.className = 'card-body';
  var html = '';
  html += '<div class="row"><div class="lbl">Collocations</div><div class="val"><ul class="colls">' +
    (it.colls || []).map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div></div>';
  html += '<div class="row"><div class="lbl">In use</div><div class="val"><em>' + esc(it.ex) + '</em></div></div>';
  if(it.note) html += '<div class="row"><div class="lbl">Usage</div><div class="val">' + esc(it.note) + '</div></div>';
  if(it.pitfall) html += '<div class="row pit"><div class="lbl">Watch out</div><div class="val">' + esc(it.pitfall) + '</div></div>';
  if(it.family) html += '<div class="row"><div class="lbl">Word family</div><div class="val">' + esc(it.family) + '</div></div>';
  if(it.contrast) html += '<div class="row"><div class="lbl">Say this</div><div class="val">' +
    esc(it.contrast.good) + ' <span style="color:var(--muted)">not</span> ' + esc(it.contrast.bad) + '</div></div>';
  if((it.tags || []).length) html += '<div class="tags">' +
    it.tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
  body.innerHTML = html;
  card.appendChild(body);
  return card;
}

function toggleStar(w){
  var i = starred.indexOf(w);
  if(i < 0){ starred.push(w); } else { starred.splice(i, 1); }
  localStorage.setItem('vocab-star-' + slug, JSON.stringify(starred));
}

/* ── speech ────────────────────────────────────────────────── */
var voices = [], voiceURI = localStorage.getItem('vocab-voice') || '';
var rate = parseFloat(localStorage.getItem('vocab-rate') || '0.9');
var voiceSel = document.getElementById('voiceSel');
var rateSel = document.getElementById('rateSel');

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices().filter(function(v){ return /^en/i.test(v.lang); });
  voiceSel.innerHTML = '';
  if(!voices.length){
    voiceSel.innerHTML = '<option value="">No English voices found in this browser</option>';
    return;
  }
  voices.forEach(function(v){
    var o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' · ' + v.lang;
    if(v.voiceURI === voiceURI) o.selected = true;
    voiceSel.appendChild(o);
  });
  if(!voiceURI){
    var us = voices.filter(function(v){ return /en[-_]US/i.test(v.lang); })[0];
    voiceURI = (us || voices[0]).voiceURI;
    voiceSel.value = voiceURI;
  }
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  var v = voices.filter(function(x){ return x.voiceURI === voiceURI; })[0];
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
  u.rate = rate;
  speechSynthesis.speak(u);
}

if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
rateSel.value = rate;
document.getElementById('rateVal').textContent = rate.toFixed(2).replace(/0$/, '');
voiceSel.addEventListener('change', function(){
  voiceURI = this.value;
  localStorage.setItem('vocab-voice', voiceURI);
});
rateSel.addEventListener('input', function(){
  rate = parseFloat(this.value);
  document.getElementById('rateVal').textContent = rate.toFixed(2).replace(/0$/, '');
  localStorage.setItem('vocab-rate', String(rate));
});
document.getElementById('testVoice').addEventListener('click', function(){
  speak('The vacancy was filled internally before it was ever advertised.');
});
var voiceModal = document.getElementById('voiceModal');
document.getElementById('voiceBtn').addEventListener('click', function(){ voiceModal.classList.add('show'); });
document.getElementById('closeVoice').addEventListener('click', function(){ voiceModal.classList.remove('show'); });

/* ── board mode ────────────────────────────────────────────── */
var board = document.getElementById('board');
function openBoard(){
  boardList = VIEW.length ? VIEW.slice() : ITEMS.slice();
  boardIdx = 0;
  board.classList.add('show');
  showBoard();
}
function showBoard(){
  var it = boardList[boardIdx];
  if(!it) return;
  document.getElementById('boardCount').textContent = (boardIdx + 1) + ' / ' + boardList.length;
  document.getElementById('boardWord').textContent = it.word;
  document.getElementById('boardPos').textContent = it.pos;
  document.getElementById('boardDef').textContent = it.def;
  document.getElementById('boardEx').textContent = '“' + it.ex + '”';
  document.getElementById('boardColls').textContent = (it.colls || []).join('  ·  ');
  document.getElementById('boardReveal').classList.remove('show');
}
function moveBoard(d){
  boardIdx = (boardIdx + d + boardList.length) % boardList.length;
  showBoard();
}
document.getElementById('boardBtn').addEventListener('click', openBoard);
document.getElementById('bNext').addEventListener('click', function(){ moveBoard(1); });
document.getElementById('bPrev').addEventListener('click', function(){ moveBoard(-1); });
document.getElementById('bReveal').addEventListener('click', function(){
  document.getElementById('boardReveal').classList.toggle('show');
});
document.getElementById('bSay').addEventListener('click', function(){
  if(boardList[boardIdx]) speak(boardList[boardIdx].word);
});
document.getElementById('bShuffle').addEventListener('click', function(){
  for(var i = boardList.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = boardList[i];
    boardList[i] = boardList[j]; boardList[j] = t;
  }
  boardIdx = 0;
  showBoard();
});
document.getElementById('bExit').addEventListener('click', function(){ board.classList.remove('show'); });

document.addEventListener('keydown', function(e){
  if(!board.classList.contains('show')) return;
  if(e.key === 'Escape'){ board.classList.remove('show'); }
  else if(e.key === 'ArrowRight'){ moveBoard(1); }
  else if(e.key === 'ArrowLeft'){ moveBoard(-1); }
  else if(e.key === ' '){ e.preventDefault(); document.getElementById('boardReveal').classList.toggle('show'); }
  else if(e.key === 's' || e.key === 'S'){ document.getElementById('bShuffle').click(); }
});


/* ── mode tabs ─────────────────────────────────────────────── */
var MODE = 'study';
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
  t.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
    Array.prototype.forEach.call(document.querySelectorAll('.pane'), function(x){ x.classList.remove('on'); });
    t.classList.add('on');
    MODE = t.getAttribute('data-pane');
    document.getElementById('pane-' + MODE).classList.add('on');
    if(MODE === 'cards') startCards();
    if(MODE === 'practice' && !document.getElementById('quiz').children.length) newSet();
  });
});

function pool(){
  var p = ITEMS.filter(matches);
  return p.length ? p : ITEMS.slice();
}
function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i];
    a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ── flashcards: three-box Leitner ─────────────────────────── */
var boxes = {}, queue = [], reviewed = 0, dir = 'w2m', flipped = false;

function loadBoxes(){
  try{ boxes = JSON.parse(localStorage.getItem('vocab-box-' + slug) || '{}'); }catch(e){ boxes = {}; }
}
function saveBoxes(){ localStorage.setItem('vocab-box-' + slug, JSON.stringify(boxes)); }
function boxOf(w){ return boxes[w] || 1; }

function drawBoxes(){
  var p = pool(), c = [0, 0, 0];
  p.forEach(function(it){ c[boxOf(it.word) - 1]++; });
  document.getElementById('fcBoxes').innerHTML =
    '<span class="fc-box b1">New / again <b>' + c[0] + '</b></span>' +
    '<span class="fc-box b2">Getting there <b>' + c[1] + '</b></span>' +
    '<span class="fc-box b3">Known <b>' + c[2] + '</b></span>';
}

function startCards(){
  loadBoxes();
  var p = pool();
  queue = shuffle(p.filter(function(it){ return boxOf(it.word) === 1; }))
    .concat(shuffle(p.filter(function(it){ return boxOf(it.word) === 2; })))
    .concat(shuffle(p.filter(function(it){ return boxOf(it.word) === 3; })));
  reviewed = 0;
  drawBoxes();
  nextCard();
}

function nextCard(){
  flipped = false;
  var stage = document.getElementById('fcStage');
  if(!queue.length){
    var left = pool().filter(function(it){ return boxOf(it.word) === 1; }).length;
    stage.innerHTML = '<div class="fc-done"><h3>Session complete</h3><p>' + reviewed +
      ' cards reviewed · ' + left + ' still in the first box.</p>' +
      '<button class="btn primary" id="fcAgain">Run it again</button></div>';
    document.getElementById('fcAgain').addEventListener('click', startCards);
    drawBoxes();
    return;
  }
  var it = queue[0];
  var frontWord = dir === 'w2m';
  stage.innerHTML =
    '<div class="fc-card" id="fcCard">' +
      '<div class="fc-front' + (frontWord ? '' : ' small') + '" id="fcFront">' +
        esc(frontWord ? it.word : it.def) + '</div>' +
      (frontWord ? '<div class="fc-pos">' + esc(it.pos) + '</div>' : '') +
      '<div class="fc-back" id="fcBack">' +
        (frontWord
          ? '<div class="fc-def">' + esc(it.def) + '</div>'
          : '<div class="fc-answer">' + esc(it.word) + '</div>') +
        '<div class="fc-ex">' + esc(it.ex) + '</div>' +
        '<div class="fc-colls">' + (it.colls || []).map(esc).join('  ·  ') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="fc-bar">' +
      '<button class="btn" id="fcSay">🔊</button>' +
      '<button class="btn primary" id="fcFlip">Flip</button>' +
      '<button class="btn" id="fcAgainBtn">Again</button>' +
      '<button class="btn" id="fcGot">Got it</button>' +
    '</div>' +
    '<div class="fc-hint">Space flips · 1 again · 2 got it</div>';
  document.getElementById('fcCard').addEventListener('click', flip);
  document.getElementById('fcFlip').addEventListener('click', function(e){ e.stopPropagation(); flip(); });
  document.getElementById('fcSay').addEventListener('click', function(e){ e.stopPropagation(); speak(it.word); });
  document.getElementById('fcAgainBtn').addEventListener('click', function(e){ e.stopPropagation(); grade(0); });
  document.getElementById('fcGot').addEventListener('click', function(e){ e.stopPropagation(); grade(1); });
}

function flip(){
  var b = document.getElementById('fcBack');
  if(!b) return;
  flipped = !flipped;
  b.classList.toggle('show', flipped);
}

function grade(ok){
  var it = queue.shift();
  if(!it) return;
  reviewed++;
  if(ok){
    boxes[it.word] = Math.min(3, boxOf(it.word) + 1);
  } else {
    boxes[it.word] = 1;
    queue.push(it);
  }
  saveBoxes();
  drawBoxes();
  nextCard();
}

document.getElementById('fcDir').addEventListener('click', function(){
  dir = dir === 'w2m' ? 'm2w' : 'w2m';
  this.textContent = dir === 'w2m' ? 'Word → meaning' : 'Meaning → word';
  nextCard();
});
document.getElementById('fcRestart').addEventListener('click', startCards);

document.addEventListener('keydown', function(e){
  if(MODE !== 'cards' || board.classList.contains('show') || voiceModal.classList.contains('show')) return;
  if(e.target.tagName === 'INPUT') return;
  if(e.key === ' '){ e.preventDefault(); flip(); }
  else if(e.key === '1'){ grade(0); }
  else if(e.key === '2'){ grade(1); }
});

/* ── practice: generated exercise sets ─────────────────────── */
var TYPES = [
  {id: 'coll', label: 'Collocation', on: true},
  {id: 'def',  label: 'Definition',  on: true},
  {id: 'form', label: 'Word form',   on: true},
  {id: 'ctx',  label: 'In context',  on: true},
  {id: 'reg',  label: 'Register',     on: true}
];
var setLen = 12, score = 0, answered = 0, total = 0;

function blankOut(phrase, headword){
  var heads = headword.toLowerCase().split(/[\s-]+/).filter(function(h){ return h.length > 2; });
  if(!heads.length) return null;
  var seen = {};
  var out = phrase.split(/([\s-]+)/).map(function(tok){
    var clean = tok.toLowerCase().replace(/[^a-z-]/g, '');
    if(!clean) return tok;
    var hit = null;
    heads.forEach(function(h){
      var n = Math.min(5, h.length);
      if(clean.slice(0, n) === h.slice(0, n)) hit = h;
    });
    if(hit){ seen[hit] = 1; return '\u2588BLANK\u2588'; }
    return tok;
  }).join('');
  // a multi-word headword must match in full, or the blank reads as nonsense
  if(Object.keys(seen).length < heads.length) return null;
  return out.replace(/(\u2588BLANK\u2588)([\s-]+\u2588BLANK\u2588)+/g, '\u2588BLANK\u2588');
}

function distractors(it, p, n){
  var same = p.filter(function(x){ return x.word !== it.word && x.pos === it.pos; });
  var rest = p.filter(function(x){ return x.word !== it.word && x.pos !== it.pos; });
  return shuffle(same).concat(shuffle(rest)).slice(0, n).map(function(x){ return x.word; });
}

function parseFamily(fam){
  var out = [];
  (fam || '').split('·').forEach(function(part){
    var m = part.trim().match(/^(.+?)\s*\((.+?)\)$/);
    if(m) out.push({form: m[1].trim(), pos: m[2].trim()});
  });
  return out;
}

function makeQ(type, it, p){
  if(type === 'coll'){
    var cs = shuffle(it.colls || []);
    for(var i = 0; i < cs.length; i++){
      var b = blankOut(cs[i], it.word);
      if(b) return {type: 'Collocation', prompt: b, answer: it.word,
        options: shuffle(distractors(it, p, 3).concat([it.word])),
        note: 'Full phrase: ' + cs[i]};
    }
    return null;
  }
  if(type === 'def'){
    return {type: 'Definition', prompt: it.def, answer: it.word,
      options: shuffle(distractors(it, p, 3).concat([it.word])),
      note: it.ex};
  }
  if(type === 'ctx'){
    var b2 = blankOut(it.ex, it.word);
    if(!b2) return null;
    return {type: 'In context', prompt: b2, answer: it.word,
      options: shuffle(distractors(it, p, 3).concat([it.word])),
      note: it.def};
  }
  if(type === 'reg'){
    if(!it.contrast || !it.contrast.good || !it.contrast.bad) return null;
    return {type: 'Register', prompt: 'Which is the natural phrasing?', answer: it.contrast.good,
      options: shuffle([it.contrast.good, it.contrast.bad]),
      note: it.contrast.why};
  }
  if(type === 'form'){
    var fam = parseFamily(it.family);
    if(!fam.length) return null;
    var pick = fam[Math.floor(Math.random() * fam.length)];
    return {type: 'Word form', typed: true,
      prompt: '<span class="cue">' + esc(it.word) + '</span> (' + esc(it.pos) + ')  \u2192  \u2588BLANK\u2588 (' + esc(pick.pos) + ')',
      answer: pick.form, note: it.word + ' · ' + it.family};
  }
  return null;
}

function newSet(){
  var p = pool();
  var active = TYPES.filter(function(t){ return t.on; }).map(function(t){ return t.id; });
  if(!active.length) active = ['def'];
  var items = shuffle(p), qs = [], guard = 0;
  while(qs.length < Math.min(setLen, p.length) && guard < p.length * 6){
    var it = items[guard % items.length];
    var type = active[Math.floor(Math.random() * active.length)];
    var q = makeQ(type, it, p);
    guard++;
    if(q && !qs.some(function(x){ return x.answer === q.answer; })) qs.push(q);
  }
  score = 0; answered = 0; total = qs.length;
  var box = document.getElementById('quiz');
  box.innerHTML = '';
  qs.forEach(function(q, i){ box.appendChild(renderQ(q, i)); });
  document.getElementById('score').style.display = 'flex';
  updateScore();
}

function renderQ(q, i){
  var el = document.createElement('div');
  el.className = 'q';
  var prompt = q.prompt.replace(/\u2588BLANK\u2588/g, '<span class="blank">______</span>');
  var html = '<div class="q-meta">' + (i + 1) + ' · ' + q.type + '</div><div class="q-prompt">' + prompt + '</div>';
  el.innerHTML = html;

  var fb = document.createElement('div');
  fb.className = 'q-fb';

  function settle(correct, chosen){
    answered++;
    if(correct) score++;
    fb.className = 'q-fb show ' + (correct ? 'ok' : 'no');
    fb.innerHTML = (correct ? '<b>Correct.</b> ' : '<b>' + esc(q.answer) + '</b> — ') + esc(q.note || '');
    updateScore();
  }

  if(q.typed){
    var row = document.createElement('div');
    row.className = 'type-row';
    var inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = 'type the form'; inp.autocomplete = 'off';
    var chk = document.createElement('button');
    chk.className = 'btn primary'; chk.textContent = 'Check';
    function check(){
      if(inp.disabled) return;
      var norm = function(x){ return String(x).toLowerCase().replace(/[^a-z ]/g, '').trim(); };
      var ok = norm(inp.value) === norm(q.answer);
      inp.disabled = true; chk.disabled = true;
      inp.style.borderColor = ok ? 'var(--violet)' : '#f87171';
      settle(ok);
    }
    chk.addEventListener('click', check);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') check(); });
    row.appendChild(inp); row.appendChild(chk);
    el.appendChild(row);
  } else {
    var opts = document.createElement('div');
    opts.className = 'opts';
    q.options.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      b.addEventListener('click', function(){
        Array.prototype.forEach.call(opts.children, function(x){ x.disabled = true; });
        var ok = o === q.answer;
        b.classList.add(ok ? 'right' : 'wrong');
        if(!ok){
          Array.prototype.forEach.call(opts.children, function(x){
            if(x.textContent === q.answer) x.classList.add('right');
          });
        }
        settle(ok);
      });
      opts.appendChild(b);
    });
    el.appendChild(opts);
  }
  el.appendChild(fb);
  return el;
}

function updateScore(){
  document.getElementById('scoreText').innerHTML =
    '<b>' + score + '</b> / ' + total + ' · ' + answered + ' answered';
  if(answered === total && total){
    var key = 'vocab-practice-' + slug, st = {sets: 0, best: 0, bestOf: 0};
    try{ st = JSON.parse(localStorage.getItem(key) || '{"sets":0,"best":0,"bestOf":0}'); }catch(e){}
    st.sets = (st.sets || 0) + 1;
    if(score / total >= (st.bestOf ? st.best / st.bestOf : 0)){ st.best = score; st.bestOf = total; }
    localStorage.setItem(key, JSON.stringify(st));
    drawBest();
  }
}

function drawBest(){
  var st = null;
  try{ st = JSON.parse(localStorage.getItem('vocab-practice-' + slug) || 'null'); }catch(e){}
  document.getElementById('pBest').textContent =
    st && st.bestOf ? 'Best ' + st.best + '/' + st.bestOf + ' · ' + st.sets + ' sets' : '';
}

(function buildTypeChips(){
  var box = document.getElementById('pTypes');
  TYPES.forEach(function(t){
    var b = document.createElement('button');
    b.className = 'pill on';
    b.textContent = t.label;
    b.addEventListener('click', function(){
      t.on = !t.on;
      b.classList.toggle('on', t.on);
    });
    box.appendChild(b);
  });
})();
document.getElementById('pNew').addEventListener('click', newSet);
document.getElementById('pAgain').addEventListener('click', function(){
  newSet();
  document.getElementById('quiz').scrollIntoView({behavior: 'smooth', block: 'start'});
});
document.getElementById('pLen').addEventListener('click', function(){
  setLen = setLen === 12 ? 20 : (setLen === 20 ? 8 : 12);
  this.textContent = setLen + ' questions';
});

window.addEventListener('hashchange', function(){ location.reload(); });
load();
