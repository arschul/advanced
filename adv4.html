<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced 4 – Booklet Companion – GrammarHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#f3efe7; --card:#fbf9f4; --raise:#ffffff;
 --ink:#22302a; --ink-soft:#5d6b63; --ink-faint:#8a958d;
 --line:#e5ddd0; --line-soft:#eee7db;
 --brand:#1f6f5c; --brand-soft:#e4efe9; --brand-deep:#144a3d;
 --coral:#e2664a; --coral-soft:#fbe4dc;
 --gold:#cf9526; --gold-soft:#f6ecd4;
 --correct:#1f7a55; --correct-soft:#e2efe6;
 --wrong:#cf4a37; --wrong-soft:#f8e2dd;
 --r:16px; --r-sm:10px; --r-xs:7px;
}
:root[data-theme="dark"]{
 --paper:#121815; --card:#1a221e; --raise:#212b26;
 --ink:#eef2ec; --ink-soft:#a7b3ac; --ink-faint:#788079;
 --line:#2a352f; --line-soft:#232d28;
 --brand:#4bb795; --brand-soft:#1a2a24; --brand-deep:#78d3b6;
 --coral:#f0805f; --coral-soft:#2c211d;
 --gold:#e0b24d; --gold-soft:#2a2417;
 --correct:#4bb488; --correct-soft:#18271f;
 --wrong:#e46a54; --wrong-soft:#2c1d19;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;}
em{font-family:'Newsreader',Georgia,serif;font-style:italic;}

/* ── TOP BAR ── */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:.9rem;height:60px;padding:0 1.1rem;
 background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.burger{display:inline-flex;align-items:center;gap:.45rem;background:none;border:1px solid var(--line);border-radius:100px;height:36px;padding:0 .85rem;font:inherit;font-size:.84rem;font-weight:600;color:var(--ink-soft);cursor:pointer;flex:none;}
.burger:hover{border-color:var(--brand);color:var(--brand);}
.burger b{font-weight:700;}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.02rem;letter-spacing:-.02em;color:var(--brand);text-decoration:none;white-space:nowrap;}
.brand span{color:var(--coral);}
.brand small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
.searchwrap{position:relative;flex:1;max-width:420px;margin-left:auto;}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:.5rem 2.2rem .5rem 2.2rem;font:inherit;font-size:.87rem;color:var(--ink);}
.search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.searchwrap::before{content:'⌕';position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:1.05rem;}
.iconbtn{background:none;border:1px solid var(--line);border-radius:100px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);font-size:.95rem;flex:none;}
.iconbtn:hover{border-color:var(--brand);color:var(--brand);}
.iconbtn[disabled]{opacity:.32;cursor:default;}
.iconbtn[disabled]:hover{border-color:var(--line);color:var(--ink-soft);}
.setnav{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.84rem;color:var(--ink-soft);white-space:nowrap;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;max-width:36vw;}
.setnav b{color:var(--coral);font-weight:800;margin-right:.4rem;}

/* ── LAYOUT ── */
.wrap{display:block;}
.side{position:fixed;top:60px;left:0;z-index:56;width:312px;max-width:86vw;height:calc(100vh - 60px);overflow-y:auto;
 border-right:1px solid var(--line);padding:1.1rem .8rem 4rem;background:var(--paper);
 transform:translateX(-103%);transition:transform .24s ease;box-shadow:0 14px 44px rgba(0,0,0,.18);}
.side.open{transform:none;}
.scrim{display:none;}
.scrim.on{display:block;position:fixed;inset:60px 0 0;background:rgba(0,0,0,.34);z-index:54;}
.side h4{font-family:'DM Sans',sans-serif;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:1.3rem .55rem .5rem;font-weight:700;}
.side h4:first-child{margin-top:.2rem;}
.slink{display:flex;gap:.6rem;align-items:baseline;width:100%;text-align:left;background:none;border:none;border-radius:var(--r-sm);padding:.5rem .55rem;cursor:pointer;color:var(--ink-soft);font:inherit;font-size:.84rem;line-height:1.35;}
.slink:hover{background:var(--card);color:var(--ink);}
.slink.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600;}
.slink .num{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.72rem;color:var(--ink-faint);min-width:1.35rem;flex:none;}
.slink.on .num{color:var(--brand);}
.slink .ttl{flex:1;}
.slink .pip{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;align-self:center;}
.slink .pip.part{background:var(--gold);}
.slink .pip.full{background:var(--brand);}
.slink.hide{display:none;}
.side h4.hide{display:none;}

.main{padding:2rem clamp(1.1rem,3.5vw,3rem) 6rem;max-width:1400px;margin:0 auto;}

/* ── SET HEADER ── */
.shead{border-bottom:1px solid var(--line);padding-bottom:1.4rem;margin-bottom:1.8rem;}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.68rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--coral);background:var(--coral-soft);border-radius:100px;padding:.28rem .7rem;}
.shead h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.08;letter-spacing:-.025em;margin:.8rem 0 .4rem;}
.shead .sub{color:var(--ink-soft);font-size:1rem;max-width:70ch;}
.bar{height:6px;border-radius:100px;background:var(--line-soft);margin-top:1.1rem;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));width:0;transition:width .4s;}
.barlabel{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-faint);margin-top:.45rem;}

/* ── SECTION ── */
.sec{margin:2.4rem 0;}
.sec > h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.22rem;letter-spacing:-.01em;display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;}
.sec > h2 .tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--brand-soft);border-radius:var(--r-xs);padding:.2rem .5rem;flex:none;}

/* learn blocks */
.learn{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem 1.4rem;margin-bottom:1.2rem;}
.learn > * + *{margin-top:.95rem;}
.learn p{font-size:.95rem;color:var(--ink-soft);max-width:82ch;}
.formula{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;text-align:center;background:var(--raise);border:1px dashed var(--brand);border-radius:var(--r-sm);padding:.85rem 1rem;color:var(--brand-deep);letter-spacing:.01em;font-size:.95rem;}
.trick{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:var(--r-xs);padding:.75rem .95rem;font-size:.9rem;color:var(--ink);}
.note{background:var(--coral-soft);border-left:3px solid var(--coral);border-radius:var(--r-xs);padding:.75rem .95rem;font-size:.9rem;}
.egs{display:flex;flex-direction:column;gap:.5rem;}
.egs{max-width:92ch;}
.egs div{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:1.02rem;line-height:1.5;padding-left:1.1rem;position:relative;color:var(--ink);}
.egs div::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold);}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:420px;}
th{text-align:left;font-weight:700;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:.5rem .65rem;border-bottom:1px solid var(--line);}
td{padding:.55rem .65rem;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-soft);}
td:first-child{color:var(--ink);font-weight:500;}
tr:last-child td{border-bottom:none;}

/* ── EXERCISE CARD ── */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem 1.4rem;margin-bottom:1.1rem;}
.ex.done{border-color:var(--brand);}
.exhead{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.35rem;}
.exno{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.78rem;color:var(--raise);background:var(--brand);border-radius:var(--r-xs);padding:.22rem .5rem;flex:none;letter-spacing:.03em;}
.ex.done .exno::after{content:' ✓';}
.exi{font-size:.9rem;color:var(--ink-soft);flex:1;}
.items{margin-top:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:.9rem 2.2rem;align-items:start;}
.items.one{grid-template-columns:minmax(0,1fr);}
.item{display:flex;gap:.7rem;align-items:flex-start;}
.idx{font-family:'Bricolage Grotesque',sans-serif;font-size:.78rem;font-weight:700;color:var(--ink-faint);min-width:1.3rem;padding-top:.35rem;flex:none;}
.body{flex:1;min-width:0;}
.q{font-size:.95rem;line-height:1.75;}
.q em{color:var(--ink);}

input.txt,textarea.txt{font:inherit;font-size:.92rem;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-xs);padding:.35rem .55rem;}
input.txt{min-width:8rem;width:9.5rem;}
input.gapi{width:8.5rem;text-align:center;border-bottom:2px solid var(--brand);border-radius:var(--r-xs) var(--r-xs) 0 0;}
input.txt:focus,textarea.txt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.wide{width:100%;display:block;margin-top:.4rem;}
textarea.txt{width:100%;display:block;margin-top:.45rem;resize:vertical;min-height:2.6rem;line-height:1.6;}
.ok{border-color:var(--correct)!important;background:var(--correct-soft)!important;}
.no{border-color:var(--wrong)!important;background:var(--wrong-soft)!important;}

.opts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem;}
.opt{font:inherit;font-size:.83rem;background:var(--raise);border:1px solid var(--line);border-radius:100px;padding:.28rem .8rem;cursor:pointer;color:var(--ink-soft);transition:.15s;}
.opt:hover{border-color:var(--brand);color:var(--brand);}
.opt.sel{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.opt.sel.good{background:var(--correct);border-color:var(--correct);}
.opt.sel.bad{background:var(--wrong);border-color:var(--wrong);}
.opt.reveal{border-color:var(--correct);color:var(--correct);}
select.txt{font:inherit;font-size:.88rem;padding:.32rem .5rem;border:1px solid var(--line);border-radius:var(--r-xs);background:var(--raise);color:var(--ink);margin-top:.35rem;}

.why{font-size:.83rem;color:var(--ink-soft);margin-top:.4rem;padding-left:.75rem;border-left:2px solid var(--line);display:none;}
.why.show{display:block;}
.why b{color:var(--brand-deep);font-weight:600;}

.row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.1rem;align-items:center;}
.btn{font:inherit;font-size:.85rem;font-weight:600;border-radius:100px;padding:.45rem 1.05rem;cursor:pointer;border:1px solid transparent;}
.btn.primary{background:var(--brand);color:#fff;}
.btn.primary:hover{background:var(--brand-deep);}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--coral);color:var(--coral);}
.score{margin-left:auto;font-size:.83rem;font-weight:600;color:var(--ink-faint);}
.score.good{color:var(--correct);}
.score.part{color:var(--gold);}

.model{margin-top:.45rem;font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:1rem;color:var(--brand-deep);background:var(--brand-soft);border-radius:var(--r-xs);padding:.5rem .7rem;display:none;}
.model.show{display:block;}
.model b{font-family:'DM Sans',sans-serif;font-style:normal;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:.2rem;opacity:.75;}

.project{background:var(--raise);border:1px solid var(--gold);border-radius:var(--r-sm);padding:1rem 1.1rem;font-size:.93rem;}
.project .extra{margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line);color:var(--ink-soft);font-size:.88rem;}

.saved{font-size:.74rem;color:var(--ink-faint);margin-top:.3rem;height:1rem;}

/* ── HOME ── */
.home h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.1rem);line-height:1.03;letter-spacing:-.03em;margin:.9rem 0 .7rem;}
.home h1 span{color:var(--coral);}
.home .lede{color:var(--ink-soft);font-size:1.02rem;max-width:46ch;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(226px,1fr));gap:.9rem;margin-top:1.6rem;}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;cursor:pointer;font:inherit;color:inherit;transition:.2s;position:relative;}
.tile:hover{border-color:var(--brand);transform:translateY(-3px);}
.tile .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.1em;color:var(--coral);}
.tile h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.99rem;line-height:1.25;margin:.35rem 0 .3rem;letter-spacing:-.01em;}
.tile p{font-size:.8rem;color:var(--ink-faint);line-height:1.45;}
.tile .mini{height:4px;border-radius:100px;background:var(--line-soft);margin-top:.8rem;overflow:hidden;}
.tile .mini i{display:block;height:100%;background:var(--brand);width:0;}
.tile.hide{display:none;}
.foot{margin-top:3.5rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-faint);line-height:1.7;}

.pager{display:flex;gap:.6rem;margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--line);}
.pager button{flex:1;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:.75rem .95rem;cursor:pointer;font:inherit;color:var(--ink);}
.pager button:hover{border-color:var(--brand);}
.pager small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.15rem;}
.pager .nx{text-align:right;}
.pager button[disabled]{opacity:.35;cursor:default;}

@media(max-width:880px){
 .burger b{display:none;}
 .burger{padding:0 .7rem;}
 .main{padding:1.4rem 1.1rem 5rem;}
 .brand small{display:none;}
 .searchwrap{max-width:none;}
 .setnav{display:none;}
}
@media(max-width:640px){
 .searchwrap{display:none;}
}
@media print{
 .top,.side,.pager,.row,.scrim{display:none!important;}
 .main{padding:0;max-width:none;}
 .model,.why{display:block!important;}
 .ex,.learn{break-inside:avoid;border-color:#ccc;}
}
</style>
</head>
<body>

<header class="top">
  <button class="burger" id="burger" aria-label="Show set list">☰ <b>Sets</b></button>
  <span class="setnav" id="setnav"></span>
  <a class="brand" href="./index.html" title="Back to the Advanced Hub">Advanced<span>4</span><small>Booklet companion</small></a>
  <div class="searchwrap"><input class="search" id="q" type="search" placeholder="Search sets — conditionals, ellipsis, op-ed…" autocomplete="off" aria-label="Search sets"></div>
  <button class="iconbtn" id="prev" title="Previous set (←)" aria-label="Previous set">‹</button>
  <button class="iconbtn" id="next" title="Next set (→)" aria-label="Next set">›</button>
  <button class="iconbtn" id="print" title="Print this set" aria-label="Print this set">⎙</button>
  <button class="iconbtn" id="theme" title="Light / dark" aria-label="Toggle light or dark">☾</button>
</header>

<div class="scrim" id="scrim"></div>
<div class="wrap">
  <nav class="side" id="side" aria-label="Sets"></nav>
  <main class="main" id="main"></main>
</div>

<script>
/* ══════════ DATA ══════════ */
var DATA=[];
/* ===== SETS 1–5 ===== */
DATA.push(

{n:1,t:"If This, Then That: Mastering Conditionals",s:"Conditional review — zero, first, second, third",grp:"Grammar core",tags:"conditional zero first second third if hypothetical",
 sec:[
  {L:"A",t:"Conditional review – four types",
   learn:[
    {b:"p",x:"Conditionals express cause and effect or hypothetical situations. The verb tense tells you how probable (or real) the situation is."},
    {b:"table",h:["Conditional","Use","If clause","Main clause","Example"],r:[
      ["Zero","General truths / scientific facts","If + present simple","present simple","If you heat ice, it melts."],
      ["First","Real / possible future","If + present simple","will + infinitive","If it rains, I will stay home."],
      ["Second","Unreal / hypothetical present or future","If + past simple","would + infinitive","If I won the lottery, I would travel."],
      ["Third","Unreal / hypothetical past (impossible to change)","If + past perfect","would have + past participle","If I had studied, I would have passed."]]},
    {b:"trick",x:"Zero = always true · First = maybe true in the future · Second = imagine now (not true) · Third = imagine the past (too late)"}
   ],
   ex:[
    {n:"A1",k:"pick",i:"Read each sentence. Choose Z (zero), F (first), S (second) or T (third).",
     o:[["Z","Zero"],["F","First"],["S","Second"],["T","Third"]],
     q:[["If you mix blue and yellow, you get green.","Z"],
        ["If I had seen the email, I would have replied.","T"],
        ["If she studies hard, she will pass the exam.","F"],
        ["If I were the president, I would change the law.","S"],
        ["If it snows tomorrow, school will close.","F"],
        ["If he had worn a helmet, he wouldn't have been injured.","T"],
        ["Water freezes if the temperature drops below 0°C.","Z"],
        ["If I knew the answer, I would tell you.","S"]]},
    {n:"A2",k:"write",i:"Complete each sentence with your own ideas. Check to compare with a model answer.",
     q:[["(Zero) If you don't water your plants,","they die."],
        ["(First) If I finish my work early today,","I will go for a run before dinner."],
        ["(Second) If I could speak three languages fluently,","I would apply for a job abroad."],
        ["(Third) If I had woken up earlier this morning,","I would have caught the express bus."],
        ["(Zero) If people drive too fast,","accidents happen."],
        ["(First) If it rains this weekend,","we will postpone the barbecue."],
        ["(Second) If I had more free time,","I would learn to play the piano."],
        ["(Third) If I had chosen a different career,","I would have moved to another city."]]}
   ]},
  {L:"B",t:"Third conditional – focus on past impossibility",
   learn:[
    {b:"p",x:"The third conditional talks about the past, which cannot be changed."},
    {b:"formula",x:"IF + PAST PERFECT, WOULD HAVE + PAST PARTICIPLE"},
    {b:"eg",x:["If I had saved more money, I would have bought the car. (But I didn't save money, so I didn't buy the car.)",
              "If I hadn't missed the bus, I wouldn't have been late.",
              "If she had studied, she wouldn't have failed."]}
   ],
   ex:[
    {n:"B1",k:"gap",i:"Complete with the third conditional.",
     q:[["If I ___ (know) you were coming, I ___ (bake) a cake.",["had known","would have baked"]],
        ["She ___ (not / miss) the flight if she ___ (leave) earlier.",["wouldn't have missed|would not have missed","had left"]],
        ["If they ___ (save) more money, they ___ (buy) a house by now.",["had saved","would have bought"]],
        ["He ___ (not / get) the job if he ___ (not / prepare) for the interview.",["wouldn't have got|would not have got|wouldn't have gotten|would not have gotten","hadn't prepared|had not prepared"]],
        ["If we ___ (take) a taxi, we ___ (arrive) on time.",["had taken","would have arrived"]]]},
    {n:"B2",k:"open",i:"Write two third conditional sentences about regrets or past mistakes.",
     q:[["Something you regret: If I had … , I would have …","If I had started saving earlier, I would have travelled last summer."],
        ["Something you are glad happened differently: If I hadn't … , I wouldn't have …","If I hadn't taken that evening course, I wouldn't have met my best friend."]]}
   ]},
  {L:"C",t:"Write one sentence for each conditional type",
   learn:[],
   ex:[
    {n:"C1",k:"study",i:"Study the models.",h:["Conditional","Model sentence"],r:[
      ["Zero","If you don't charge your phone, the battery dies."],
      ["First","If I finish this course successfully, I will apply for a better job."],
      ["Second","If I spoke perfect English, I would feel more confident in interviews."],
      ["Third","If I had started learning English earlier, I would have reached C1 sooner."]]},
    {n:"C2",k:"open",i:"Think about your health and write your own example for each conditional.",
     q:[["Zero — general truth / scientific fact","If you skip breakfast, your concentration drops."],
        ["First — real / possible future","If I sleep eight hours tonight, I will feel much sharper tomorrow."],
        ["Second — unreal / hypothetical present","If I had a gym next to my office, I would train every morning."],
        ["Third — unreal / hypothetical past","If I had seen a doctor sooner, I wouldn't have been ill for so long."]]}
   ]},
  {L:"D",t:"Mini Project: The Time Machine Letter",learn:[],
   ex:[{n:"D1",k:"project",i:"Write a short letter (4–6 sentences) from your future self (five years from now) to your present self, stating some facts and/or giving advice. Use at least one conditional of each type (zero, first, second, third). Underline each conditional.",
        x:"Example starter: \"Dear younger me, here's what life taught me. If you don't study…\""}]}
 ]},

{n:2,t:"Time Travel Trouble: Mixed Conditionals",s:"Mixed conditionals — past → present / present → past",grp:"Grammar core",tags:"mixed conditional past present paraphrase",
 sec:[
  {L:"A",t:"Mixed conditionals – what are they?",
   learn:[
    {b:"p",x:"In Set 1 you learned four standard conditionals where both clauses are in the same time frame. Mixed conditionals combine different time frames. They are common in academic English and near-native speech."},
    {b:"formula",x:"DIFFERENT TIME IN THE IF CLAUSE + DIFFERENT TIME IN THE MAIN CLAUSE"},
    {b:"table",h:["Type","If clause","Main clause","Meaning","Example"],r:[
      ["Past → Present","Past (something that did or didn't happen)","Present result","A past action affects the present","If I had studied medicine (past), I would be a doctor now (present)."],
      ["Present → Past","Present (a general truth or habit)","Past result","A present situation affects a past outcome","If I were more organized (present), I wouldn't have missed the deadline (past)."]]},
    {b:"trick",x:"Past → Present = had done (if) + would do (main) · Present → Past = did / were (if) + would have done (main)"}
   ],
   ex:[
    {n:"A1",k:"pick",i:"Read each mixed conditional. Choose PaPr (past → present) or PrPa (present → past).",
     o:[["PaPr","Past → Present"],["PrPa","Present → Past"]],
     q:[["If I had taken that job, I would be living in London now.","PaPr"],
        ["If she weren't afraid of flying, she would have visited us last year.","PrPa"],
        ["If he had saved more money, he wouldn't be so stressed about bills.","PaPr"],
        ["If I spoke French fluently, I would have applied for that position.","PrPa"],
        ["If we had left earlier, we wouldn't be stuck in traffic now.","PaPr"],
        ["If you were more patient, you wouldn't have argued with the manager.","PrPa"]]},
    {n:"A2",k:"write",i:"Complete each sentence with your own idea.",
     q:[["(Past → Present) If I had studied harder in high school, I … now.","would have a scholarship now."],
        ["(Present → Past) If I were more confident in my English, I … yesterday.","would have spoken up in the meeting yesterday."],
        ["(Past → Present) If I hadn't forgotten my phone at home, I … right now.","would be answering your messages right now."],
        ["(Present → Past) If I didn't have so much work to do, I … last weekend.","would have gone to the coast last weekend."],
        ["(Past → Present) If she had accepted the scholarship, she … today.","would be studying in Lisbon today."],
        ["(Present → Past) If he weren't so stubborn, he … last week.","would have apologised last week."]]}
   ]},
  {L:"B",t:"Conditional paraphrasing",
   learn:[
    {b:"p",x:"Paraphrasing a conditional means expressing the same meaning using different words or a different structure."},
    {b:"eg",x:["Original: If you don't water the plants, they die. → Paraphrase: Plants die when they are not watered.",
              "Original: If I had studied law, I would be a lawyer now. → Paraphrase: I'm not a lawyer today because I didn't study law."]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Rewrite each sentence in your own words without changing the meaning.",
     q:[["If you heat ice, it melts. (zero)","Ice melts when it is heated."],
        ["If it rains tomorrow, the match will be cancelled. (first)","The match will be cancelled in the event of rain tomorrow."],
        ["If I were rich, I would buy a house on the beach. (second)","I'm not rich, so I can't buy a house on the beach."],
        ["If I had set my alarm, I wouldn't have been late. (third)","I was late because I didn't set my alarm."],
        ["If he had taken the train, he would be here already. (mixed: past → present)","He isn't here yet because he didn't take the train."],
        ["If she weren't so talented, she wouldn't have won the competition. (mixed: present → past)","She won the competition because she is so talented."]]},
    {n:"B2",k:"open",i:"Write one original mixed conditional sentence. Then paraphrase it.",
     q:[["Your original mixed conditional","If I had learned to drive, I would be commuting by car now."],
        ["Your paraphrase (different words, same meaning)","I take the bus to work because I never learned to drive."]]}
   ]},
  {L:"C",t:"Extra practice",learn:[],
   ex:[
    {n:"C1",k:"write",i:"Change each pair of sentences into the mixed conditional type indicated.  Model: I didn't go to university. I don't have a degree. (Past → Present) → If I had gone to university, I would have a degree now.",
     q:[["I am not a good swimmer. I didn't join the water polo team. (Present → Past)","If I were a good swimmer, I would have joined the water polo team."],
        ["She missed the meeting. She doesn't know the new policy. (Past → Present)","If she hadn't missed the meeting, she would know the new policy."],
        ["He doesn't speak Spanish. He didn't apply for the job in Madrid. (Present → Past)","If he spoke Spanish, he would have applied for the job in Madrid."],
        ["They left late. They are stuck in traffic. (Past → Present)","If they hadn't left late, they wouldn't be stuck in traffic."],
        ["I am not organized. I forgot the deadline. (Present → Past)","If I were organized, I wouldn't have forgotten the deadline."]]},
    {n:"C2",k:"open",i:"Write 4 mixed conditional sentences using personal examples. Choose one topic: pets, the environment, or family.",
     q:[["Sentence 1 (past → present)","If we hadn't adopted our dog, the house would be much quieter now."],
        ["Sentence 2 (past → present)","If my parents had stayed in the countryside, I would be living far from the city today."],
        ["Sentence 3 (present → past)","If I weren't allergic to cats, I would have taken that kitten last year."],
        ["Sentence 4 (present → past)","If my family didn't recycle so carefully, we would have produced twice as much waste last year."]]}
   ]},
  {L:"D",t:"Mini Project: Mixed Conditional Charades",learn:[],
   ex:[{n:"D1",k:"project",i:"With a partner or small group, write a list of mixed conditional sentences. Then act them out without speaking the sentence itself. Step 1: write the sentences. Step 2: plan a 30-second silent skit. Step 3: perform for the class. Step 4: classmates guess the exact sentence.",
        x:"Challenge: write a short paragraph (4–5 sentences) about a regret that affects your present life. Use at least 2 mixed conditionals."}]}
 ]},

{n:3,t:"The Past Before the Past",s:"Past perfect review — had + past participle",grp:"Grammar core",tags:"past perfect had sequence simple past",
 sec:[
  {L:"A",t:"Past perfect – what is it?",
   learn:[
    {b:"p",x:"The past perfect shows that one past action happened before another past action."},
    {b:"formula",x:"HAD + PAST PARTICIPLE"},
    {b:"table",h:["Sentence","Meaning"],r:[
      ["When I arrived, she left.","She left right after I arrived (or at the same time) — ambiguous."],
      ["When I arrived, she had left.","She left BEFORE I arrived. Clear sequence."]]}
   ],
   ex:[
    {n:"A1",k:"mcq",i:"Which action happened FIRST?",
     q:[["When I woke up, my brother had already made breakfast.",["I woke up","my brother had made breakfast"],1,"The past perfect marks the earlier action."],
        ["She had finished her homework before the movie started.",["she had finished her homework","the movie started"],0,"Finishing came before the film started."],
        ["He had never seen the ocean until he visited California.",["he had never seen the ocean","he visited California"],0,"The period of never seeing it comes first; the visit ends it."],
        ["After they had eaten dinner, they went for a walk.",["they had eaten dinner","they went for a walk"],0,"'After + past perfect' marks the first event."],
        ["I realized that I had left my keys at work.",["I realized","I had left my keys"],1,"Leaving the keys happened before the moment of realising."]]},
    {n:"A2",k:"gap",i:"Complete each sentence using the past perfect form of the verb in parentheses.",
     q:[["By the time we arrived at the theater, the movie ___ (already / start).",["had already started"]],
        ["She was upset because she ___ (lose) her phone.",["had lost"]],
        ["He didn't recognize the town because it ___ (change) so much.",["had changed"]],
        ["After they ___ (finish) the project, they presented it to the class.",["had finished"]],
        ["I was exhausted because I ___ (not / sleep) well the night before.",["hadn't slept|had not slept"]],
        ["She ___ (never / try) sushi before she went to Japan.",["had never tried"]]]}
   ]},
  {L:"B",t:"Past perfect vs. simple past – when to use each",
   learn:[
    {b:"p",x:"The key is sequence. Which event happened first?"},
    {b:"table",h:["Use","Example","Why"],r:[
      ["Simple past (both events)","I ate dinner. Then I watched TV.","Clear order, but no emphasis on 'before'."],
      ["Past perfect + simple past","I had eaten dinner before I watched TV.","Emphasises that eating was COMPLETE before watching."],
      ["Simple past + simple past (with time marker)","I ate dinner at 7pm and watched TV at 8pm.","Time markers make the order clear without the past perfect."]]},
    {b:"note",x:"Not necessary: with before, after or when the order is already clear — I ate dinner before I watched TV is fine. Useful: when the order is not obvious — When the police arrived, the thief had left (the thief left first)."}
   ],
   ex:[
    {n:"B1",k:"gap",i:"Complete each sentence with the correct form of the verb in parentheses.",
     q:[["When I ___ (get) home, my roommate ___ (already / cook) dinner.",["got","had already cooked"]],
        ["She ___ (finish) her report before the deadline.",["had finished|finished"]],
        ["By the time the teacher ___ (arrive), the students ___ (leave).",["arrived","had left"]],
        ["I ___ (never / see) such a beautiful sunset until I ___ (go) to Hawaii.",["had never seen","went"]],
        ["After he ___ (graduate) from university, he ___ (move) to London.",["had graduated|graduated","moved"]],
        ["She realized that she ___ (forget) to lock the door before she ___ (leave) the house.",["had forgotten","left"]]]}
   ]},
  {L:"C",t:"Write showing clear sequence",
   learn:[],
   ex:[
    {n:"C1",k:"study",i:"Study the models.",h:["Model sentence","First action (past perfect)","Second action (simple past)"],r:[
      ["I had already eaten dinner when my friend arrived.","had eaten","arrived"],
      ["She had never traveled abroad before she turned 20.","had never traveled","turned"],
      ["The train had left by the time we got to the station.","had left","got"]]},
    {n:"C2",k:"open",i:"Write sentences using the past perfect to show clear sequence. Use the time marker given.",
     q:[["use before","I had already sent the file before she asked for it."],
        ["use after","After I had checked the address, I called a taxi."],
        ["use by the time","By the time the concert started, we had found our seats."],
        ["use when","When the teacher came in, the class had gone completely silent."],
        ["use already or never","I had never eaten octopus until that dinner in Lisbon."]]}
   ]},
  {L:"D",t:"Mini Project: The \"What Had Happened Was…\" Story",learn:[],
   ex:[{n:"D1",k:"project",i:"Write a short, funny or dramatic story (5–7 sentences) about a chain of past events where something went wrong or got confusing. Use at least 3 past perfect verbs to show what had already happened before the main event.",x:""}]}
 ]},

{n:4,t:"The Blame Shifter: Passive Voice",s:"Passive voice in all tenses",grp:"Grammar core",tags:"passive voice active be past participle agent",
 sec:[
  {L:"A",t:"Passive voice – what is it?",
   learn:[
    {b:"p",x:"In the active voice, the subject does the action. In the passive voice, the subject receives the action."},
    {b:"table",h:["Voice","Formula","Example"],r:[
      ["Active","Subject + verb + object","The researcher conducted the study."],
      ["Passive","Object + be + past participle (+ by + agent)","The study was conducted by the researcher."]]},
    {b:"note",x:"Why use the passive? The doer is unknown or unimportant (My phone was stolen); the receiver matters more (The president was elected in 2020); academic writing sounds objective (The data were analyzed)."},
    {b:"table",h:["Tense","Active","Passive (be + past participle)"],r:[
      ["Present simple","She writes reports.","Reports are written by her."],
      ["Present continuous","She is writing a report.","A report is being written by her."],
      ["Past simple","She wrote a report.","A report was written by her."],
      ["Past continuous","She was writing a report.","A report was being written by her."],
      ["Present perfect","She has written a report.","A report has been written by her."],
      ["Past perfect","She had written a report.","A report had been written by her."],
      ["Future (will)","She will write a report.","A report will be written by her."],
      ["Future (going to)","She is going to write a report.","A report is going to be written by her."],
      ["Modals","She must write a report.","A report must be written by her."]]},
    {b:"trick",x:"The passive always uses be + past participle. The tense lives in the verb be."}
   ],
   ex:[
    {n:"A1",k:"mcq",i:"Active or passive — and which tense?",
     q:[["The experiment was conducted by the team.",["Active – past simple","Passive – past simple","Passive – present perfect"],1,"was + conducted = past simple passive."],
        ["Scientists study climate change every day.",["Active – present simple","Passive – present simple","Active – present continuous"],0,"No form of be + participle, so it is active."],
        ["The results have been published in a journal.",["Passive – past simple","Active – present perfect","Passive – present perfect"],2,"have been + published = present perfect passive."],
        ["They will announce the winner tomorrow.",["Active – future (will)","Passive – future (will)","Active – present simple"],0,"They (the doer) is the subject, so it is active."],
        ["The bridge is being repaired right now.",["Passive – present simple","Passive – present continuous","Active – present continuous"],1,"is being + repaired = present continuous passive."]]},
    {n:"A2",k:"gap",i:"Complete each sentence with the correct passive form of the verb in parentheses.",
     q:[["English ___ (speak) in many countries around the world.",["is spoken"]],
        ["The project ___ (finish) by next Friday.",["will be finished"]],
        ["The cake ___ (eat) before the party started.",["had been eaten"]],
        ["The documents ___ (sign) by the manager right now.",["are being signed"]],
        ["A new hospital ___ (build) in our city since last year.",["has been built"]],
        ["The letter ___ (send) yesterday.",["was sent"]],
        ["The problem ___ (solve) by the end of the week. (will)",["will be solved"]],
        ["The windows ___ (break) during the storm last night.",["were broken"]]]}
   ]},
  {L:"B",t:"Active vs. passive – when to use each",
   learn:[
    {b:"table",h:["Use active when…","Use passive when…"],r:[
      ["The doer is important","The doer is unknown or obvious"],
      ["You want to be direct and clear","You want to be objective (academic writing)"],
      ["Most of the time in everyday speech","The receiver matters more than the doer"]]},
    {b:"eg",x:["Mistakes were made. (passive — avoids saying WHO)","The manager made mistakes. (active — specific and direct)"]},
    {b:"note",x:"Academic writing tip: use the passive when the action matters more than who did it. The data were collected over six months reads better than We collected the data over six months."}
   ],
   ex:[
    {n:"B1",k:"mcq",i:"Choose the better option for each context.",
     q:[["A scientific report about a lab experiment",["I mixed the chemicals.","The chemicals were mixed."],1,"Academic reports stay objective; the doer is obvious."],
        ["A news article about a robbery",["Someone stole a car from Main Street.","A car was stolen from Main Street."],1,"The doer is unknown, so the passive is natural."],
        ["An email to a coworker about a mistake",["The report was submitted late.","You submitted the report late."],0,"The passive softens the blame — usually more diplomatic with a colleague."],
        ["A history textbook",["People built the pyramids thousands of years ago.","The pyramids were built thousands of years ago."],1,"The builders are unknown; the pyramids are the focus."]]}
   ]},
  {L:"C",t:"Transform active sentences to passive + explain why",
   learn:[],
   ex:[
    {n:"C1",k:"study",i:"Study the models.",h:["Active sentence","Passive transformation"],r:[
      ["The committee approved the proposal.","The proposal was approved by the committee."],
      ["Someone has cleaned the office.","The office has been cleaned."],
      ["The company will launch a new app.","A new app will be launched."]]},
    {n:"C2",k:"write",i:"Transform each active sentence to passive. Then think about why the passive might be preferred.",
     q:[["Researchers collected the data over six months.","The data were collected over six months. — objective academic tone; the researchers are not the point."],
        ["Someone stole my wallet yesterday.","My wallet was stolen yesterday. — the doer is unknown."],
        ["The jury awarded first prize to Maria.","Maria was awarded first prize by the jury. — the receiver is more important."],
        ["They have postponed the meeting.","The meeting has been postponed. — recent action with a present result; who postponed it is irrelevant."],
        ["The school must address this issue.","This issue must be addressed by the school. — obligation focused on the issue, not the institution."]]}
   ]},
  {L:"D",t:"Mini Project: The \"Mystery Incident\" News Report",learn:[],
   ex:[{n:"D1",k:"project",i:"Write a short news report (5–7 sentences) about a mysterious incident where no one knows who did it. Use at least 4 passive verbs in different tenses.",
        x:"Challenge — rewrite this paragraph from active to passive where appropriate (some sentences may stay active): \"Scientists conducted a study on sleep patterns. They asked 200 participants to track their sleep for one month. The researchers analyzed the data and discovered a link between screen time and poor sleep. They published the results in a medical journal.\""}]}
 ]},

{n:6,t:"To Do or Doing: The Great Verb Debate",s:"Infinitive vs. gerund (verb patterns)",grp:"Grammar core",tags:"gerund infinitive stop remember forget try regret verb patterns",
 sec:[
  {L:"A",t:"Infinitive vs. gerund – what's the difference?",
   learn:[
    {b:"p",x:"Some verbs are followed by a gerund (-ing form), some by a to-infinitive, and some by both — sometimes with a change in meaning."},

   ],

  {L:"B",t:"Common errors: stop to do vs. stop doing",

{n:7,t:"Say More with Less: Ellipsis",s:"Ellipsis — leaving out repeated words",grp:"Grammar core",tags:"ellipsis auxiliary comparison than to omission",
 sec:[
  {L:"A",t:"Ellipsis – what is it?",
   learn:[
    {b:"p",x:"Ellipsis means leaving out words that are clearly understood from context. It makes your English sound more natural, fluent and near-native."},
    {b:"eg",x:["Without ellipsis: She speaks Spanish, and she also speaks French. → With ellipsis: She speaks Spanish, and also French.",
              "Without ellipsis: I wanted to go, but I couldn't go. → With ellipsis: I wanted to go, but I couldn't."]},
    {b:"table",h:["Type","Without ellipsis","With ellipsis"],r:[
      ["After auxiliary verbs","He hasn't finished, but she has finished.","He hasn't finished, but she has."],
      ["In comparisons","She is smarter than he is smart.","She is smarter than he is."],
      ["In clauses with to","I don't want to go, but I have to go.","I don't want to go, but I have to."]]},
    {b:"note",x:"Ellipsis avoids repetition, sounds fluent, and is common in academic writing and formal speech."}
   ],
   ex:[
    {n:"A1",k:"write",i:"What words are implied (left out) in each sentence?",
     q:[["She can speak French, and her brother can too.","speak French"],
        ["I haven't seen the movie, but my sister has.","seen the movie"],
        ["He works harder than she does.","works (hard)"],
        ["I don't want to argue, but I might have to.","argue"],
        ["Some students passed the exam; others didn't.","pass the exam"]]},
    {n:"A2",k:"write",i:"Complete each sentence using ellipsis (leave out the repeated words).",
     q:[["A: Have you finished the report?  B: Not yet, but I … soon.","will soon."],
        ["She didn't attend the meeting, but her colleague …","did."],
        ["I thought he would call, but he …","didn't."],
        ["He is more experienced than she …","is."],
        ["They wanted to leave early, so they …","did."],
        ["I don't know the answer, but the teacher …","does."]]}
   ]},
  {L:"B",t:"Ellipsis in comparisons and clauses",
   learn:[
    {b:"p",x:"Comparisons are a perfect place for ellipsis. You can leave out repeated verbs or whole phrases after than or as."},
    {b:"table",h:["Without ellipsis","With ellipsis"],r:[
      ["She runs faster than he runs.","She runs faster than he does. (or than him — informal)"],
      ["You are as talented as she is talented.","You are as talented as she is."],
      ["He spent more money than he had planned to spend.","He spent more money than he had planned to."],
      ["I wanted to go, but I forgot to go.","I wanted to go, but I forgot to."],
      ["She asked me to help, and I agreed to help.","She asked me to help, and I agreed to."]]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Rewrite each sentence using ellipsis to avoid repetition.",
     q:[["He speaks English better than she speaks English.","He speaks English better than she does."],
        ["I haven't read the book, but she has read the book.","I haven't read the book, but she has."],
        ["She is more qualified than he is qualified.","She is more qualified than he is."],
        ["They wanted to leave, but they were told not to leave.","They wanted to leave, but they were told not to."],
        ["I can't solve this problem, but my friend can solve this problem.","I can't solve this problem, but my friend can."],
        ["He spends more time studying than she spends studying.","He spends more time studying than she does."]]},
    {n:"B2",k:"open",i:"Complete with your own ideas.",
     q:[["My best friend is … than I …","My best friend is far more patient than I am."],
        ["… studies harder than anyone else in school …","My cousin studies harder than anyone else in school does."],
        ["I can't … as well as I … when I was younger.","I can't concentrate as well as I could when I was younger."],
        ["I know more about … than …","I know more about photography than my brother does."],
        ["I didn't enjoy … as much as …","I didn't enjoy the sequel as much as I did the original."]]}
   ]},
  {L:"C",t:"Mini Project: The Text Message Challenge",learn:[],
   ex:[{n:"C1",k:"project",i:"You are texting a friend who is very impatient and hates long messages. Rewrite a full conversation using ellipsis (leaving out repeated words) to make it shorter and faster.",
        x:"Challenge: write a short dialogue (8–10 lines) between two people using at least 4 examples of ellipsis. Underline each one.  Example — A: Have you finished your homework? B: Not yet, but I will soon. A: I haven't either. B: We should work together."}]}
 ]},

{n:8,t:"Who, Which, Where – and the Comma That Changes Everything",s:"Nonrestrictive modifiers (which, who, where — extra info)",grp:"Grammar core",tags:"relative clause nonrestrictive restrictive comma which who that where",
 sec:[
  {L:"A",t:"Nonrestrictive modifiers – what are they?",
   learn:[
    {b:"p",x:"A modifier adds information about a noun. When the information is extra (not essential to identify the noun), it is nonrestrictive and takes commas."},
    {b:"eg",x:["Restrictive (no commas — essential): The students who studied passed the exam. (Only the students who studied passed.)",
              "Nonrestrictive (commas — extra): The students, who studied hard, passed the exam. (All of them studied and all passed.)"]},
    {b:"table",h:["","Restrictive (no commas)","Nonrestrictive (commas)"],r:[
      ["Meaning","Essential to identify the noun","Extra information — noun already identified"],
      ["Commas","No commas","Commas around the clause"],
      ["That vs. which","Use that (or who for people)","Use which (things) or who (people)"],
      ["Example","The book that is on the table is mine.","The book, which is on the table, is mine."]]},
    {b:"trick",x:"If you can remove the clause and the sentence still makes sense, use commas (nonrestrictive)."}
   ],
   ex:[
    {n:"A1",k:"pick",i:"Choose R (restrictive — no commas) or N (nonrestrictive — commas).",
     o:[["R","Restrictive"],["N","Nonrestrictive"]],
     q:[["The car that is parked in the driveway belongs to my brother.","R"],
        ["Paris, which is the capital of France, is a beautiful city.","N"],
        ["Students who arrive late will not be admitted.","R"],
        ["The Eiffel Tower, which was built in 1889, is made of iron.","N"],
        ["The woman who lives next door is a doctor.","R"],
        ["My mother, who is a doctor, works at the local hospital.","N"]]},
    {n:"A2",k:"write",i:"Add commas to the nonrestrictive sentences. If the sentence is restrictive, write \"no commas\".",
     q:[["My brother who lives in Chicago is visiting next week. (I have more than one brother)","no commas"],
        ["My brother who lives in Chicago is visiting next week. (I have only one brother)","My brother, who lives in Chicago, is visiting next week."],
        ["The museum that opens at 10am is very popular.","no commas"],
        ["The Louvre which is in Paris is the world's largest art museum.","The Louvre, which is in Paris, is the world's largest art museum."],
        ["People who exercise regularly live longer.","no commas"],
        ["Dr. Smith who wrote the book will be speaking at the conference.","Dr. Smith, who wrote the book, will be speaking at the conference."]]}
   ]},
  {L:"B",t:"Commas with nonrestrictive elements – the rules",
   learn:[
    {b:"table",h:["Rule","Example"],r:[
      ["Use commas around nonrestrictive clauses","The conference, which was held in Berlin, was a success."],
      ["Do NOT use commas with restrictive clauses","The conference that was held in Berlin was a success."],
      ["Use which for nonrestrictive (things)","My laptop, which is three years old, still works well."],
      ["Use that for restrictive (things)","The laptop that is on the desk is mine."],
      ["Use who for people (both types)","The teacher, who is very kind, helped me. / The teacher who helped me is kind."],
      ["Use where for places","My hometown, where I grew up, is very small."]]}
   ],
   ex:[
    {n:"B1",k:"gap",i:"Complete each sentence with that, which or who.",
     q:[["The book ___ I borrowed from the library is overdue.",["that"]],
        ["My car, ___ is 10 years old, still runs perfectly.",["which"]],
        ["The student ___ won the scholarship is from Brazil.",["who"]],
        ["Paris, ___ is known as the City of Light, attracts millions of tourists.",["which"]],
        ["The information ___ you need is on the website.",["that"]],
        ["My grandfather, ___ is 85 years old, still walks every day.",["who"]]]},
    {n:"B2",k:"open",i:"For each topic, write two sentences — one restrictive (no commas) and one nonrestrictive (commas).",
     q:[["A teacher — restrictive (which teacher? essential)","The teacher who taught me phonetics is retiring."],
        ["A teacher — nonrestrictive (extra info)","Mr Alves, who taught me phonetics, is retiring."],
        ["A city — restrictive (which city? essential)","The city that hosted the summit is on the coast."],
        ["A city — nonrestrictive (extra info)","Curitiba, which is known for its parks, hosted the summit."]]}
   ]},
  {L:"C",t:"Mini Project: The \"Comma or No Comma?\" Meme Challenge",learn:[],
   ex:[{n:"C1",k:"project",i:"Create a funny meme or tweet showing how adding or removing a comma completely changes the meaning of a sentence. Use nonrestrictive modifiers (with commas) or restrictive modifiers (no commas) to make your point.",
        x:"Challenge: write a short paragraph (6–8 sentences) describing a person, a place or an object that matters to you. Use at least 3 nonrestrictive modifiers and underline each one."}]}
 ]},

{n:9,t:"Connecting Ideas with Style: Purpose & Contrast",s:"Advanced connectives — purpose + contrast",grp:"Grammar core",tags:"connectives so that in order that lest whereas while albeit notwithstanding",
 sec:[
  {L:"A",t:"Advanced connectives – purpose",
   learn:[
    {b:"p",x:"Purpose connectives explain why someone does something, or what goal an action serves."},
    {b:"table",h:["Connective","Meaning","Formality","Example"],r:[
      ["so that","in order to achieve a result","neutral","She studies hard so that she can pass the exam."],
      ["in order that","same as so that — more formal","formal","The government invested in education in order that future generations would benefit."],
      ["lest","to prevent something bad (= because otherwise)","very formal / literary","He wore a heavy coat lest he catch a cold."]]},
    {b:"note",x:"lest is always followed by a subjunctive verb or should: She spoke quietly lest anyone hear her (no -s on hear)."}
   ],
   ex:[
    {n:"A1",k:"gap",i:"Complete each sentence with so that, in order that or lest.",
     q:[["I left a note ___ she would know where I went.",["so that|in order that"]],
        ["She saved her work every few minutes ___ she lose it during a power outage.",["lest"]],
        ["The company implemented new safety protocols ___ employees would feel more secure.",["so that|in order that"]],
        ["He double-checked the address ___ he might get lost.",["lest"]],
        ["The professor provided detailed feedback ___ students could improve their writing.",["so that|in order that"]],
        ["She whispered ___ anyone overhear her conversation.",["lest"]]]},
    {n:"A2",k:"open",i:"Complete each sentence with your own idea.",
     q:[["I study English every day so that …","so that I can work abroad one day."],
        ["The school installed new computers in order that …","in order that every student could access the online library."],
        ["She set an alarm lest …","lest she oversleep on the morning of the exam."],
        ["We left early so that …","so that we would beat the traffic."],
        ["The company reduced prices in order that …","in order that more families could afford the service."],
        ["He wrote down the instructions lest …","lest he forget a step during the presentation."]]}
   ]},
  {L:"B",t:"Advanced connectives – contrast",
   learn:[
    {b:"table",h:["Connective","Meaning","Formality","Example"],r:[
      ["whereas","shows a clear difference between two things","neutral / formal","She prefers coffee, whereas he prefers tea."],
      ["while","same as whereas — also means 'at the same time'","neutral","While the first study found positive results, the second found none."],
      ["albeit","although / even though (a concession)","formal","The solution was effective, albeit expensive."],
      ["notwithstanding","despite / in spite of","very formal / legal","Notwithstanding the challenges, the project was completed on time."]]},
    {b:"note",x:"Word order: albeit usually comes before an adjective or adverb (…albeit slowly). notwithstanding can come before or after its object (Notwithstanding the rain / The rain notwithstanding)."}
   ],
   ex:[
    {n:"B1",k:"gap",i:"Complete each sentence with whereas, while, albeit or notwithstanding.",
     q:[["___ some students prefer group work, others prefer to study alone.",["whereas|while"]],
        ["The experiment was successful, ___ with some minor errors.",["albeit"]],
        ["___ the difficulties, the team managed to finish the project on time.",["notwithstanding"]],
        ["The first chapter is very theoretical, ___ the second is more practical.",["whereas|while"]],
        ["She accepted the job offer, ___ the low salary.",["notwithstanding"]],
        ["___ the critics were harsh, the movie was a box office success.",["while|whereas"]]]},
    {n:"B2",k:"open",i:"Complete each sentence with your own idea.",
     q:[["Whereas some people prefer living in the city, …","others find the countryside far less stressful."],
        ["While online learning offers flexibility, …","it demands a great deal of self-discipline."],
        ["The presentation was well-organized, albeit …","albeit a little too long."],
        ["Notwithstanding the lack of funding, …","the research team published three papers."],
        ["My first attempt was unsuccessful, whereas …","whereas my second went surprisingly well."],
        ["The solution was simple, albeit …","albeit unpopular with the staff."]]}
   ]},
  {L:"C",t:"Mini Project: The \"Purpose or Contrast?\" Debate Cards",learn:[],
   ex:[{n:"C1",k:"project",i:"Create 4 debate cards, each with a sentence starter that uses an advanced connective (purpose or contrast). With a partner, complete each card with a logical ending. Your partner must guess which type of connective you used before completing the sentence.",
        x:"Challenge: write a short academic paragraph (6–8 sentences) about a current issue (education, technology, environment). Use at least 4 different connectives from this set and underline each one."}]}
 ]},

{n:10,t:"Grammar Smackdown: Putting It All Together",s:"Integrated review — infinitive/gerund, ellipsis, nonrestrictive modifiers, connectives",grp:"Review",tags:"review integrated gerund ellipsis nonrestrictive connectives quiz",
 sec:[
  {L:"A",t:"What are we reviewing?",
   learn:[
    {b:"table",h:["Set","Topic"],r:[
      ["6","Infinitive vs. gerund (stop to do vs. stop doing, remember, forget, try, regret)"],
      ["7","Ellipsis (leaving out repeated words in comparisons and clauses)"],
      ["8","Nonrestrictive modifiers (which, who, where — extra info with commas)"],
      ["9","Advanced connectives — purpose (so that, in order that, lest) and contrast (whereas, while, albeit, notwithstanding)"]]}
   ],
   ex:[
    {n:"A1",k:"pick",i:"Quick warm-up. Choose the set each sentence belongs to.",
     o:[["6","Set 6"],["7","Set 7"],["8","Set 8"],["9","Set 9"]],
     q:[["I stopped smoking last year. (meaning: quit)","6"],
        ["She speaks Spanish, and her brother does too.","7"],
        ["Paris, which is the capital of France, is a beautiful city.","8"],
        ["He studied hard so that he could pass the exam.","9"],
        ["I remember locking the door before I left.","6"],
        ["He wanted to attend, but he couldn't.","7"],
        ["Notwithstanding the difficulties, the project succeeded.","9"],
        ["The teacher, who is very kind, helped me after class.","8"]]}
   ]},
  {L:"B",t:"Sentence combining",
   learn:[{b:"p",x:"Combine the short sentences into one complex sentence using the grammar topic indicated."}],
   ex:[
    {n:"B1",k:"write",i:"Combine each group into one sentence.",
     q:[["stop + to-infinitive (purpose): She was driving to work. She stopped. She wanted to buy coffee.","While driving to work, she stopped to buy coffee."],
        ["ellipsis: I have finished my homework. My sister has not finished her homework.","I have finished my homework, but my sister hasn't."],
        ["nonrestrictive modifier (which): The book is on the table. The book belongs to my professor.","The book, which is on the table, belongs to my professor."],
        ["contrast connective (whereas): Online courses offer flexibility. Traditional classes offer face-to-face interaction.","Online courses offer flexibility, whereas traditional classes offer face-to-face interaction."],
        ["purpose connective (so that): She saved her work every few minutes. She wanted to avoid losing it.","She saved her work every few minutes so that she would not lose it."],
        ["ellipsis (after to): I wanted to attend the meeting. I was not able to attend the meeting.","I wanted to attend the meeting, but I wasn't able to."],
        ["nonrestrictive modifier (who): Dr. Martinez is my advisor. Dr. Martinez has published over 50 articles.","Dr. Martinez, who has published over 50 articles, is my advisor."],
        ["contrast connective (albeit): The solution was effective. It was expensive.","The solution was effective, albeit expensive."]]}
   ]},
  {L:"C",t:"20-item mixed quiz",learn:[],
   ex:[
    {n:"C1",k:"gap",i:"Part 1 — infinitive vs. gerund (1–5). Choose the correct form of the verb in parentheses.",
     q:[["I enjoy ___ (read) academic articles in my free time.",["reading"]],
        ["She stopped ___ (buy) coffee on her way to work. (she stopped in order to buy coffee)",["to buy"]],
        ["I remember ___ (meet) her at a conference last year.",["meeting"]],
        ["Please remember ___ (lock) the door when you leave.",["to lock"]],
        ["He tried ___ (open) the window, but it was stuck.",["to open"]]]},
    {n:"C2",k:"write",i:"Part 2 — ellipsis (6–10). Rewrite each sentence leaving out the repeated words.",
     q:[["She can speak French, and her brother can speak French too.","She can speak French, and her brother can too."],
        ["I haven't seen the movie, but my sister has seen the movie.","I haven't seen the movie, but my sister has."],
        ["He works harder than she works.","He works harder than she does."],
        ["I wanted to go, but I forgot to go.","I wanted to go, but I forgot to."],
        ["Some students passed the exam; others did not pass the exam.","Some students passed the exam; others didn't."]]},
    {n:"C3",k:"write",i:"Part 3 — nonrestrictive modifiers (11–14). Add commas where needed, or write \"no commas\".",
     q:[["My brother who lives in Chicago is a doctor. (I have more than one brother)","no commas"],
        ["The Eiffel Tower which was built in 1889 is made of iron.","The Eiffel Tower, which was built in 1889, is made of iron."],
        ["Students who arrive late will not be admitted.","no commas"],
        ["My mother who is a doctor works at the local hospital. (I have only one mother)","My mother, who is a doctor, works at the local hospital."]]},
    {n:"C4",k:"gap",i:"Part 4 — advanced connectives (15–20). Use: so that · in order that · lest · whereas · while · albeit · notwithstanding.",
     q:[["She wore a heavy coat ___ she catch a cold.",["lest"]],
        ["___ some people prefer city life, others prefer the countryside.",["whereas|while"]],
        ["The presentation was well-organized, ___ a bit too long.",["albeit"]],
        ["The university increased scholarships ___ more students could attend.",["so that|in order that"]],
        ["___ the initial resistance, the new policy was eventually adopted.",["notwithstanding"]],
        ["___ the first study found positive results, the second found none.",["while|whereas"]]]},
    {n:"C5",k:"open",i:"Challenge — rewrite the paragraph below to make it more sophisticated. Use at least ONE example of each: infinitive/gerund, ellipsis, a nonrestrictive modifier, and an advanced connective.  Original: \"She wanted to learn Spanish. She stopped working on weekends. She used that time to study. She also practiced every day. Her friend did not practice every day. Her friend did not improve as quickly. The method was effective. It was also time-consuming.\"",
     q:[["Your rewritten paragraph","Wanting to learn Spanish, she stopped working at weekends so that she could study, and she practised every day, whereas her friend did not. Her friend, who studied only occasionally, did not improve as quickly. The method, albeit time-consuming, was effective."]]}
   ]},
  {L:"D",t:"Mini Project: The \"Grammar Detective\" Error Hunt",
   learn:[{b:"p",x:"Below is a short paragraph written by a student. It contains 8 errors from Sets 6–9. Find and correct all 8."},
          {b:"eg",x:["I enjoy to read about environmental issues. Last year, I stopped to use plastic bags completely, and I felt good about it. My friend who lives in another city, she is also passionate about the environment. Whereas I prefer reducing waste, but she focuses on planting trees. She saved her money lest she could donate to a reforestation project. The project, which was organized by a local NGO, was very successful. I wanted to join the project, but I couldn't. I didn't have time. My friend did have time. She joined."]}],
   ex:[{n:"D1",k:"write",i:"Write the corrected paragraph.",
        q:[["Your corrected version","I enjoy reading about environmental issues. Last year, I stopped using plastic bags completely, and I felt good about it. My friend, who lives in another city, is also passionate about the environment. Whereas I prefer reducing waste, she focuses on planting trees. She saved her money so that she could donate to a reforestation project. The project, which was organized by a local NGO, was very successful. I wanted to join the project, but I couldn't, because I didn't have time. My friend did, and she joined."]]}]}
 ]}

{n:11,t:"A, An, The, or Nothing: The Article Adventure",s:"Article issues — a/an vs. the vs. zero article",grp:"Grammar core",tags:"articles a an the zero article general specific",
 sec:[
  {L:"A",t:"Article review – three choices",
   learn:[
    {b:"table",h:["Article","Use","Example"],r:[
      ["a / an","First mention / non-specific / one of many","I read a book last week. (any book)"],
      ["the","Second mention / specific / already known to the listener","The book was very interesting. (the one I just mentioned)"],
      ["zero article","General plural or uncountable nouns","Books are expensive. / Water is essential for life."]]},
    {b:"note",x:"Most common error: using the for general statements."},
    {b:"table",h:["Correct","Incorrect"],r:[
      ["Dogs are loyal animals. (dogs in general)","The dogs are loyal animals. (sounds like specific dogs)"],
      ["Life is beautiful. (life in general)","The life is beautiful. (sounds like a specific life)"]]},
    {b:"trick",x:"In these exercises, type a dash (–) when the correct answer is the zero article."}
   ],
   ex:[
    {n:"A1",k:"gap",i:"Complete each sentence with a, an, the — or a dash (–) for the zero article.",
     q:[["___ sun rises in ___ east.",["the","the"]],
        ["She wants to become ___ engineer.",["an"]],
        ["___ dogs need regular exercise to stay healthy.",["-|–|—|zero|"]],
        ["I saw ___ interesting movie last night. ___ movie was about climate change.",["an","the"]],
        ["___ honesty is ___ important quality in a leader.",["-|–|—|zero|","an"]],
        ["___ water in this bottle is very cold.",["the"]],
        ["___ happiness comes from within.",["-|–|—|zero|"]],
        ["He is ___ best student in ___ class.",["the","the"]]]},
    {n:"A2",k:"pick",i:"Is the noun phrase general or specific?",
     o:[["G","General"],["S","Specific"]],

        ["The cats in my neighborhood are very friendly.","S"],
        ["Education is the key to success.","G"],
        ["The education I received at this school was excellent.","S"],
        ["Life has many challenges.","G"],
        ["The life of a doctor is very demanding.","S"],
        ["Coffee keeps me awake in the morning.","G"],
        ["The coffee you made this morning was delicious.","S"]]}
   ]},
  {L:"B",t:"General vs. specific reference – the key distinction",
   learn:[
    {b:"p",x:"General = all members of a category (zero article or a/an). Specific = one particular member (usually the)."},
    {b:"table",h:["General (zero article)","Specific (the)"],r:[
      ["Technology has changed the world.","The technology used in this device is outdated."],
      ["Students should study regularly.","The students in this class are very motivated."],
      ["Happiness is hard to define.","The happiness I felt that day was unforgettable."]]},

   ],
   ex:[
    {n:"B1",k:"gap",i:"Controlled practice. Complete with a/an, the, or a dash (–) for zero article.",
     q:[["___ French is a beautiful language. (general)",["-|–|—|zero|"]],
        ["___ French I learned in high school was very basic. (specific)",["the"]],
        ["___ failure is sometimes necessary for growth. (general)",["-|–|—|zero|"]],
        ["___ failure of the project was due to poor planning. (specific)",["the"]],
        ["___ money doesn't guarantee happiness. (general)",["-|–|—|zero|"]],
        ["___ money you lent me will be repaid next week. (specific)",["the"]],
        ["___ air pollution is a serious problem in many cities. (general)",["-|–|—|zero|"]],
        ["___ air pollution caused by factories is harmful to health. (specific)",["the"]]]},
    {n:"B2",k:"open",i:"Write two sentences for each topic — one general, one specific.",
     q:[["Education — general","Education shapes the way a society thinks."],
        ["Education — specific","The education I received in that programme changed my career."],
        ["Social media — general","Social media has transformed political debate."],
        ["Social media — specific","The post that my colleague shared last night went viral."],
        ["Success — general","Success rarely arrives as quickly as people expect."],
        ["Success — specific","The success of the pilot project surprised the whole department."]]}
   ]},
  {L:"C",t:"Correct the article errors",learn:[],
   ex:[
    {n:"C1",k:"write",i:"Each sentence has one article error (missing, extra or wrong). Write the corrected sentence.",
     q:[["The life is full of unexpected surprises.","Life is full of unexpected surprises."],
        ["She is a best teacher I have ever had.","She is the best teacher I have ever had."],

{n:13,t:"The Preposition Puzzle: In Which, To Whom, About Which",s:"Prepositions after relative pronouns",grp:"Grammar core",tags:"preposition relative pronoun whom which formal academic style",

{n:16,t:"Glue for Your Ideas: Connectors That Connect",s:"Connectors — addition + exemplification",grp:"Grammar core",tags:"connectors furthermore moreover in addition not only but also for instance for example to illustrate namely",

/* ══════════ HELPERS ══════════ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[\u2018\u2019\u02bc]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/[\u2013\u2014\u2212]/g,'-')
    .replace(/[.,;:!?"()\[\]]/g,'').replace(/'/g,'')
    .replace(/\s+/g,' ').trim();
}
function hit(val,key){
  var alts=String(key).split('|');
  var v=norm(val);
  for(var i=0;i<alts.length;i++){
    var a=norm(alts[i]);
    if(a===v) return true;
    if(a==='-'&&(v===''||v==='-'||v==='zero'||v==='no article')) return true;
    if(a===''&&v==='') return true;
  }
  return false;
}
function loose(val,key){
  if(hit(val,key)) return true;
  var v=norm(val).replace(/^(the|a|an)\s+/,''), k=norm(String(key).split('|')[0]).replace(/^(the|a|an)\s+/,'');
  if(!v) return false;
  if(v===k) return true;
  /* accept if the answer contains the model's distinctive core, e.g. "no commas" */
  if(k.length<18&&v.indexOf(k)>-1) return true;
  return false;
}
function exKey(set,ex){return 's'+set+'.'+ex;}
function itKey(set,ex,i,g){return 's'+set+'.'+ex+'.'+i+(g==null?'':'.'+g);}
