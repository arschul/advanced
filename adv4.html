    else if(b.b==='table'){
      h+='<div class="tblwrap"><table><thead><tr>';
      b.h.forEach(function(c){h+='<th>'+esc(c)+'</th>';});
      h+='</tr></thead><tbody>';
      b.r.forEach(function(row){h+='<tr>';row.forEach(function(c){h+='<td>'+esc(c)+'</td>';});h+='</tr>';});
      h+='</tbody></table></div>';
    }
  });
  return h+'</div>';
}

/* ══════════ EXERCISE RENDERERS ══════════ */
function gapRow(set,e,i,q){
  var parts=String(q[0]).split('___'), h='<div class="q">';
  for(var g=0;g<parts.length;g++){
    h+=esc(parts[g]);
    if(g<parts.length-1){
      var k=itKey(set,e.n,i,g);
      h+='<input class="txt gapi" data-k="'+k+'" data-a="'+esc(q[1][g]||'')+'" value="'+esc(aget(k))+'" autocomplete="off" spellcheck="false">';
    }
  }
  return h+'</div><div class="why"></div>';
}
function exHTML(set,e){
  var done=!!ST.done[exKey(set,e.n)];
  var h='<section class="ex'+(done?' done':'')+'" id="ex-'+set+'-'+e.n+'" data-ex="'+e.n+'" data-set="'+set+'" data-kind="'+e.k+'">'+
        '<div class="exhead"><span class="exno">'+esc(e.n)+'</span><span class="exi">'+esc(e.i)+'</span></div>';

  if(e.k==='study'){
    h+='<div class="tblwrap" style="margin-top:.9rem"><table><thead><tr>';
    e.h.forEach(function(c){h+='<th>'+esc(c)+'</th>';});
    h+='</tr></thead><tbody>';
    e.r.forEach(function(r){h+='<tr>';r.forEach(function(c){h+='<td>'+esc(c)+'</td>';});h+='</tr>';});
    h+='</tbody></table></div>';
    h+='<div class="row"><button class="btn ghost" data-act="tick">'+(done?'Done ✓':'Mark as read')+'</button></div></section>';
    return h;
  }
  if(e.k==='project'){
    var k=itKey(set,e.n,0);
    h+='<div class="project">'+esc(e.i)+(e.x?'<div class="extra">'+esc(e.x)+'</div>':'')+'</div>'+
       '<textarea class="txt" rows="5" data-k="'+k+'" placeholder="Draft it here — your text is saved on this device.">'+esc(aget(k))+'</textarea><div class="saved"></div>'+
       '<div class="row"><button class="btn ghost" data-act="tick">'+(done?'Done ✓':'Mark as done')+'</button></div></section>';
    return h;
  }

  h+='<div class="items">';
  e.q.forEach(function(q,i){
    var k=itKey(set,e.n,i);
    h+='<div class="item" data-i="'+i+'"><span class="idx">'+(i+1)+'.</span><div class="body">';
    if(e.k==='gap'){ h+=gapRow(set,e,i,q); }
    else if(e.k==='pick'){
      h+='<div class="q">'+esc(q[0])+'</div><div class="opts" data-a="'+esc(q[1])+'">';
      e.o.forEach(function(o){
        h+='<button class="opt'+(aget(k)===o[0]?' sel':'')+'" data-k="'+k+'" data-v="'+esc(o[0])+'">'+esc(o[1])+'</button>';
      });
      h+='</div><div class="why"></div>';
    }
    else if(e.k==='mcq'){
      h+='<div class="q">'+esc(q[0])+'</div><div class="opts" data-a="'+q[2]+'">';
      q[1].forEach(function(o,j){
        h+='<button class="opt'+(aget(k)===String(j)?' sel':'')+'" data-k="'+k+'" data-v="'+j+'">'+esc(o)+'</button>';
      });
      h+='</div><div class="why" data-txt="'+esc(q[3]||'')+'"></div>';
    }
    else if(e.k==='match'){
      h+='<div class="q">'+esc(q[0])+'</div><select class="txt" data-k="'+k+'" data-a="'+esc(q[1])+'"><option value="">— choose —</option>';
      e.o.forEach(function(o){
        h+='<option value="'+esc(o[0])+'"'+(aget(k)===o[0]?' selected':'')+'>'+esc(o[0])+'. '+esc(o[1])+'</option>';
      });
      h+='</select><div class="why"></div>';
    }
    else { /* write | open */
      h+='<div class="q">'+esc(q[0])+'</div>'+
         '<textarea class="txt" rows="'+(e.k==='open'?3:2)+'" data-k="'+k+'" data-a="'+esc(q[1]||'')+'" placeholder="Your answer…">'+esc(aget(k))+'</textarea>'+
         '<div class="saved"></div>'+
         (q[1]?'<div class="model"><b>Model answer</b>'+esc(q[1])+'</div>':'');
    }
    h+='</div></div>';
  });
  h+='</div><div class="row">';
  h=h.replace('<div class="items">', e.q.length<2?'<div class="items one">':'<div class="items">');
  if(e.k==='gap'||e.k==='pick'||e.k==='mcq'||e.k==='match') h+='<button class="btn primary" data-act="check">Check answers</button><button class="btn ghost" data-act="show">Show answers</button>';
  else if(e.k==='write') h+='<button class="btn primary" data-act="check">Check answers</button><button class="btn ghost" data-act="show">Show model answers</button>';
  else {
    h+='<button class="btn primary" data-act="tick">'+(done?'Done ✓':'Mark as done')+'</button>';
    if(e.q.some(function(q){return q[1]&&String(q[1]).trim();}))
      h+='<button class="btn ghost" data-act="show">Show model answers</button>';
  }
  h+='<button class="btn ghost" data-act="clear">Clear</button><span class="score"></span></div></section>';
  return h;
}

/* ══════════ VIEWS ══════════ */
var cur='home';
function renderHome(){
  var totalD=0,totalT=0;
  DATA.forEach(function(s){totalD+=exDone(s);totalT+=exCount(s);});
  var h='<div class="home"><span class="eyebrow">Advanced 4 · C1</span>'+
    '<h1>The whole booklet,<br><span>one screen.</span></h1>'+
    '<p class="lede">Twenty-five sets: grammar explanations, self-checking practice, and space to draft every writing task. Your answers stay on this device.</p>'+
    '<div class="bar" style="max-width:420px"><i style="width:'+(totalT?Math.round(totalD/totalT*100):0)+'%"></i></div>'+
    '<div class="barlabel" style="max-width:420px"><span>'+totalD+' of '+totalT+' activities completed</span><span>'+(totalT?Math.round(totalD/totalT*100):0)+'%</span></div>'+
    '<div class="grid" id="grid">';
  DATA.forEach(function(s){
    var d=exDone(s),t=exCount(s);
    h+='<button class="tile" data-go="'+s.n+'" data-find="'+esc((s.n+' '+s.t+' '+s.s+' '+s.tags).toLowerCase())+'">'+
       '<span class="n">SET '+s.n+'</span><h3>'+esc(s.t)+'</h3><p>'+esc(s.s)+'</p>'+
       '<span class="mini"><i style="width:'+(t?Math.round(d/t*100):0)+'%"></i></span></button>';
  });
  h+='</div><div class="foot">Companion to <em>Natural Speech Advanced 4</em> — Phil Young\'s English School. '+
     'Explanations and practice items follow the printed Student\'s Booklet; answer keys and model answers were written for this study tool. '+
     'For use by students enrolled in the course.</div></div>';
  document.getElementById('main').innerHTML=h;
}
function renderSet(n){
  var s=DATA.filter(function(x){return x.n===n;})[0]; if(!s) return renderHome();
  var d=exDone(s),t=exCount(s);
  var h='<div class="shead"><span class="eyebrow">Set '+s.n+' · '+esc(s.grp)+'</span>'+
        '<h1>'+esc(s.t)+'</h1><div class="sub">'+esc(s.s)+'</div>'+
        '<div class="bar"><i style="width:'+(t?Math.round(d/t*100):0)+'%"></i></div>'+
        '<div class="barlabel"><span>'+d+' of '+t+' activities completed</span><span>'+(t?Math.round(d/t*100):0)+'%</span></div></div>';
  s.sec.forEach(function(sec){
    h+='<section class="sec"><h2><span class="tag">'+esc(sec.L)+'</span>'+esc(sec.t)+'</h2>';
    h+=learnHTML(sec.learn);
    sec.ex.forEach(function(e){h+=exHTML(s.n,e);});
    h+='</section>';
  });
  var pv=DATA.filter(function(x){return x.n===n-1;})[0], nx=DATA.filter(function(x){return x.n===n+1;})[0];
  h+='<div class="pager">'+
     (pv?'<button data-go="'+pv.n+'"><small>← Set '+pv.n+'</small>'+esc(pv.t)+'</button>':'<button disabled><small>Start</small>First set</button>')+
     (nx?'<button class="nx" data-go="'+nx.n+'"><small>Set '+nx.n+' →</small>'+esc(nx.t)+'</button>':'<button class="nx" disabled><small>End</small>You made it 🎓</button>')+
     '</div>';
  document.getElementById('main').innerHTML=h;
}
function chrome(){
  var pv=document.getElementById('prev'), nx=document.getElementById('next'), lb=document.getElementById('setnav');
  var n=cur==='home'?0:+cur;
  pv.disabled=!(n>1); nx.disabled=!(n>0&&n<25);
  if(n){var s=DATA.filter(function(x){return x.n===n;})[0];lb.innerHTML='<b>SET '+n+'</b>'+esc(s?s.t:'');}
  else lb.textContent='';
}
function go(v){
  cur=v;
  if(v==='home'){renderHome();location.hash='';}
  else{renderSet(+v);location.hash='set'+v;}
  window.scrollTo(0,0);
  document.querySelectorAll('.slink').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-go')===String(v));});
  paintPips();
  chrome();
  closeSide();
}

/* ══════════ CHECKING ══════════ */
function setScore(card,right,total,reveal){
  var sp=card.querySelector('.score');
  if(sp){sp.textContent=reveal?('answers shown — '+right+' / '+total):(right+' / '+total+' correct');
         sp.className='score'+(reveal?'':(right===total?' good':(right>0?' part':'')));}
  if(reveal) return;                       /* revealing answers does not earn progress */
  var k=exKey(card.getAttribute('data-set'),card.getAttribute('data-ex'));
  var ok=right===total&&total>0;
  mark(k,ok); card.classList.toggle('done',ok); paintPips();
}
function check(card,reveal){
  var kind=card.getAttribute('data-kind'), right=0, total=0;
  if(kind==='gap'){
    card.querySelectorAll('input.gapi').forEach(function(inp){
      total++;
      var good=hit(inp.value,inp.getAttribute('data-a'));
      if(reveal&&!good){inp.value=String(inp.getAttribute('data-a')).split('|')[0].replace(/^-$/,'–');aset(inp.getAttribute('data-k'),inp.value);good=true;}
      inp.classList.remove('ok','no');inp.classList.add(good?'ok':'no');
      if(good)right++;
    });
  } else if(kind==='pick'||kind==='mcq'){
    card.querySelectorAll('.opts').forEach(function(box){
      total++;
      var ans=box.getAttribute('data-a'), got=null;
      box.querySelectorAll('.opt').forEach(function(b){if(b.classList.contains('sel'))got=b.getAttribute('data-v');});
      var good=String(got)===String(ans);
      box.querySelectorAll('.opt').forEach(function(b){
        b.classList.remove('good','bad','reveal');
        if(b.classList.contains('sel'))b.classList.add(good?'good':'bad');
        if((reveal||!good)&&b.getAttribute('data-v')===String(ans)&&!b.classList.contains('sel'))b.classList.add('reveal');
      });
      var why=box.parentNode.querySelector('.why');
      if(why){var t=why.getAttribute('data-txt');if(t){why.innerHTML='<b>Why:</b> '+esc(t);why.classList.add('show');}}
      if(good)right++;
    });
  } else if(kind==='match'){
    card.querySelectorAll('select.txt').forEach(function(sel){
      total++;
      var good=sel.value===sel.getAttribute('data-a');
      if(reveal&&!good){sel.value=sel.getAttribute('data-a');aset(sel.getAttribute('data-k'),sel.value);good=true;}
      sel.classList.remove('ok','no');sel.classList.add(good?'ok':'no');
      if(good)right++;
    });
  } else if(kind==='write'){
    card.querySelectorAll('textarea.txt').forEach(function(ta){
      total++;
      var good=loose(ta.value,ta.getAttribute('data-a'));
      ta.classList.remove('ok','no');ta.classList.add(good?'ok':'no');
      var m=ta.parentNode.querySelector('.model');
      if(m&&(!good||reveal))m.classList.add('show');
      if(good)right++;
    });
  }
  setScore(card,right,total,reveal);
}

/* ══════════ EVENTS ══════════ */
document.addEventListener('click',function(ev){
  var t=ev.target;

  var goer=t.closest('[data-go]');
  if(goer){go(goer.getAttribute('data-go'));return;}

  if(t.classList&&t.classList.contains('opt')){
    var box=t.parentNode;
    box.querySelectorAll('.opt').forEach(function(b){b.classList.remove('sel','good','bad','reveal');});
    t.classList.add('sel');
    aset(t.getAttribute('data-k'),t.getAttribute('data-v'));
    return;
  }

  var act=t.getAttribute&&t.getAttribute('data-act');
  if(!act) return;
  var card=t.closest('.ex');
  if(act==='check') check(card,false);
  else if(act==='show'){
    if(card.getAttribute('data-kind')==='open'||card.getAttribute('data-kind')==='project'){
      card.querySelectorAll('.model').forEach(function(m){m.classList.add('show');});
    } else check(card,true);
  }
  else if(act==='tick'){
    var k=exKey(card.getAttribute('data-set'),card.getAttribute('data-ex'));
    var now=!card.classList.contains('done');
    mark(k,now);card.classList.toggle('done',now);paintPips();
    t.textContent=now?'Done ✓':(card.getAttribute('data-kind')==='study'?'Mark as read':'Mark as done');
  }
  else if(act==='clear'){
    card.querySelectorAll('input.gapi,textarea.txt,select.txt').forEach(function(f){
      f.value='';f.classList.remove('ok','no');aset(f.getAttribute('data-k'),'');
    });
    card.querySelectorAll('.opt').forEach(function(b){b.classList.remove('sel','good','bad','reveal');aset(b.getAttribute('data-k'),'');});
    card.querySelectorAll('.model,.why').forEach(function(m){m.classList.remove('show');});
    var sp=card.querySelector('.score');if(sp){sp.textContent='';sp.className='score';}
    mark(exKey(card.getAttribute('data-set'),card.getAttribute('data-ex')),false);
    card.classList.remove('done');paintPips();
  }
});

document.addEventListener('input',function(ev){
  var f=ev.target;
  if(!f.getAttribute||!f.getAttribute('data-k')) return;
  aset(f.getAttribute('data-k'),f.value);
  f.classList.remove('ok','no');
  var s=f.parentNode.querySelector('.saved');
  if(s){s.textContent='Saved';clearTimeout(f._t);f._t=setTimeout(function(){s.textContent='';},1200);}
});
document.addEventListener('change',function(ev){
  var f=ev.target;
  if(f.tagName==='SELECT'&&f.getAttribute('data-k')) aset(f.getAttribute('data-k'),f.value);
});

/* search */
document.getElementById('q').addEventListener('input',function(){
  var v=this.value.trim().toLowerCase();
  document.querySelectorAll('.slink[data-find]').forEach(function(b){
    b.classList.toggle('hide', v!==''&&b.getAttribute('data-find').indexOf(v)<0);
  });
  document.querySelectorAll('.side h4').forEach(function(hh){
    var any=false,el=hh.nextElementSibling;
    while(el&&el.tagName!=='H4'){if(el.classList.contains('slink')&&!el.classList.contains('hide'))any=true;el=el.nextElementSibling;}
    hh.classList.toggle('hide',!any);
  });
  document.querySelectorAll('#grid .tile').forEach(function(b){
    b.classList.toggle('hide', v!==''&&b.getAttribute('data-find').indexOf(v)<0);
  });
});

/* chrome */
function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('scrim').classList.remove('on');}
document.getElementById('burger').addEventListener('click',function(){
  document.getElementById('side').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on');
});
document.getElementById('scrim').addEventListener('click',closeSide);
document.getElementById('print').addEventListener('click',function(){window.print();});
document.getElementById('prev').addEventListener('click',function(){if(cur!=='home'&&+cur>1)go(+cur-1);});
document.getElementById('next').addEventListener('click',function(){if(cur!=='home'&&+cur<25)go(+cur+1);});
document.getElementById('theme').addEventListener('click',function(){
  var r=document.documentElement,dark=r.getAttribute('data-theme')==='dark';
  r.setAttribute('data-theme',dark?'light':'dark');
  this.textContent=dark?'☾':'☀';
  try{localStorage.setItem('gh-theme',dark?'light':'dark');}catch(e){}
});
(function(){
  try{if(localStorage.getItem('gh-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('theme').textContent='☀';}}catch(e){}
})();
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
  if(cur==='home') return;
  if(e.key==='ArrowRight'&&+cur<25) go(+cur+1);
  if(e.key==='ArrowLeft'&&+cur>1) go(+cur-1);
});
window.addEventListener('hashchange',function(){
  var m=/^#set(\d+)$/.exec(location.hash);
  var v=m?m[1]:'home';
  if(String(cur)!==String(v)) go(v);
});

/* boot */
DATA.sort(function(a,b){return a.n-b.n;});
buildSide();
var m0=/^#set(\d+)$/.exec(location.hash);
go(m0?m0[1]:'home');
</script>
