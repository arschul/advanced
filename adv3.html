<style>
:root{
 --paper:#f3efe7; --card:#fbf9f4; --raise:#ffffff;
 --ink:#22302a; --ink-soft:#5d6b63; --ink-faint:#8a958d;
 --line:#e5ddd0; --line-soft:#eee7db;
 --brand:#1f6f5c; --brand-soft:#e4efe9; --brand-deep:#144a3d;
 --coral:#e2664a; --coral-soft:#fbe4dc;
 --gold:#cf9526; --gold-soft:#f6ecd4;
 --correct:#1f7a55; --correct-soft:#e2efe6;
 --wrong:#cf4a37; --wrong-soft:#f8e2dd;
 --r:16px; --r-sm:10px; --r-xs:7px;
}
:root[data-theme="dark"]{
 --paper:#121815; --card:#1a221e; --raise:#212b26;
 --ink:#eef2ec; --ink-soft:#a7b3ac; --ink-faint:#788079;
 --line:#2a352f; --line-soft:#232d28;
 --brand:#4bb795; --brand-soft:#1a2a24; --brand-deep:#78d3b6;
 --coral:#f0805f; --coral-soft:#2c211d;
 --gold:#e0b24d; --gold-soft:#2a2417;
 --correct:#4bb488; --correct-soft:#18271f;
 --wrong:#e46a54; --wrong-soft:#2c1d19;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;}
em{font-family:'Newsreader',Georgia,serif;font-style:italic;}

/* ── TOP BAR ── */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:.9rem;height:60px;padding:0 1.1rem;
 background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.burger{display:inline-flex;align-items:center;gap:.45rem;background:none;border:1px solid var(--line);border-radius:100px;height:36px;padding:0 .85rem;font:inherit;font-size:.84rem;font-weight:600;color:var(--ink-soft);cursor:pointer;flex:none;}
.burger:hover{border-color:var(--brand);color:var(--brand);}
.burger b{font-weight:700;}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.02rem;letter-spacing:-.02em;color:var(--brand);text-decoration:none;white-space:nowrap;}
.brand span{color:var(--coral);}
.brand small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
.searchwrap{position:relative;flex:1;max-width:420px;margin-left:auto;}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:.5rem 2.2rem .5rem 2.2rem;font:inherit;font-size:.87rem;color:var(--ink);}
.search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.searchwrap::before{content:'⌕';position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:1.05rem;}
.iconbtn{background:none;border:1px solid var(--line);border-radius:100px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);font-size:.95rem;flex:none;}
.iconbtn:hover{border-color:var(--brand);color:var(--brand);}
.iconbtn[disabled]{opacity:.32;cursor:default;}
.iconbtn[disabled]:hover{border-color:var(--line);color:var(--ink-soft);}
.setnav{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.84rem;color:var(--ink-soft);white-space:nowrap;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;max-width:36vw;}
.setnav b{color:var(--coral);font-weight:800;margin-right:.4rem;}

/* ── LAYOUT ── */
.wrap{display:block;}
.side{position:fixed;top:60px;left:0;z-index:56;width:312px;max-width:86vw;height:calc(100vh - 60px);overflow-y:auto;
 border-right:1px solid var(--line);padding:1.1rem .8rem 4rem;background:var(--paper);
 transform:translateX(-103%);transition:transform .24s ease;box-shadow:0 14px 44px rgba(0,0,0,.18);}
.side.open{transform:none;}
.scrim{display:none;}
.scrim.on{display:block;position:fixed;inset:60px 0 0;background:rgba(0,0,0,.34);z-index:54;}
.side h4{font-family:'DM Sans',sans-serif;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:1.3rem .55rem .5rem;font-weight:700;}
.side h4:first-child{margin-top:.2rem;}
.slink{display:flex;gap:.6rem;align-items:baseline;width:100%;text-align:left;background:none;border:none;border-radius:var(--r-sm);padding:.5rem .55rem;cursor:pointer;color:var(--ink-soft);font:inherit;font-size:.84rem;line-height:1.35;}
.slink:hover{background:var(--card);color:var(--ink);}
.slink.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600;}
.slink .num{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.72rem;color:var(--ink-faint);min-width:1.35rem;flex:none;}
.slink.on .num{color:var(--brand);}
.slink .ttl{flex:1;}
.slink .pip{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;align-self:center;}
.slink .pip.part{background:var(--gold);}
.slink .pip.full{background:var(--brand);}
.slink.hide{display:none;}
.side h4.hide{display:none;}

.main{padding:2rem clamp(1.1rem,3.5vw,3rem) 6rem;max-width:1400px;margin:0 auto;}

/* ── SET HEADER ── */
.shead{border-bottom:1px solid var(--line);padding-bottom:1.4rem;margin-bottom:1.8rem;}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.68rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--coral);background:var(--coral-soft);border-radius:100px;padding:.28rem .7rem;}
.shead h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.08;letter-spacing:-.025em;margin:.8rem 0 .4rem;}
.shead .sub{color:var(--ink-soft);font-size:1rem;max-width:70ch;}
.bar{height:6px;border-radius:100px;background:var(--line-soft);margin-top:1.1rem;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));width:0;transition:width .4s;}
.barlabel{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-faint);margin-top:.45rem;}

/* ── SECTION ── */
.sec{margin:2.4rem 0;}
.sec > h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.22rem;letter-spacing:-.01em;display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;}
.sec > h2 .tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--brand-soft);border-radius:var(--r-xs);padding:.2rem .5rem;flex:none;}

/* learn blocks */
.learn{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem 1.4rem;margin-bottom:1.2rem;}
.learn > * + *{margin-top:.95rem;}
.learn p{font-size:.95rem;color:var(--ink-soft);max-width:82ch;}
.formula{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;text-align:center;background:var(--raise);border:1px dashed var(--brand);border-radius:var(--r-sm);padding:.85rem 1rem;color:var(--brand-deep);letter-spacing:.01em;font-size:.95rem;}
.trick{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:var(--r-xs);padding:.75rem .95rem;font-size:.9rem;color:var(--ink);}
.note{background:var(--coral-soft);border-left:3px solid var(--coral);border-radius:var(--r-xs);padding:.75rem .95rem;font-size:.9rem;}
.egs{display:flex;flex-direction:column;gap:.5rem;}
.egs{max-width:92ch;}
.egs div{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:1.02rem;line-height:1.5;padding-left:1.1rem;position:relative;color:var(--ink);}
.egs div::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold);}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:420px;}
th{text-align:left;font-weight:700;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:.5rem .65rem;border-bottom:1px solid var(--line);}
td{padding:.55rem .65rem;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-soft);}
td:first-child{color:var(--ink);font-weight:500;}
tr:last-child td{border-bottom:none;}

/* ── EXERCISE CARD ── */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem 1.4rem;margin-bottom:1.1rem;}
.ex.done{border-color:var(--brand);}
.exhead{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.35rem;}
.exno{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.78rem;color:var(--raise);background:var(--brand);border-radius:var(--r-xs);padding:.22rem .5rem;flex:none;letter-spacing:.03em;}
.ex.done .exno::after{content:' ✓';}
.exi{font-size:.9rem;color:var(--ink-soft);flex:1;}
.items{margin-top:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:.9rem 2.2rem;align-items:start;}
.items.one{grid-template-columns:minmax(0,1fr);}
.item{display:flex;gap:.7rem;align-items:flex-start;}
.idx{font-family:'Bricolage Grotesque',sans-serif;font-size:.78rem;font-weight:700;color:var(--ink-faint);min-width:1.3rem;padding-top:.35rem;flex:none;}
.body{flex:1;min-width:0;}
.q{font-size:.95rem;line-height:1.75;}
.q em{color:var(--ink);}

input.txt,textarea.txt{font:inherit;font-size:.92rem;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-xs);padding:.35rem .55rem;}
input.txt{min-width:8rem;width:9.5rem;}
input.gapi{width:8.5rem;text-align:center;border-bottom:2px solid var(--brand);border-radius:var(--r-xs) var(--r-xs) 0 0;}
input.txt:focus,textarea.txt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.wide{width:100%;display:block;margin-top:.4rem;}
textarea.txt{width:100%;display:block;margin-top:.45rem;resize:vertical;min-height:2.6rem;line-height:1.6;}
.ok{border-color:var(--correct)!important;background:var(--correct-soft)!important;}
.no{border-color:var(--wrong)!important;background:var(--wrong-soft)!important;}

.opts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem;}
.opt{font:inherit;font-size:.83rem;background:var(--raise);border:1px solid var(--line);border-radius:100px;padding:.28rem .8rem;cursor:pointer;color:var(--ink-soft);transition:.15s;}
.opt:hover{border-color:var(--brand);color:var(--brand);}
.opt.sel{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.opt.sel.good{background:var(--correct);border-color:var(--correct);}
.opt.sel.bad{background:var(--wrong);border-color:var(--wrong);}
.opt.reveal{border-color:var(--correct);color:var(--correct);}
select.txt{font:inherit;font-size:.88rem;padding:.32rem .5rem;border:1px solid var(--line);border-radius:var(--r-xs);background:var(--raise);color:var(--ink);margin-top:.35rem;}

.why{font-size:.83rem;color:var(--ink-soft);margin-top:.4rem;padding-left:.75rem;border-left:2px solid var(--line);display:none;}
.why.show{display:block;}
.why b{color:var(--brand-deep);font-weight:600;}

.row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.1rem;align-items:center;}
.btn{font:inherit;font-size:.85rem;font-weight:600;border-radius:100px;padding:.45rem 1.05rem;cursor:pointer;border:1px solid transparent;}
.btn.primary{background:var(--brand);color:#fff;}
.btn.primary:hover{background:var(--brand-deep);}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--coral);color:var(--coral);}
.score{margin-left:auto;font-size:.83rem;font-weight:600;color:var(--ink-faint);}
.score.good{color:var(--correct);}
.score.part{color:var(--gold);}

.model{margin-top:.45rem;font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:1rem;color:var(--brand-deep);background:var(--brand-soft);border-radius:var(--r-xs);padding:.5rem .7rem;display:none;}
.model.show{display:block;}
.item.rv-flash{animation:rvflash 1.2s ease;}
@keyframes rvflash{0%{background:var(--brand-soft);}100%{background:transparent;}}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none;}
.rvbtn{flex:none;font:inherit;font-size:.72rem;font-weight:600;background:none;border:1px solid var(--line);border-radius:100px;padding:.2rem .6rem;margin-top:.3rem;cursor:pointer;color:var(--ink-faint);}
.rvbtn:hover{border-color:var(--brand);color:var(--brand);}
.item.rv .rvbtn{visibility:hidden;}
.model b{font-family:'DM Sans',sans-serif;font-style:normal;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:.2rem;opacity:.75;}

.project{background:var(--raise);border:1px solid var(--gold);border-radius:var(--r-sm);padding:1rem 1.1rem;font-size:.93rem;}
.project .extra{margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line);color:var(--ink-soft);font-size:.88rem;}

.saved{font-size:.74rem;color:var(--ink-faint);margin-top:.3rem;height:1rem;}

/* ── HOME ── */
.home h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.1rem);line-height:1.03;letter-spacing:-.03em;margin:.9rem 0 .7rem;}
.home h1 span{color:var(--coral);}
.home .lede{color:var(--ink-soft);font-size:1.02rem;max-width:46ch;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(226px,1fr));gap:.9rem;margin-top:1.6rem;}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;cursor:pointer;font:inherit;color:inherit;transition:.2s;position:relative;}
.tile:hover{border-color:var(--brand);transform:translateY(-3px);}
.tile .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.1em;color:var(--coral);}
.tile h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.99rem;line-height:1.25;margin:.35rem 0 .3rem;letter-spacing:-.01em;}
.tile p{font-size:.8rem;color:var(--ink-faint);line-height:1.45;}
.tile .mini{height:4px;border-radius:100px;background:var(--line-soft);margin-top:.8rem;overflow:hidden;}
.tile .mini i{display:block;height:100%;background:var(--brand);width:0;}
.tile.hide{display:none;}
.foot{margin-top:3.5rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-faint);line-height:1.7;}

.pager{display:flex;gap:.6rem;margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--line);}
.pager button{flex:1;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:.75rem .95rem;cursor:pointer;font:inherit;color:var(--ink);}
.pager button:hover{border-color:var(--brand);}
.pager small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.15rem;}
.pager .nx{text-align:right;}
.pager button[disabled]{opacity:.35;cursor:default;}

@media(max-width:880px){
 .burger b{display:none;}
 .burger{padding:0 .7rem;}
 .main{padding:1.4rem 1.1rem 5rem;}
 .brand small{display:none;}
 .searchwrap{max-width:none;}
 .setnav{display:none;}
}
@media(max-width:640px){
 .searchwrap{display:none;}
}
@media print{
 .top,.side,.pager,.row,.scrim{display:none!important;}
 .main{padding:0;max-width:none;}
 .model,.why{display:block!important;}
 .ex,.learn{break-inside:avoid;border-color:#ccc;}
}
</style>
</head>

        ["Dogs make excellent family pets because they are loyal and healthy.","1"],

    {n:"C2",k:"open",i:"Write one paragraph (5–7 sentences) on ONE of these topics: a change that would improve our school · a habit that helps people succeed · your opinion on social media.  Checklist: thesis statement in the first sentence · correct a/an/the · 2–3 supporting sentences · a concluding sentence.",
     q:[["Your paragraph","Our school should replace the 7:30 start with an 8:30 start because teenagers simply cannot sleep early enough to be alert at dawn. First, adolescent body clocks shift during puberty, so an early alarm cuts into the deepest part of the night. Second, the first period is where most of the failed quizzes happen, which suggests students are not actually awake for it. A later start would also reduce the number of students who skip breakfast entirely. For these reasons, moving the bell one hour later would cost the school nothing and improve almost everything."]]}
   ]},
  {L:"D",t:"Mini Project: The \"Brazil Explained\" Challenge",learn:[],
   ex:[{n:"D1",k:"project",i:"Pick one Brazilian thing (a food, a habit, a place, an expression) and convince a foreigner that it is amazing, in a 5–7 sentence paragraph. Can you move someone from \"I don’t know\" to \"I want to try that\"?",
        x:"Challenge: write a short paragraph (5–7 sentences) about a place you love. Then draw a simple picture of that place on the back of the page. Exchange with a partner — they read your paragraph and guess the place from your drawing."}]}
 ]},

{n:2,t:"Cut, Fix, Improve: The Sentence Surgeon Lab",s:"Making your paragraph clear and correct",grp:"Writing & essays",tags:"topic sentence word order svo revise edit paragraph",
 sec:[
  {L:"A",t:"Topic sentences",
   learn:[
    {b:"p",x:"A topic sentence is the first sentence of a paragraph. It tells the reader one main idea and connects to your thesis."},
    {b:"formula",x:"TOPIC SENTENCE = ONE IDEA + WHAT THE PARAGRAPH WILL SAY ABOUT IT"},
    {b:"eg",x:["✗ I will talk about flexibility. (too vague)",
              "✓ First, online learning offers flexibility for working students. (clear and specific)"]}
   ],
   ex:[
    {n:"A1",k:"mcq",i:"Choose the better topic sentence.",
     q:[["Which is the better topic sentence?",["Dogs are good.","Dogs make great family pets because they are loyal."],1,"The second names one idea and says what the paragraph will argue about it."],
        ["Which is the better topic sentence?",["Second, lower costs help students save money.","Second, money is important."],0,"The first is specific and connects to the essay’s point; the second could introduce anything."],
        ["Which is the better topic sentence?",["This paragraph is about exercise.","Regular exercise improves mental health by reducing stress."],1,"Announcing the topic is not the same as stating an idea about it."]]},
    {n:"A2",k:"write",i:"Write one topic sentence for a paragraph about your favorite season. One idea + what you will say about it.",
     q:[["Your topic sentence","Winter is the most productive season of the year because the cold keeps you indoors and on task."]]}
   ]},
  {L:"B",t:"Word order (SVO)",
   learn:[
    {b:"formula",x:"SUBJECT + VERB + OBJECT + (TIME / PLACE)"},
    {b:"eg",x:["✓ She writes essays every day.   ✓ I like coffee.",
              "✗ She every day writes essays.   ✗ I coffee like."]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Put the words in the correct order (SVO).",
     q:[["every day / drinks / tea / Maria","Maria drinks tea every day."],
        ["to the park / walk / We / on Sundays","We walk to the park on Sundays."],
        ["English / They / study / at the library","They study English at the library."]]},
    {n:"B2",k:"write",i:"Write two correct SVO sentences about your daily routine.",
     q:[["Sentence 1","I check my messages before breakfast."],
        ["Sentence 2","My brother takes the bus to work at seven."]]}
   ]},
  {L:"C",t:"Revise a paragraph",
   learn:[
    {b:"p",x:"Revise means to make your writing better — not just fix spelling. Ask yourself: does every sentence support the topic sentence? Is the word order correct (SVO)? Are the articles (a/an/the) used correctly?"},
    {b:"note",x:"REVISE ≠ EDIT. Edit = fix small mistakes. Revise = improve the whole paragraph."}
   ],
   ex:[
    {n:"C1",k:"write",i:"Read the weak paragraph, then revise it using the checklist.  Weak paragraph: \"Online learning is good. Students can study at home. They like it because is flexible. The courses are cheap. For these reasons online learning popular.\"",
     q:[["Your revised version","Online learning is an effective option for many students because it is flexible and affordable. First, students can study at home and watch recorded lectures whenever their schedule allows. Second, online courses usually cost far less than in-person programs. For these reasons, online learning has become popular with working students and parents."]]},
    {n:"C2",k:"open",i:"Take the paragraph you wrote in Set 1 and revise it here.  Checklist: topic sentence at the beginning? · SVO word order everywhere? · correct a/an/the? · does every sentence support the main idea?",
     q:[["Your revised paragraph",""]]}
   ]},
  {L:"D",t:"Mini Project: The \"Sentence Surgeon\" Revision Lab",learn:[],
   ex:[{n:"D1",k:"project",i:"You are a Sentence Surgeon. Your job is to take a sick paragraph (full of errors) and operate on it until it is healthy. 1) Diagnose the problems (missing topic sentence, SVO errors, article errors). 2) Operate — rewrite the paragraph correctly. 3) Present your work: show the \"before\" and the \"after\".",x:""}]}
 ]},

{n:3,t:"Problem Solved! Building a Problem-Solution Essay",s:"Problem-solution essays, part 1 — introduction & problem paragraph",grp:"Writing & essays",tags:"problem solution essay thesis hook parallel structure outline",
 sec:[
  {L:"A",t:"Problem-solution essay — introduction + problem paragraph",
   learn:[
    {b:"p",x:"A problem-solution essay has two main parts to begin with: 1) the introduction — hook, background, and a thesis that names the problem; 2) the problem paragraph — describes the problem clearly (causes, effects, or both)."},
    {b:"formula",x:"[PROBLEM] IS A SERIOUS ISSUE BECAUSE [REASON], BUT IT CAN BE SOLVED BY [SOLUTION PREVIEW]"},
    {b:"eg",x:["Traffic congestion is a serious issue because it wastes time and increases pollution, but it can be solved by improving public transportation."]}
   ],
   ex:[
    {n:"A1",k:"pick",i:"Read each sentence. Is it a hook, a problem statement, or a thesis?",
     o:[["I","I — introduction hook"],["P","P — problem"],["T","T — thesis"]],
     q:[["Have you ever been stuck in traffic for an hour?","I"],
        ["Traffic congestion wastes time and harms the environment.","P"],
        ["Traffic congestion is a serious issue because it wastes time, but better bus systems can help.","T"]]},
    {n:"A2",k:"write",i:"Choose one problem — air pollution · smartphone addiction · low student motivation — and write a thesis statement (problem + reason + solution preview).",
     q:[["Your thesis","Smartphone addiction is a serious issue because it fragments attention and disrupts sleep, but it can be reduced by app limits and phone-free hours at school."]]}
   ]},
  {L:"B",t:"Parallel structure",
   learn:[
    {b:"p",x:"Parallel structure means using the same grammatical form for items in a list or a series."},
    {b:"eg",x:["✓ I like running, swimming, and biking. (all -ing)",
              "✗ I like running, to swim, and biking. (mixed forms)",
              "✓ The problem is serious, widespread, and urgent. (all adjectives)",
              "✗ The problem is serious, widespread, and it is urgent. (mixed)"]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Correct the parallel structure error in each sentence.",
     q:[["She enjoys reading, to write, and painting.","She enjoys reading, writing, and painting."],
        ["The solution must be cheap, fast, and it should be easy.","The solution must be cheap, fast, and easy."],
        ["Students need time, space, and to have motivation.","Students need time, space, and motivation."]]},
    {n:"B2",k:"write",i:"Complete the sentences, keeping the structure parallel.",
     q:[["To solve this problem, the school should …, …, and ….","To solve this problem, the school should shorten lunch queues, extend library hours, and hire a second counselor."],
        ["The causes of pollution include …, …, and ….","The causes of pollution include heavy traffic, industrial waste, and poor recycling."]]}
   ]},
  {L:"C",t:"Outline an essay",
   learn:[
    {b:"p",x:"An outline helps you organize ideas before writing."},
    {b:"table",h:["I. Introduction","II. Problem paragraph"],r:[
      ["A. Hook (question, fact, or story)","A. Topic sentence (states the problem)"],
      ["B. Background (1–2 sentences)","B. Cause or effect 1"],
      ["C. Thesis (problem + solution preview)","C. Cause or effect 2"],
      ["","D. Concluding sentence"]]}
   ],
   ex:[
    {n:"C1",k:"match",i:"Match each outline element to the sentence that belongs to it.",
     o:[["A","First, air pollution comes from cars and factories."],["B","Did you know that 9 out of 10 people breathe polluted air?"],["C","Air pollution is a serious problem, but renewable energy can help."]],
     q:[["Hook","B"],["Thesis","C"],["Topic sentence (problem)","A"]]},
    {n:"C2",k:"open",i:"Complete the outline for your chosen problem.",
     q:[["My problem",""],["I.A — Hook",""],["I.B — Background",""],["I.C — Thesis",""],
        ["II.A — Topic sentence",""],["II.B — Cause / effect 1",""],["II.C — Cause / effect 2",""],["II.D — Concluding sentence",""]]}
   ]},
  {L:"D",t:"Mini Project: The \"Fix My City\" Campaign Poster",learn:[],
   ex:[{n:"D1",k:"project",i:"You are a concerned citizen who wants to solve a problem in your city, your neighborhood, or a place you know well. Create a campaign poster that 1) names the problem, with a hook and background; 2) explains why it matters (causes or effects); 3) shows your solution. Your poster should convince people that the problem is real and that your solution can work.",x:""}]}
 ]},

{n:4,t:"The \"Sue-Proof\" Writer: Solutions & Hedging",s:"Problem-solution essays, part 2 — solutions + hedging",grp:"Writing & essays",tags:"solution paragraph conclusion hedging may might seems appears careful language",
 sec:[
  {L:"A",t:"Solution paragraph + conclusion",
   learn:[
    {b:"p",x:"Last set you wrote an introduction and a problem paragraph. Now you add a solution paragraph and a conclusion."},
    {b:"table",h:["Solution paragraph","Conclusion"],r:[
      ["States one clear solution","Restates the problem"],
      ["Explains how it works","Summarizes 1–2 solutions"],
      ["Gives a real example (a city, school, or country)","Ends with a final thought — a call to action or a prediction"]]},
    {b:"eg",x:["SOLUTION PARAGRAPH: One effective solution is setting daily screen time limits. Apps like Instagram allow users to set a 30-minute daily reminder. For example, a study showed that teens who used screen limits reported less anxiety after two weeks. Clearly, this small change could make a big difference.",
              "CONCLUSION: In conclusion, FOMO on social media increases anxiety and reduces sleep quality. However, setting screen limits and unfollowing toxic accounts can help. Teenagers must take control before their mental health gets worse."]}
   ],
   ex:[
    {n:"A1",k:"open",i:"Write your solution paragraph. Use the problem you chose in Set 3. Write 4–5 sentences.",
     q:[["My problem",""],["Your solution paragraph",""]]}
   ]},
  {L:"B",t:"Hedging — don’t get sued (or marked down)",
   learn:[
    {b:"p",x:"Hedging means being careful: not claiming to be 100% certain. Academic writing and good reviews use hedging to sound fair, humble and professional."},
    {b:"table",h:["Too strong (dangerous)","Hedged (safe, smart)"],r:[
      ["This solution will work.","This solution may work."],
      ["Social media causes anxiety.","Social media might contribute to anxiety."],
      ["The food is terrible.","The food seemed a bit salty to me."],
      ["The manager is lazy.","The manager appeared to be having an off day."]]},
    {b:"trick",x:"Common hedging words: may · might · could · seems · appears · suggests · often · tends to · in my opinion"}
   ],
   ex:[
    {n:"B1",k:"write",i:"Rewrite each sentence so it is hedged. Use the word in parentheses.",
     q:[["This solution will solve the problem. (may)","This solution may solve the problem."],
        ["Air pollution causes asthma. (might)","Air pollution might cause asthma."],
        ["Online learning is the best option for everyone. (may not)","Online learning may not be the best option for everyone."],
        ["The new policy will reduce costs. (seems)","The new policy seems likely to reduce costs."],
        ["Students fail because of this reason. (could)","Students could fail for this reason."]]},
    {n:"B2",k:"open",i:"Go back to your solution paragraph from A1. Find two sentences that sound too certain and rewrite them with hedging.",
     q:[["Original sentence 1",""],["Hedged version 1",""],["Original sentence 2",""],["Hedged version 2",""]]}
   ]},
  {L:"C",t:"Write your conclusion",
   learn:[
    {b:"p",x:"A conclusion does three jobs in 3–4 sentences: it restates the problem in new words, it summarizes the solution or solutions, and it ends with a final thought — a call to action or a prediction. Keep the hedging: a conclusion that over-promises undoes the careful work of the essay."}
   ],
   ex:[
    {n:"C1",k:"open",i:"Write the conclusion to your problem-solution essay (3–4 sentences). Use at least two hedging words.",
     q:[["Your conclusion","In conclusion, constant notifications appear to fragment the attention of students who are already short of study time. Screen-time limits and phone-free lessons may not eliminate the problem, but they seem to reduce it at very little cost. If schools act now, the next generation might learn to use these devices rather than be used by them."]]}
   ]},
  {L:"D",t:"Mini Project: The \"Expert Witness\" Rewrite",learn:[],
   ex:[{n:"D1",k:"project",i:"Imagine your essay is being read out in a courtroom and every over-confident claim can be challenged. Swap essays with a partner and act as the opposing lawyer: underline every sentence that claims more than the evidence supports. Then hand it back and rewrite your own flagged sentences with hedging — without making the essay sound weak or vague.",x:""}]}
 ]},

{n:5,t:"Copy-Paste Protector: Summarize, Paraphrase & Cite",s:"Using sources — summarize, paraphrase, cite + reduced relative clauses",grp:"Writing & essays",tags:"summarize paraphrase cite plagiarism sources reduced relative clauses",
 sec:[
  {L:"A",t:"Summarize + paraphrase + cite",
   learn:[
    {b:"p",x:"When you use someone else’s idea, give credit. You have three tools."},
    {b:"table",h:["Tool","What it does","Length","Example"],r:[
      ["Summarize","Main idea only, in your words","Short","Lee (2021) argues that social media affects sleep."],
      ["Paraphrase","Same detail, different words","Similar length","According to Lee (2021), using social media before bed may reduce sleep quality."],
      ["Cite","Tell where you got the information","One line","(Lee, 2021) — or: According to Lee…"]]},
    {b:"trick",x:"Why cite? It shows research · it makes your writing stronger · it avoids plagiarism."}
   ],
   ex:[
    {n:"A1",k:"mcq",i:"Original: \"Loot boxes in video games encourage gambling habits because they use random rewards to trigger dopamine release.\" (Chen, 2022)  —  What is each response?",
     q:[["Chen (2022) explains that random rewards in loot boxes may promote addictive behavior.",["Summary","Paraphrase","Too vague — neither"],0,"It gives the main idea only, and it is shorter than the original."],
        ["Loot boxes are bad (Chen, 2022).",["Summary","Paraphrase","Too vague — neither"],2,"It cites the source but loses the actual claim. A summary must still carry the idea."],
        ["According to Chen (2022), video game loot boxes use unpredictable rewards that could lead to gambling-like habits in young players.",["Summary","Paraphrase","Too vague — neither"],1,"Same detail, same length, different words — that is a paraphrase."]]},
    {n:"A2",k:"write",i:"Read the text once, then write a summary and a paraphrase.  Original: \"Teens who spend more than 4 hours daily on TikTok report higher levels of FOMO and lower self-esteem. However, taking a 7-day break from the app improved mood in 60% of participants.\" (Williams, 2023)",
     q:[["Your summary (main idea only, one sentence)","Williams (2023) found that heavy TikTok use is linked to worse self-esteem, but that a short break helps."],
        ["Your paraphrase (same detail, different words, two sentences)","According to Williams (2023), adolescents who use TikTok for over four hours a day tend to report more fear of missing out and lower self-worth. The same study found that a week away from the platform lifted the mood of three in five participants."]]}
   ]},
  {L:"B",t:"Reduced relative clauses — shorter, more academic",
   learn:[
    {b:"p",x:"Relative clauses add information. Reduced clauses say the same thing in fewer words, which suits academic writing."},
    {b:"table",h:["Full (long)","Reduced (better)"],r:[
      ["Students who are enrolled for the intensive course will start next week.","Students enrolled for the intensive course will start next week."],
      ["The study that was published in 2023 is useful.","The study published in 2023 is useful."],
      ["Social media which is used at night disrupts sleep.","Social media used at night disrupts sleep."]]},
    {b:"trick",x:"Delete the relative pronoun and the form of be: who are enrolled → enrolled · that was published → published."}
   ],
   ex:[
    {n:"B1",k:"write",i:"Reduce the relative clause in each sentence.",
     q:[["The research that was conducted in Brazil showed interesting results.","The research conducted in Brazil showed interesting results."],
        ["Influencers who are paid by brands often hide sponsorships.","Influencers paid by brands often hide sponsorships."],
        ["The app which is designed for teens is very popular.","The app designed for teens is very popular."]]},
    {n:"B2",k:"open",i:"Write two sentences about YOUR problem-solution essay. Use one reduced relative clause in each.",
     q:[["About the problem","Students distracted by constant notifications lose roughly an hour of study time a day."],
        ["About the solution","A policy introduced in several Dublin schools removed phones from classrooms entirely."]]}
   ]},
  {L:"C",t:"Mini Project: The \"Fact Check\" Challenge",learn:[],
   ex:[{n:"C1",k:"project",i:"The scenario: you wrote a paragraph about a problem (fast fashion, FOMO, loot boxes…). A friend says: \"That’s just your opinion. Prove it.\"  Your job: find ONE real fact, or use the source below. Then write three sentences about your problem — one summary of what the source says, one paraphrase of one detail, and one citation (author + year).",
        x:"Source you may use: \"The average teen spends 7 hours per day looking at screens. This has been linked to higher rates of anxiety, lower attention spans, and worse sleep quality. However, reducing screen time to 2 hours per day improved mood in 75% of teens after just one week.\" (Martinez, 2023)"}]}
 ]}

);

{n:6,t:"More Than \"It’s Good\": Writing a Critical Review",s:"Critical reviews, part 1 — judgment, reasons, evidence",grp:"Writing & essays",tags:"critical review judgment evidence gerund participle ing forms evaluation summary",

        ["That restaurant is overrated.","The restaurant trades on its reputation rather than its cooking, since the menu has barely changed in a decade and the prices have doubled."]]}

  {L:"C",t:"The structure of a critical review",

  {L:"D",t:"Gerunds vs. participles (review)",

{n:8,t:"Me, Myself, and I: The Art of the Personal Statement",s:"Personal statements — show, don’t tell + cohesive devices",grp:"Writing & essays",tags:"personal statement application scholarship cohesive devices however therefore for example",
 sec:[
  {L:"A",t:"What is a personal statement?",
   learn:[
    {b:"p",x:"A personal statement is a short persuasive essay about you — for a course, a job, an exchange program, or a scholarship."},
    {b:"eg",x:["✗ Bad: I am hardworking, creative, and friendly. (boring, no evidence)",
              "✓ Good: When my team’s leader quit two days before a tournament, I organized practice sessions, assigned new roles, and kept everyone motivated. We didn’t win, but we finished strong — and I learned that leadership is about staying calm under pressure."]},
    {b:"trick",x:"The secret: show, don’t tell. Use a specific example instead of a list of adjectives."}
   ],
   ex:[
    {n:"A1",k:"open",i:"Warm-up (talk with a partner). Imagine you are applying for a summer exchange program in London. They ask: \"Why should we choose you?\"  What would you mention first? How do you avoid just listing \"I’m hardworking and friendly\"?  Discussion: what is more convincing — saying \"I am creative\", or giving a short example of when you solved a problem creatively?",
     q:[["What you would mention first",""],["Your answer to the discussion question",""]]}
   ]},
  {L:"B",t:"Structure of a personal statement",
   learn:[
    {b:"table",h:["Part","What it does","Example"],r:[
      ["Opening","Who you are + what you want","I am applying for the esports internship because I want to learn how gaming events are managed."],
      ["Specific example","One concrete story, not a list","When I organized a small tournament for 16 players, I learned to handle conflicts and schedules."],
      ["Why it matters","Connect the example to the opportunity","This experience showed me that teamwork matters more than individual skill."],
      ["Closing","What you would bring to them","I would bring my passion for fair play and organization to your team."]]},
    {b:"note",x:"Never start with \"I was born in…\" or \"I have always been…\" — too boring, too predictable."}

        ["Last winter I mapped every storm drain in my neighborhood for a school project and found four that were blocked.","E"],
        ["That project taught me that most environmental problems are maintenance problems first.","W"],
        ["I would bring that same stubbornness about small details to your research group.","C"]]},

  {L:"C",t:"Cohesive devices — glue for your ideas",

    {b:"p",x:"Cohesive devices connect your sentences so your writing flows smoothly."},
    {b:"table",h:["Function","Cohesive device","Example"],r:[
      ["Addition","in addition, furthermore, moreover","I organized tournaments. In addition, I managed social media."],
      ["Contrast","however, although, despite","I have no formal experience. However, I taught myself game design."],
      ["Cause / effect","therefore, as a result, consequently","I practiced daily. Therefore, my skills improved quickly."],

        ["I enjoy work that has a visible result. ___, I rebuilt our club’s booking system over one weekend.",["for example|for instance"]]]},
    {n:"C2",k:"open",i:"Write your personal statement (150–200 words) using the four-part structure. Use at least three different cohesive devices and underline each one.",

{n:9,t:"Combine & Conquer: Writing a Synthesis Report",s:"Synthesis — comparing sources + grammar review of Sets 1–6",grp:"Writing & essays",tags:"synthesis report sources compare combine timed reading grammar review",
 sec:[
  {L:"A",t:"Synthesis report — comparing + writing",
   learn:[
    {b:"p",x:"A synthesis is different from a summary. Summary = one source, restated. Synthesis = two or more sources, compared and combined to show a new idea."},
    {b:"formula",x:"SOURCE A SAYS X. SOURCE B SAYS Y. TOGETHER, THEY SHOW Z."},
    {b:"eg",x:["Martinez (2023) argues that green spaces reduce asthma risk. Kim (2022) claims that air pollution increases breathing problems. Taken together, these studies suggest that cities with less pollution and more parks may have healthier children."]}
   ],
   ex:[
    {n:"A1",k:"write",i:"Read the two sources, then complete the synthesis.  Source A (Lee, 2021): Social media may reduce face-to-face conversation skills.  Source B (Chen, 2022): Online platforms help shy students express themselves.  Lee (2021) believes that social media may harm conversation skills, while Chen (2022) argues that it helps shy students. Together, these studies suggest that…",
     q:[["Complete the synthesis","…the effect of social media may depend on the student: the same platform can reduce practice for confident speakers and provide it for shy ones."]]},
    {n:"A2",k:"open",i:"Write one synthesis paragraph (4–5 sentences) comparing two ideas about homework.  Source A (Williams, 2020): Homework helps students practice skills and build discipline.  Source B (Garcia, 2021): Too much homework increases stress and reduces family time.",
     q:[["Your synthesis paragraph","Williams (2020) argues that homework builds both skill and self-discipline through regular practice. Garcia (2021), in contrast, found that heavy homework loads raise stress levels and cut into family time. The two findings are not necessarily in conflict, since they may describe different quantities of the same activity. Taken together, these studies suggest that the question is not whether homework helps, but how much of it does. A moderate, well-designed load may capture the benefits Williams describes without the costs Garcia reports."]]},
    {n:"A3",k:"write",i:"Synthesis sentence frames. Complete each sentence with your own words.",
     q:[["Source A (Santos, 2022): uniforms reduce bullying. Source B (Oliveira, 2023): uniforms limit creativity.  →  Santos (2022) argues that uniforms reduce bullying, while Oliveira (2023) claims that…","…they suppress students' creativity and self-expression."],
        ["Together, these two sources suggest that…","…uniforms may trade one kind of freedom for another, and schools must decide which matters more at that age."],
        ["Source A (Lee, 2022): online learning is flexible. Source B (Martinez, 2023): online learning isolates students.  →  Lee (2022) believes online learning is flexible, whereas Martinez (2023) argues that…","…it reduces social interaction and leaves students feeling isolated."],
        ["Taken together, these studies indicate that…","…the convenience of online study comes at a social cost, which hybrid models may be able to limit."]]}
   ]},
  {L:"B",t:"Grammar review — Sets 1–6",
   learn:[
    {b:"table",h:["Set","Topic","Example"],r:[
      ["1","Articles (a/an/the)","I have an idea. The idea is good."],
      ["2","Word order (SVO)","She writes essays every day. (not: She every day writes…)"],
      ["3","Parallel structure","I like running, swimming, and biking."],
      ["4","Hedging (may, might, seems)","This solution may work."],
      ["5","Reduced relative clauses","The study published in 2020 is useful."],
      ["6","Gerunds vs. participles","Swimming is fun (gerund) vs. The swimming pool is cold (participle)."]]}
   ],
   ex:[
    {n:"B1",k:"pick",i:"Identify the grammar topic in each sentence.",
     o:[["A","A — Articles"],["B","B — Word order"],["C","C — Parallel structure"],["D","D — Hedging"],["E","E — Reduced relative clauses"],["F","F — Gerund"],["G","G — Participle"]],
     q:[["Walking every day is good for your health.","F"],
        ["The car manufactured in Germany is very fast.","E"],
        ["She needs a new phone. The phone she has is broken.","A"],
        ["This solution might reduce costs.","D"],
        ["He enjoys reading, writing, and to listen to music.","C"],
        ["The barking dog woke me up.","G"],
        ["They to the park go every Sunday.","B"]]},
    {n:"B2",k:"write",i:"Each sentence has one mistake from Sets 1–6. Write the corrected sentence.",
     q:[["She every day drinks coffee before class.","She drinks coffee every day before class."],
        ["I need a advice about my career path.","I need advice about my career path."],
        ["He enjoys to swim, run, and biking.","He enjoys swimming, running, and biking."],
        ["The solution will solve the problem for sure. (hedge it with may)","The solution may solve the problem."],
        ["The book which was written in 1990 is on the shelf. (reduce the clause)","The book written in 1990 is on the shelf."],
        ["Reading is my favorite hobby. (gerund or participle?)","Gerund — it is the subject of the sentence."],
        ["The crying baby kept everyone awake. (gerund or participle?)","Participle — it describes the noun baby."]]}
   ]},
  {L:"C",t:"Timed reading + synthesis report",
   learn:[
    {b:"p",x:"Text 1 — Park, 2023: Teenagers who use smartphones for more than 4 hours daily may have lower sleep quality. Park found that blue light from screens delays melatonin production, making it harder to fall asleep. However, teenagers who used \"night mode\" reported slightly better sleep."},
    {b:"p",x:"Text 2 — Jones, 2023: Smartphones may not be the main cause of sleep problems in teens. Jones argues that homework stress, early school start times, and social anxiety are equally important. In her study, teens with high stress slept poorly even when they did not use phones at night."}
   ],
   ex:[
    {n:"C1",k:"write",i:"Read both texts in 5 minutes, then answer without looking back.",
     q:[["What does Park (2023) say is the main problem?","Blue light from heavy smartphone use delays melatonin and makes it harder to fall asleep."],
        ["What does Jones (2023) say is different?","That phones are not the main cause — homework stress, early starts and social anxiety matter just as much."],
        ["What do both texts agree on?","That teenagers are sleeping badly, and that the cause is not a single simple factor."]]},
    {n:"C2",k:"open",i:"Write a short synthesis report (one paragraph, 6–8 sentences) using both sources.  Your report must include: a summary of Park (1–2 sentences) · a summary of Jones (1–2 sentences) · a comparison phrase (however, in contrast, similarly, on the other hand) · your conclusion (together, these sources suggest…) · citations for both authors · at least two different grammar items from the review.",
     q:[["Your synthesis report","Park (2023) reports that teenagers who spend more than four hours a day on smartphones may sleep badly, because blue light delays melatonin production. Teenagers using night mode, she found, slept slightly better. Jones (2023), in contrast, argues that phones are not the main culprit at all. In her study, homework stress, early school start times and social anxiety predicted poor sleep even among teenagers who kept their phones away at night. The two accounts are not incompatible, since screens may worsen a problem they did not create. Together, these sources suggest that advice limited to phones may be too narrow. Schools that start later, and set lighter evening homework, might do more for adolescent sleep than any night-mode setting."],
        ["Grammar items I used","Reduced relative clause (\"Teenagers using night mode\"); hedging (may, might); paired conjunction (neither… nor); verb + preposition (depend on)."]]}
   ]},
  {L:"D",t:"Mini Project: The \"Synthesis Showdown\" Debate",learn:[],
   ex:[{n:"D1",k:"project",i:"Work in pairs or small groups. Your teacher will give you two short \"sources\" with opposite opinions on a silly topic. Your job: write a synthesis paragraph (4–5 sentences) comparing the two sources and reaching a conclusion. Then read your synthesis aloud. The class votes on the funniest or most creative conclusion.",x:""}]}
 ]},

{n:10,t:"Double Trouble: Paired Conjunctions & Sentence Combining",s:"both…and · not only…but also · either…or · neither…nor",grp:"Grammar core",tags:"paired conjunctions correlative both and not only but also either or neither nor sentence combining",
 sec:[
  {L:"A",t:"Paired conjunctions",
   learn:[
    {b:"p",x:"Paired conjunctions work in two parts. They connect similar ideas or choices."},
    {b:"table",h:["Conjunction","Meaning","Example"],r:[
      ["both… and","two things together","She speaks both Spanish and French."],
      ["not only… but also","adds emphasis (the second idea is stronger)","He is not only smart but also very kind."],
      ["either… or","a choice between two options","You can have either coffee or tea."],
      ["neither… nor","not the first, not the second (negative)","She likes neither cold weather nor hot weather."]]},
    {b:"note",x:"The two parts must be parallel (the same grammatical form). ✓ She wants both to travel and to learn.  ✗ She wants both to travel and learning."}
   ],
   ex:[
    {n:"A1",k:"gap",i:"Complete each sentence with the correct paired conjunction: both…and · not only…but also · either…or · neither…nor",
     q:[["___ the teacher ___ the students were happy with the test results — everyone was pleased.",["both","and"]],
        ["You can choose ___ the red shirt ___ the blue one.",["either","or"]],
        ["He is ___ a talented musician ___ a great writer.",["not only","but also"]],
        ["She likes ___ spicy food ___ sweet food. She only likes salty snacks.",["neither","nor"]]]},
    {n:"A2",k:"open",i:"Complete each sentence with your own idea. Keep the structure parallel.",
     q:[["I enjoy both … and …","I enjoy both cooking and eating what other people cook."],
        ["This class is not only useful but also …","…surprisingly funny."],
        ["For the project, we can either … or …","…film an interview or build a short website."],
        ["Neither my friend nor I …","…had read the instructions before we started."]]}
   ]},
  {L:"B",t:"Sentence combining drills",
   learn:[
    {b:"p",x:"Combining short sentences makes your writing smoother and more academic."},
    {b:"eg",x:["She is smart. She is hardworking. → She is both smart and hardworking.",
              "He didn’t call. He didn’t text. → He neither called nor texted.",
              "The solution is cheap. It is also effective. → The solution is not only cheap but also effective."]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Combine each pair using the conjunction in parentheses.",
     q:[["The movie was funny. The movie was exciting. (both…and)","The movie was both funny and exciting."],
        ["She doesn’t eat meat. She doesn’t eat fish. (neither…nor)","She eats neither meat nor fish."],
        ["We can leave now. We can wait for Maria. (either…or)","We can either leave now or wait for Maria."],
        ["He lost his job. He also lost his apartment. (not only…but also)","He lost not only his job but also his apartment."]]}
   ]},
  {L:"C",t:"Write sentences using paired conjunctions",
   learn:[],
   ex:[
    {n:"C1",k:"study",i:"Study the models.",h:["Type","Model sentence"],r:[
      ["both… and","Both the introduction and the conclusion need revision."],
      ["not only… but also","The new policy will not only save money but also reduce waste."],
      ["either… or","You can either submit your draft online or bring a printed copy."],
      ["neither… nor","Neither the first source nor the second source provides enough evidence."]]},
    {n:"C2",k:"open",i:"Write four sentences of your own about one of these topics: social media and teenagers · climate change solutions · school rules.",
     q:[["both… and",""],["not only… but also",""],["either… or",""],["neither… nor",""]]}
   ]},
  {L:"D",t:"Mini Project: The \"Sentence Mash-Up\" Game",learn:[],
   ex:[{n:"D1",k:"project",i:"Play with a partner or small group. Your teacher will give you short sentence pairs. Your team must combine each pair into one smooth sentence using a paired conjunction (both…and, not only…but also, either…or, neither…nor). The first team to combine all the sentences correctly wins.",x:""}]}
 ]}

{n:11,t:"Flip It! Mastering Inversions for Formal Writing",s:"General inversions — formal and academic style",grp:"Grammar core",tags:"inversion never only then not until rarely seldom here there formal academic",
 sec:[
  {L:"A",t:"General inversions — what are they?",
   learn:[
    {b:"p",x:"In normal English, the subject comes before the verb. In an inversion, the verb (or auxiliary) comes before the subject. This makes your writing more formal, dramatic or academic."},
    {b:"eg",x:["Normal: I have never seen such a beautiful sunset.  →  Inverted: Never have I seen such a beautiful sunset.",
              "Normal: She only then understood the problem.  →  Inverted: Only then did she understand the problem."]},
    {b:"table",h:["Pattern","Example"],r:[
      ["Never + auxiliary + subject","Never have I felt so proud."],
      ["Only then + did + subject","Only then did she realize her mistake."],
      ["Not until + clause + auxiliary + subject","Not until I read the book did I understand the topic."],
      ["Here / There + verb + subject","Here is the book you requested. / There goes the bus."],
      ["Rarely / Seldom + auxiliary + subject","Rarely do we see such dedication."],
      ["Not only… but also (with inversion)","Not only did he arrive late, but he also forgot his notes."]]},
    {b:"trick",x:"If the normal sentence has an auxiliary (have, do, be, can, will), move it before the subject. If it has only a main verb, add did / does / do: He rarely eats meat → Rarely does he eat meat."}
   ],
   ex:[
    {n:"A1",k:"match",i:"Match each normal sentence to its inverted version.",
     o:[["A","Only then did she hear the news."],["B","Here are the keys you lost."],["C","Rarely do we see such talent."],["D","Never have I been so embarrassed."]],
     q:[["I have never been so embarrassed.","D"],
        ["She only then heard the news.","A"],
        ["The keys you lost are here.","B"],
        ["We rarely see such talent.","C"]]},
    {n:"A2",k:"open",i:"Complete each inverted sentence with your own idea.",
     q:[["Never have I …","Never have I been so relieved to see a bus."],
        ["Only then did she …","Only then did she understand why the file kept crashing."],
        ["Not until … will I finish this project","Not until the data arrives will I finish this project."],
        ["Here is / Here are the …","Here are the three reasons the plan failed."],
        ["Rarely does my teacher …","Rarely does my teacher hand back work without a comment."]]}
   ]},
  {L:"B",t:"Rewrite normal sentences as inversions",
   learn:[],
   ex:[
    {n:"B1",k:"write",i:"Rewrite each sentence as an inversion, using the word in parentheses.",
     q:[["I have never heard such a strange story. (Never)","Never have I heard such a strange story."],
        ["She only then understood the teacher’s point. (Only then)","Only then did she understand the teacher’s point."],
        ["We rarely see such honesty in politics. (Rarely)","Rarely do we see such honesty in politics."],
        ["He not only failed the test, but he also blamed the teacher. (Not only)","Not only did he fail the test, but he also blamed the teacher."],
        ["I realized the truth not until I read the report. (Not until)","Not until I read the report did I realize the truth."]]},
    {n:"B2",k:"open",i:"Write two normal sentences of your own. Then invert them.",
     q:[["Normal sentence 1",""],["Inverted 1",""],["Normal sentence 2",""],["Inverted 2",""]]}
   ]},
  {L:"C",t:"Write 6 inverted sentences (formal / academic style)",
   learn:[],
   ex:[
    {n:"C1",k:"study",i:"Study the models.",h:["Pattern","Model (academic topic)"],r:[
      ["Never…","Never have researchers found a single solution to climate change."],
      ["Only then…","Only then did the government realize the severity of the crisis."],
      ["Not until…","Not until students learn time management will they reduce their stress."],
      ["Here / There…","Here are the three main causes of online learning fatigue."],
      ["Rarely / Seldom…","Seldom does a single policy address both economic and environmental concerns."],
      ["Not only… but also","Not only does exercise improve physical health, but it also boosts mental well-being."]]},
    {n:"C2",k:"open",i:"Brainstorm topics with a partner and write six inverted sentences of your own.",
     q:[["1 (Never…)",""],["2 (Only then…)",""],["3 (Not until…)",""],["4 (Here / There…)",""],["5 (Rarely / Seldom…)",""],["6 (Not only… but also)",""]]}
   ]},
  {L:"D",t:"Mini Project: The \"Inversion Intrigue\" Mystery Game",learn:[],
   ex:[{n:"D1",k:"project",i:"You are a detective writing clues for a mystery. Each clue must be written as an inverted sentence. Step 1: choose a secret person, place or object related to school or daily life. Step 2: write 3 inverted clues using different inversion patterns. Step 3: read your clues to a partner — they guess the answer. Step 4: switch roles.",
        x:"Challenge: write a short paragraph (6–8 sentences) for a formal essay. Use at least 3 different inversions and underline them."}]}

{n:12,t:"Neither Here nor There: Mastering Either & Neither",s:"Either and neither — determiner, pronoun, connector",grp:"Grammar core",tags:"either neither nor determiner pronoun connector me neither either way",
 sec:[
  {L:"A",t:"Neither / Either — three different roles",
   learn:[
    {b:"p",x:"Neither = not one, not the other (negative). Either = one or the other (a choice; also used in negatives)."},
    {b:"table",h:["Role","Explanation","With neither","With either"],r:[
      ["Determiner","Describes a noun (comes before it)","Neither solution is perfect.","Either option works for me."],
      ["Pronoun","Replaces the noun (stands alone)","I asked both students. Neither knew the answer.","Either is fine."],
      ["Connector","Joins two negative or positive choices","She speaks neither Spanish nor French.","You can have either coffee or tea."]]},
    {b:"trick",x:"Neither is always singular: neither student is… / neither of them is… Either can be singular (either option is fine), though in conversation people sometimes use the plural (either of them are fine — informal)."}
   ],
   ex:[
    {n:"A1",k:"pick",i:"What role does neither or either play in each sentence?",
     o:[["D","D — determiner"],["P","P — pronoun"],["C","C — connector (with nor/or)"]],
     q:[["Neither answer is correct.","D"],
        ["I invited two friends, but neither came.","P"],
        ["She eats neither meat nor fish.","C"],
        ["Either day works for the meeting.","D"],
        ["You can have either soup or salad.","C"],
        ["Two students applied. Neither had the required score.","P"]]},
    {n:"A2",k:"gap",i:"Complete each sentence with neither or either.",
     q:[["I have two brothers. ___ of them lives near me.",["neither"]],
        ["You can take ___ bus. They both go downtown.",["either"]],
        ["___ the blue pen nor the black pen has ink.",["neither"]],
        ["She doesn’t like ___ coffee or tea. She only drinks water.",["either"]],
        ["A: \"Which movie do you want to watch?\"  B: \"___ is fine. You choose.\"",["either"]],
        ["___ of the two solutions seems feasible. We need a third option.",["neither"]]]}
   ]},
  {L:"B",t:"Fill-in-the-blank + dialogue practice",
   learn:[
    {b:"p",x:"In conversation, neither and either are very common — especially in short responses."},
    {b:"table",h:["Response","Meaning"],r:[
      ["Me neither.","I also don’t / didn’t / haven’t (agreeing with a negative)"],
      ["I don’t either.","The same as \"me neither\" — slightly more formal"],
      ["Either way.","Both options are acceptable"],
      ["Neither do I.","An inverted response (formal)"]]},
    {b:"eg",x:["A: I don’t like spicy food.  B: Me neither. / Neither do I. / I don’t either.",
              "A: Should we go left or right?  B: Either way. You decide."]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Write a short response to each line using neither or either.",
     q:[["A: I haven’t finished the reading.","Me neither. / Neither have I."],
        ["A: Do you want the window seat or the aisle?","Either is fine, thanks."],
        ["A: I can’t stand long meetings.","Neither can I."],
        ["A: Should I email her or call her?","Either way works."],
        ["A: I didn’t understand that last question.","I didn’t either."]]},
    {n:"B2",k:"open",i:"Write a short dialogue (6–8 lines) between two people who agree about everything they dislike. Use neither or either at least four times, in at least two different roles.",
     q:[["Your dialogue",""]]}
   ]},
  {L:"C",t:"Mini Project: The \"Neither Nor\" Agreement Chain",learn:[],
   ex:[{n:"C1",k:"project",i:"Stand in a circle. The first student says something they don’t do (\"I don’t drink coffee\"). The next must agree using a different structure (\"Neither do I\"), then add their own negative statement. Nobody may reuse a response form that has already been used in the round — me neither, neither do I, I don’t either, nor do I. Anyone who repeats a form, or breaks the grammar, sits down.",x:""}]}
 ]},

{n:13,t:"Who’s Who? Pronoun Agreement & Clarity",s:"Pronoun correspondence, agreement traps and ambiguity",grp:"Grammar core",tags:"pronoun agreement antecedent ambiguous collective nouns everyone singular they clarity",
 sec:[
  {L:"A",t:"Pronoun correspondence — what is it?",
   learn:[
    {b:"p",x:"A pronoun (he, she, it, they, we, you, them, their…) must agree with the noun it replaces — its antecedent."},
    {b:"table",h:["Rule","Correct","Incorrect"],r:[
      ["Number (singular → singular, plural → plural)","The student forgot his book.","The student forgot their book. (traditional rule)"],
      ["Gender","Maria said she was tired.","Maria said he was tired."],
      ["Clarity (one clear noun — no confusion)","When John called Peter, John hung up.","When John called Peter, he hung up. (who?)"]]},
    {b:"note",x:"Modern usage: singular they is now accepted in modern English — Every student should bring their own laptop is acceptable."}
   ],
   ex:[
    {n:"A1",k:"mcq",i:"Which version is correct?",
     q:[["The committee of senior researchers finally released ___ findings.",["its","their"],0,"Committee is singular, even with a long phrase between it and the pronoun."],
        ["Maria told her sister that ___ had passed.",["she","they"],0,"The antecedent is singular and feminine — though the sentence is still ambiguous about who passed."],
        ["The collection of rare stamps lost ___ value over time.",["its","their"],0,"The subject is collection (singular), not stamps."]]},
    {n:"A2",k:"write",i:"Each sentence has a pronoun agreement error. Write the corrected sentence.",
     q:[["The group of students decided to present their project on Friday, but it was not ready.","The group of students decided to present its project on Friday, but the project was not ready."],
        ["Every one of the players must bring their own equipment to practice.","Every one of the players must bring his or her own equipment to practice."],
        ["Neither the director nor the actors was willing to change his schedule.","Neither the director nor the actors were willing to change their schedules."],
        ["The collection of ancient coins, which had been hidden for centuries, lost their value after the market crashed.","The collection of ancient coins, which had been hidden for centuries, lost its value after the market crashed."],
        ["Each of the girls brought their own phone to the party.","Each of the girls brought her own phone to the party."]]}
   ]},
  {L:"B",t:"Pronoun agreement in long, complex sentences",
   learn:[
    {b:"p",x:"In proficiency tests you will see long sentences with a pronoun error. The error is often a mismatch between the pronoun and its noun — even when the two are far apart."},
    {b:"table",h:["Trap","Example","Correction"],r:[
      ["Long distance between noun and pronoun","The collection of rare stamps, which had been passed down for generations, lost their value over time.","lost its value (collection = singular)"],
      ["Collective nouns (team, committee, family, group)","The team celebrated their victory.","The team celebrated its victory. (American English)"],
      ["Indefinite pronouns (everyone, each, neither)","Everyone brought their own lunch. (acceptable modern)","Traditional: Everyone brought his or her own lunch."],

{n:14,t:"Pick the Right Partner: Verb + Preposition Combinations",s:"Verb + preposition combinations for academic writing",grp:"Grammar core",tags:"verb preposition depend on consist of refer to lead to result in result from contribute to collocation",
 sec:[
  {L:"A",t:"Verb + preposition — what are they?",
   learn:[
    {b:"p",x:"In English, many verbs are followed by a specific preposition. Using the wrong one is a common error — even at C1 level."},
    {b:"eg",x:["✗ The solution depends of many factors.  →  ✓ The solution depends on many factors.",
              "✗ This chapter consists from three parts.  →  ✓ This chapter consists of three parts."]},
    {b:"note",x:"Why learn them? Academic writing requires precision · exams (IELTS, TOEFL, Cambridge) test these combinations · native speakers notice the errors immediately."},
    {b:"table",h:["Verb + preposition","Meaning","Example"],r:[
      ["depend on","be determined by","The outcome depends on the quality of the data."],
      ["consist of","be made of / include","The report consists of three sections."],
      ["refer to","mention or point to","In your essay, refer to at least two sources."],
      ["lead to","cause","Poor sleep can lead to health problems."],
      ["result in","cause (usually negative or significant)","The accident resulted in serious injuries."],
      ["result from","be caused by","The delay resulted from a technical issue."],
      ["contribute to","help cause or add to","Exercise contributes to better mental health."],
      ["specialize in","focus on a specific area","She specializes in environmental law."],
      ["approve of","have a positive opinion of","Most parents approve of the new policy."],
      ["insist on","demand strongly","The teacher insists on proper citations."],
      ["belong to","be a member of","Which category does this belong to?"],
      ["care about","be interested in / concerned with","Researchers care about data accuracy."]]}
   ],
   ex:[
    {n:"A1",k:"match",i:"Match each verb with its preposition.",
     o:[["on","on"],["of","of"],["to","to"],["in","in"],["from","from"],["about","about"]],
     q:[["depend","on"],["consist","of"],["refer","to"],["lead","to"],["result (cause)","in"],
        ["result (be caused by)","from"],["specialize","in"],["care","about"],["approve","of"],["insist","on"]]},
    {n:"A2",k:"gap",i:"Complete each sentence with the correct preposition.",

        ["In your conclusion, you should refer ___ the main arguments you presented earlier.",["to"]],

        ["She decided to specialize ___ renewable energy engineering.",["in"]],

  {L:"B",t:"result in vs. result from — the classic trap",

{n:16,t:"Grammar in the Wild: Fixing Real-World English",s:"Grammar in context — labelling structures in an academic paragraph",grp:"Review",tags:"grammar in context academic paragraph label structures review writing",

    {b:"p",x:"Read the paragraph below twice. First for meaning. Second, to notice the grammar."},
    {b:"eg",x:["Not only does online learning offer flexibility, but it also presents significant challenges. Both students and teachers have reported feelings of isolation. Neither a perfect virtual platform nor an ideal schedule can completely replace face-to-face interaction. Never have researchers found a single solution that works for every learner. Only then, after examining multiple studies, did we understand the complexity of the issue. The success of online education depends on several factors, including student motivation, access to technology, and teacher training. A well-structured course consists of clear objectives, regular feedback, and opportunities for collaboration. Everyone in the educational community should carefully consider their own needs before choosing a mode of instruction. Rarely does a one-size-fits-all approach lead to positive outcomes for all students."]},

{n:18,t:"Read Fast, Write Smart: Timed Reading & Paraphrasing",s:"Timed reading + paraphrasing (speed + accuracy)",grp:"Skills & writing",tags:"timed reading paraphrasing speed accuracy ielts toefl memory",

{n:22,t:"Bounce Back: The Art of Resilience Storytelling",s:"Life journal — resilience storytelling",grp:"Skills & writing",tags:"resilience storytelling challenge response learning interview personal story speaking",

    {b:"note",x:"Why tell resilience stories? Job interviews (\"Tell me about a time you faced a challenge\") · university applications and personal statements · leadership, to inspire others · self-reflection, to recognize your own growth. A good resilience story is not about being perfect. It is about being honest and showing growth."},
    {b:"p",x:"Story: When I first moved to this country, I could not understand my classmates. Everyone spoke so fast, and I felt lost in every conversation. I wanted to give up and stay silent. Instead, I started listening to podcasts every day for 20 minutes. I also asked my teacher for extra speaking practice. After six months, I could follow conversations easily. Now, I am not afraid to ask questions when I don’t understand something. I learned that feeling lost is temporary — but only if you take action."}

/* ══════════ STORAGE ══════════ */
var KEY='adv3-v1';
var ST={ans:{},done:{}};
function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);ST.ans=p.ans||{};ST.done=p.done||{};}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
load();
function aget(k){return ST.ans[k]||'';}
function aset(k,v){if(v===''){delete ST.ans[k];}else{ST.ans[k]=v;}save();}
function mark(k,v){if(v){ST.done[k]=1;}else{delete ST.done[k];}save();}

/* ══════════ HELPERS ══════════ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[\u2018\u2019\u02bc]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/[\u2013\u2014\u2212]/g,'-')
    .replace(/[.,;:!?"()\[\]]/g,'').replace(/'/g,'')
    .replace(/\s+/g,' ').trim();
}
function hit(val,key){
  var alts=String(key).split('|');
  var v=norm(val);
  for(var i=0;i<alts.length;i++){
    var a=norm(alts[i]);
    if(a===v) return true;
    if(a==='-'&&(v===''||v==='-'||v==='zero'||v==='no article')) return true;
    if(a===''&&v==='') return true;
  }
  return false;
}
function loose(val,key){
  if(hit(val,key)) return true;
  var v=norm(val).replace(/^(the|a|an)\s+/,''), k=norm(String(key).split('|')[0]).replace(/^(the|a|an)\s+/,'');
  if(!v) return false;
  if(v===k) return true;
  /* accept if the answer contains the model's distinctive core, e.g. "no commas" */
  if(k.length<18&&v.indexOf(k)>-1) return true;
  return false;
}
function exKey(set,ex){return 's'+set+'.'+ex;}
function itKey(set,ex,i,g){return 's'+set+'.'+ex+'.'+i+(g==null?'':'.'+g);}

function exCount(s){var c=0;s.sec.forEach(function(x){c+=x.ex.length;});return c;}
function exDone(s){var c=0;s.sec.forEach(function(x){x.ex.forEach(function(e){if(ST.done[exKey(s.n,e.n)])c++;});});return c;}

/* ══════════ EXERCISE RENDERERS ══════════ */
function gapRow(set,e,i,q){
  var parts=String(q[0]).split('___'), h='<div class="q">';
  for(var g=0;g<parts.length;g++){
    h+=esc(parts[g]);
    if(g<parts.length-1){
      var k=itKey(set,e.n,i,g);
      h+='<input class="txt gapi" data-k="'+k+'" data-a="'+esc(q[1][g]||'')+'" value="'+esc(aget(k))+'" autocomplete="off" spellcheck="false">';
    }
  }
  return h+'</div><div class="why"></div>';
}
function nextBtn(n){return '<button class="btn ghost" data-act="next">'+nextTxt(n)+'</button>';}
function nextTxt(left){return left?'Reveal next answer ('+left+' left)':'All answers shown';}
/* items that have something to reveal (open items without a model answer are skipped) */
function revealables(card){
  var kind=card.getAttribute('data-kind');
  return Array.prototype.filter.call(card.querySelectorAll('.item'),function(it){
    return (kind==='open')?!!it.querySelector('.model'):true;
  });
}
function paintNext(card){
  var b=card.querySelector('[data-act="next"]');
  var all=revealables(card), left=all.filter(function(it){return !it.classList.contains('rv');}).length;
  if(b){b.textContent=nextTxt(left); b.disabled=!left;}
  var sp=card.querySelector('.score');
  if(sp&&left<all.length&&card.getAttribute('data-kind')!=='open'){sp.textContent=(all.length-left)+' / '+all.length+' shown';sp.className='score';}
}
function revealItem(card,it){
  var kind=card.getAttribute('data-kind');
  it.classList.add('rv');
  if(kind==='gap'){
    it.querySelectorAll('input.gapi').forEach(function(inp){
      if(!hit(inp.value,inp.getAttribute('data-a'))){inp.value=String(inp.getAttribute('data-a')).split('|')[0].replace(/^-$/,'–');aset(inp.getAttribute('data-k'),inp.value);}
      inp.classList.remove('no');inp.classList.add('ok');
    });
  } else if(kind==='pick'||kind==='mcq'){
    var box=it.querySelector('.opts'), ans=box.getAttribute('data-a');
    box.querySelectorAll('.opt').forEach(function(b){
      b.classList.remove('good','bad','reveal');
      var right=b.getAttribute('data-v')===String(ans);
      if(b.classList.contains('sel'))b.classList.add(right?'good':'bad');
      else if(right)b.classList.add('reveal');
    });
    var why=it.querySelector('.why');
    if(why){var t=why.getAttribute('data-txt');if(t){why.innerHTML='<b>Why:</b> '+esc(t);why.classList.add('show');}}
  } else if(kind==='match'){
    var sel=it.querySelector('select.txt');
    if(sel.value!==sel.getAttribute('data-a')){sel.value=sel.getAttribute('data-a');aset(sel.getAttribute('data-k'),sel.value);}
    sel.classList.remove('no');sel.classList.add('ok');
  } else {
    var m=it.querySelector('.model');if(m)m.classList.add('show');
  }
  it.classList.remove('rv-flash');void it.offsetWidth;it.classList.add('rv-flash');
}
function exHTML(set,e){
  var done=!!ST.done[exKey(set,e.n)];
  var h='<section class="ex'+(done?' done':'')+'" id="ex-'+set+'-'+e.n+'" data-ex="'+e.n+'" data-set="'+set+'" data-kind="'+e.k+'">'+
        '<div class="exhead"><span class="exno">'+esc(e.n)+'</span><span class="exi">'+esc(e.i)+'</span></div>';

  if(e.k==='study'){
    h+='<div class="tblwrap" style="margin-top:.9rem"><table><thead><tr>';
    e.h.forEach(function(c){h+='<th>'+esc(c)+'</th>';});
    h+='</tr></thead><tbody>';
    e.r.forEach(function(r){h+='<tr>';r.forEach(function(c){h+='<td>'+esc(c)+'</td>';});h+='</tr>';});
    h+='</tbody></table></div>';
    h+='<div class="row"><button class="btn ghost" data-act="tick">'+(done?'Done ✓':'Mark as read')+'</button></div></section>';
    return h;
  }
  if(e.k==='project'){
    var k=itKey(set,e.n,0);
    h+='<div class="project">'+esc(e.i)+(e.x?'<div class="extra">'+esc(e.x)+'</div>':'')+'</div>'+
       '<textarea class="txt" rows="5" data-k="'+k+'" placeholder="Draft it here — your text is saved on this device.">'+esc(aget(k))+'</textarea><div class="saved"></div>'+
       '<div class="row"><button class="btn ghost" data-act="tick">'+(done?'Done ✓':'Mark as done')+'</button></div></section>';
    return h;
  }

  h+='<div class="items">';
  e.q.forEach(function(q,i){
    var k=itKey(set,e.n,i);
    h+='<div class="item" data-i="'+i+'"><span class="idx">'+(i+1)+'.</span><div class="body">';
    if(e.k==='gap'){ h+=gapRow(set,e,i,q); }
    else if(e.k==='pick'){
      h+='<div class="q">'+esc(q[0])+'</div><div class="opts" data-a="'+esc(q[1])+'">';
      e.o.forEach(function(o){
        h+='<button class="opt'+(aget(k)===o[0]?' sel':'')+'" data-k="'+k+'" data-v="'+esc(o[0])+'">'+esc(o[1])+'</button>';
      });
      h+='</div><div class="why"></div>';
    }
    else if(e.k==='mcq'){
      h+='<div class="q">'+esc(q[0])+'</div><div class="opts" data-a="'+q[2]+'">';
      q[1].forEach(function(o,j){
        h+='<button class="opt'+(aget(k)===String(j)?' sel':'')+'" data-k="'+k+'" data-v="'+j+'">'+esc(o)+'</button>';
      });
      h+='</div><div class="why" data-txt="'+esc(q[3]||'')+'"></div>';
    }
    else if(e.k==='match'){
      h+='<div class="q">'+esc(q[0])+'</div><select class="txt" data-k="'+k+'" data-a="'+esc(q[1])+'"><option value="">— choose —</option>';
      e.o.forEach(function(o){
        h+='<option value="'+esc(o[0])+'"'+(aget(k)===o[0]?' selected':'')+'>'+esc(o[0])+'. '+esc(o[1])+'</option>';
      });
      h+='</select><div class="why"></div>';
    }
    else { /* write | open */
      h+='<div class="q">'+esc(q[0])+'</div>'+
         '<textarea class="txt" rows="'+(e.k==='open'?3:2)+'" data-k="'+k+'" data-a="'+esc(q[1]||'')+'" placeholder="Your answer…">'+esc(aget(k))+'</textarea>'+
         '<div class="saved"></div>'+
         (q[1]?'<div class="model"><b>Model answer</b>'+esc(q[1])+'</div>':'');
    }
    h+='</div>'+((e.k!=='open'||(q[1]&&String(q[1]).trim()))?'<button class="rvbtn" data-act="one" aria-label="Show answer '+(i+1)+'">Show</button>':'')+'</div>';
  });
  h+='</div><div class="row">';
  h=h.replace('<div class="items">', e.q.length<2?'<div class="items one">':'<div class="items">');
  if(e.k==='gap'||e.k==='pick'||e.k==='mcq'||e.k==='match') h+='<button class="btn primary" data-act="check">Check answers</button>';
  else if(e.k==='write') h+='<button class="btn primary" data-act="check">Check answers</button>';
  else {
    h+='<button class="btn primary" data-act="tick">'+(done?'Done ✓':'Mark as done')+'</button>';
  }
  h+='<button class="btn ghost" data-act="clear">Clear</button><span class="score"></span></div></section>';
  return h;
}
