<style>
:root{
 --paper:#f3efe7; --card:#fbf9f4; --raise:#ffffff;
 --ink:#22302a; --ink-soft:#5d6b63; --ink-faint:#8a958d;
 --line:#e5ddd0; --line-soft:#eee7db;
 --brand:#1f6f5c; --brand-soft:#e4efe9; --brand-deep:#144a3d;
 --coral:#e2664a; --coral-soft:#fbe4dc;
 --gold:#cf9526; --gold-soft:#f6ecd4;
 --correct:#1f7a55; --correct-soft:#e2efe6;
 --wrong:#cf4a37; --wrong-soft:#f8e2dd;
 --r:16px; --r-sm:10px; --r-xs:7px;
}
:root[data-theme="dark"]{
 --paper:#121815; --card:#1a221e; --raise:#212b26;
 --ink:#eef2ec; --ink-soft:#a7b3ac; --ink-faint:#788079;
 --line:#2a352f; --line-soft:#232d28;
 --brand:#4bb795; --brand-soft:#1a2a24; --brand-deep:#78d3b6;
 --coral:#f0805f; --coral-soft:#2c211d;
 --gold:#e0b24d; --gold-soft:#2a2417;
 --correct:#4bb488; --correct-soft:#18271f;
 --wrong:#e46a54; --wrong-soft:#2c1d19;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;}
em{font-family:'Newsreader',Georgia,serif;font-style:italic;}

/* ── TOP BAR ── */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:.9rem;height:60px;padding:0 1.1rem;
 background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.burger{display:inline-flex;align-items:center;gap:.45rem;background:none;border:1px solid var(--line);border-radius:100px;height:36px;padding:0 .85rem;font:inherit;font-size:.84rem;font-weight:600;color:var(--ink-soft);cursor:pointer;flex:none;}
.burger:hover{border-color:var(--brand);color:var(--brand);}
.burger b{font-weight:700;}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.02rem;letter-spacing:-.02em;color:var(--brand);text-decoration:none;white-space:nowrap;}
.brand span{color:var(--coral);}
.brand small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
.searchwrap{position:relative;flex:1;max-width:420px;margin-left:auto;}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:.5rem 2.2rem .5rem 2.2rem;font:inherit;font-size:.87rem;color:var(--ink);}
.search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.searchwrap::before{content:'⌕';position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:1.05rem;}
.iconbtn{background:none;border:1px solid var(--line);border-radius:100px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);font-size:.95rem;flex:none;}
.iconbtn:hover{border-color:var(--brand);color:var(--brand);}
.iconbtn[disabled]{opacity:.32;cursor:default;}
.iconbtn[disabled]:hover{border-color:var(--line);color:var(--ink-soft);}
.setnav{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.84rem;color:var(--ink-soft);white-space:nowrap;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;max-width:36vw;}
.setnav b{color:var(--coral);font-weight:800;margin-right:.4rem;}

/* ── LAYOUT ── */
.wrap{display:block;}
.side{position:fixed;top:60px;left:0;z-index:56;width:312px;max-width:86vw;height:calc(100vh - 60px);overflow-y:auto;
 border-right:1px solid var(--line);padding:1.1rem .8rem 4rem;background:var(--paper);
 transform:translateX(-103%);transition:transform .24s ease;box-shadow:0 14px 44px rgba(0,0,0,.18);}
.side.open{transform:none;}
.scrim{display:none;}
.scrim.on{display:block;position:fixed;inset:60px 0 0;background:rgba(0,0,0,.34);z-index:54;}
.side h4{font-family:'DM Sans',sans-serif;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:1.3rem .55rem .5rem;font-weight:700;}
.side h4:first-child{margin-top:.2rem;}
.slink{display:flex;gap:.6rem;align-items:baseline;width:100%;text-align:left;background:none;border:none;border-radius:var(--r-sm);padding:.5rem .55rem;cursor:pointer;color:var(--ink-soft);font:inherit;font-size:.84rem;line-height:1.35;}
.slink:hover{background:var(--card);color:var(--ink);}
.slink.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600;}
.slink .num{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.72rem;color:var(--ink-faint);min-width:1.35rem;flex:none;}
.slink.on .num{color:var(--brand);}
.slink .ttl{flex:1;}
.slink .pip{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;align-self:center;}
.slink .pip.part{background:var(--gold);}
.slink .pip.full{background:var(--brand);}
.slink.hide{display:none;}
.side h4.hide{display:none;}

.main{padding:2rem clamp(1.1rem,3.5vw,3rem) 6rem;max-width:1400px;margin:0 auto;}

/* ── SET HEADER ── */
.shead{border-bottom:1px solid var(--line);padding-bottom:1.4rem;margin-bottom:1.8rem;}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.68rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--coral);background:var(--coral-soft);border-radius:100px;padding:.28rem .7rem;}
.shead h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.08;letter-spacing:-.025em;margin:.8rem 0 .4rem;}
.shead .sub{color:var(--ink-soft);font-size:1rem;max-width:70ch;}
.bar{height:6px;border-radius:100px;background:var(--line-soft);margin-top:1.1rem;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));width:0;transition:width .4s;}
.barlabel{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-faint);margin-top:.45rem;}

/* ── SECTION ── */
.sec{margin:2.4rem 0;}
.sec > h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.22rem;letter-spacing:-.01em;display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;}
.sec > h2 .tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--brand-soft);border-radius:var(--r-xs);padding:.2rem .5rem;flex:none;}

/* learn blocks */
.learn{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem 1.4rem;margin-bottom:1.2rem;}
.learn > * + *{margin-top:.95rem;}
.learn p{font-size:.95rem;color:var(--ink-soft);max-width:82ch;}
.formula{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;text-align:center;background:var(--raise);border:1px dashed var(--brand);border-radius:var(--r-sm);padding:.85rem 1rem;color:var(--brand-deep);letter-spacing:.01em;font-size:.95rem;}
.trick{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:var(--r-xs);padding:.75rem .95rem;font-size:.9rem;color:var(--ink);}
.note{background:var(--coral-soft);border-left:3px solid var(--coral);border-radius:var(--r-xs);padding:.75rem .95rem;font-size:.9rem;}
.egs{display:flex;flex-direction:column;gap:.5rem;}
.egs{max-width:92ch;}
.egs div{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:1.02rem;line-height:1.5;padding-left:1.1rem;position:relative;color:var(--ink);}
.egs div::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold);}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:420px;}
th{text-align:left;font-weight:700;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:.5rem .65rem;border-bottom:1px solid var(--line);}
td{padding:.55rem .65rem;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-soft);}
td:first-child{color:var(--ink);font-weight:500;}
tr:last-child td{border-bottom:none;}

/* ── EXERCISE CARD ── */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem 1.4rem;margin-bottom:1.1rem;}
.ex.done{border-color:var(--brand);}
.exhead{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.35rem;}
.exno{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.78rem;color:var(--raise);background:var(--brand);border-radius:var(--r-xs);padding:.22rem .5rem;flex:none;letter-spacing:.03em;}
.ex.done .exno::after{content:' ✓';}
.exi{font-size:.9rem;color:var(--ink-soft);flex:1;}
.items{margin-top:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:.9rem 2.2rem;align-items:start;}
.items.one{grid-template-columns:minmax(0,1fr);}
.item{display:flex;gap:.7rem;align-items:flex-start;}
.idx{font-family:'Bricolage Grotesque',sans-serif;font-size:.78rem;font-weight:700;color:var(--ink-faint);min-width:1.3rem;padding-top:.35rem;flex:none;}
.body{flex:1;min-width:0;}
.q{font-size:.95rem;line-height:1.75;}
.q em{color:var(--ink);}

input.txt,textarea.txt{font:inherit;font-size:.92rem;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-xs);padding:.35rem .55rem;}
input.txt{min-width:8rem;width:9.5rem;}
input.gapi{width:8.5rem;text-align:center;border-bottom:2px solid var(--brand);border-radius:var(--r-xs) var(--r-xs) 0 0;}
input.txt:focus,textarea.txt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.wide{width:100%;display:block;margin-top:.4rem;}
textarea.txt{width:100%;display:block;margin-top:.45rem;resize:vertical;min-height:2.6rem;line-height:1.6;}
.ok{border-color:var(--correct)!important;background:var(--correct-soft)!important;}
.no{border-color:var(--wrong)!important;background:var(--wrong-soft)!important;}

.opts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem;}
.opt{font:inherit;font-size:.83rem;background:var(--raise);border:1px solid var(--line);border-radius:100px;padding:.28rem .8rem;cursor:pointer;color:var(--ink-soft);transition:.15s;}
.opt:hover{border-color:var(--brand);color:var(--brand);}
.opt.sel{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.opt.sel.good{background:var(--correct);border-color:var(--correct);}
.opt.sel.bad{background:var(--wrong);border-color:var(--wrong);}
.opt.reveal{border-color:var(--correct);color:var(--correct);}
select.txt{font:inherit;font-size:.88rem;padding:.32rem .5rem;border:1px solid var(--line);border-radius:var(--r-xs);background:var(--raise);color:var(--ink);margin-top:.35rem;}

.why{font-size:.83rem;color:var(--ink-soft);margin-top:.4rem;padding-left:.75rem;border-left:2px solid var(--line);display:none;}
.why.show{display:block;}
.why b{color:var(--brand-deep);font-weight:600;}

.row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.1rem;align-items:center;}
.btn{font:inherit;font-size:.85rem;font-weight:600;border-radius:100px;padding:.45rem 1.05rem;cursor:pointer;border:1px solid transparent;}
.btn.primary{background:var(--brand);color:#fff;}
.btn.primary:hover{background:var(--brand-deep);}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--coral);color:var(--coral);}
.score{margin-left:auto;font-size:.83rem;font-weight:600;color:var(--ink-faint);}
.score.good{color:var(--correct);}
.score.part{color:var(--gold);}

.model{margin-top:.45rem;font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:1rem;color:var(--brand-deep);background:var(--brand-soft);border-radius:var(--r-xs);padding:.5rem .7rem;display:none;}
.model.show{display:block;}
.item.rv-flash{animation:rvflash 1.2s ease;}
@keyframes rvflash{0%{background:var(--brand-soft);}100%{background:transparent;}}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none;}
.rvbtn{flex:none;font:inherit;font-size:.72rem;font-weight:600;background:none;border:1px solid var(--line);border-radius:100px;padding:.2rem .6rem;margin-top:.3rem;cursor:pointer;color:var(--ink-faint);}
.rvbtn:hover{border-color:var(--brand);color:var(--brand);}
.item.rv .rvbtn{visibility:hidden;}
.model b{font-family:'DM Sans',sans-serif;font-style:normal;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:.2rem;opacity:.75;}

.project{background:var(--raise);border:1px solid var(--gold);border-radius:var(--r-sm);padding:1rem 1.1rem;font-size:.93rem;}
.project .extra{margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line);color:var(--ink-soft);font-size:.88rem;}

.saved{font-size:.74rem;color:var(--ink-faint);margin-top:.3rem;height:1rem;}

/* ── HOME ── */
.home h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.1rem);line-height:1.03;letter-spacing:-.03em;margin:.9rem 0 .7rem;}
.home h1 span{color:var(--coral);}
.home .lede{color:var(--ink-soft);font-size:1.02rem;max-width:46ch;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(226px,1fr));gap:.9rem;margin-top:1.6rem;}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;cursor:pointer;font:inherit;color:inherit;transition:.2s;position:relative;}
.tile:hover{border-color:var(--brand);transform:translateY(-3px);}
.tile .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.1em;color:var(--coral);}
.tile h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.99rem;line-height:1.25;margin:.35rem 0 .3rem;letter-spacing:-.01em;}
.tile p{font-size:.8rem;color:var(--ink-faint);line-height:1.45;}
.tile .mini{height:4px;border-radius:100px;background:var(--line-soft);margin-top:.8rem;overflow:hidden;}
.tile .mini i{display:block;height:100%;background:var(--brand);width:0;}
.tile.hide{display:none;}
.foot{margin-top:3.5rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-faint);line-height:1.7;}

.pager{display:flex;gap:.6rem;margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--line);}
.pager button{flex:1;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:.75rem .95rem;cursor:pointer;font:inherit;color:var(--ink);}
.pager button:hover{border-color:var(--brand);}
.pager small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.15rem;}
.pager .nx{text-align:right;}
.pager button[disabled]{opacity:.35;cursor:default;}

@media(max-width:880px){
 .burger b{display:none;}
 .burger{padding:0 .7rem;}
 .main{padding:1.4rem 1.1rem 5rem;}
 .brand small{display:none;}
 .searchwrap{max-width:none;}
 .setnav{display:none;}
}
@media(max-width:640px){
 .searchwrap{display:none;}
}
@media print{
 .top,.side,.pager,.row,.scrim{display:none!important;}
 .main{padding:0;max-width:none;}
 .model,.why{display:block!important;}
 .ex,.learn{break-inside:avoid;border-color:#ccc;}
}
</style>
</head>

{n:2,t:"Cut, Fix, Improve: The Sentence Surgeon Lab",s:"Making your paragraph clear and correct",grp:"Writing & essays",tags:"topic sentence word order svo revise edit paragraph",
 sec:[
  {L:"A",t:"Topic sentences",
   learn:[
    {b:"p",x:"A topic sentence is the first sentence of a paragraph. It tells the reader one main idea and connects to your thesis."},
    {b:"formula",x:"TOPIC SENTENCE = ONE IDEA + WHAT THE PARAGRAPH WILL SAY ABOUT IT"},
    {b:"eg",x:["✗ I will talk about flexibility. (too vague)",
              "✓ First, online learning offers flexibility for working students. (clear and specific)"]}
   ],
   ex:[
    {n:"A1",k:"mcq",i:"Read each pair. Circle the better topic sentence.",
     q:[["1.",["a) Dogs are good.","b) Dogs make great family pets because they are loyal."],1,"b names one idea and says what the paragraph will argue about it."],
        ["2.",["a) Second, lower costs help students save money.","b) Second, money is important."],0,"a is specific and connects to the essay's point; b could introduce anything."],
        ["3.",["a) This paragraph is about exercise.","b) Regular exercise improves mental health by reducing stress."],1,"Announcing the topic is not the same as stating an idea about it."]]},
    {n:"A2",k:"open",i:"Write one topic sentence for a paragraph about your favorite season. One idea + what you will say about it.",
     q:[["Your topic sentence","Winter is the most productive season of the year because the cold keeps you indoors and on task."]]}
   ]},
  {L:"B",t:"Word order (SVO)",
   learn:[
    {b:"p",x:"English sentences follow a strict order:"},
    {b:"formula",x:"SUBJECT + VERB + OBJECT + (TIME / PLACE)"},
    {b:"eg",x:["✓ She writes essays every day.   ✓ I like coffee.",
              "✗ She every day writes essays.   ✗ I coffee like."]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Put the words in the correct order (SVO).",
     q:[["every day / drinks / tea / Maria","Maria drinks tea every day."],
        ["to the park / walk / We / on Sundays","We walk to the park on Sundays."],
        ["English / They / study / at the library","They study English at the library."]]},
    {n:"B2",k:"open",i:"Write two correct SVO sentences about your daily routine.",
     q:[["Sentence 1","I check my messages before breakfast."],
        ["Sentence 2","My brother takes the bus to work at seven."]]}
   ]},
  {L:"C",t:"Revise a paragraph",
   learn:[
    {b:"p",x:"Revise means to make your writing better — not just fix spelling. Ask yourself: Does every sentence support the topic sentence? Is the word order correct (SVO)? Are articles (a/an/the) used correctly?"},
    {b:"note",x:"NOTE: REVISE ≠ EDIT.  Edit = fix small mistakes.  Revise = improve the whole paragraph."}
   ],
   ex:[
    {n:"C1",k:"open",i:"Read the weak paragraph. Then revise it using the checklist. (Rewrite the paragraph — change sentences, fix word order, add missing words.)  Weak paragraph: “Online learning is good. Students can study at home. They like it because is flexible. The courses are cheap. For these reasons online learning popular.”",
     q:[["Your revised version","Online learning is an effective option for many students because it is flexible and affordable. First, students can study at home and watch recorded lectures whenever their schedule allows. Second, online courses usually cost far less than in-person programs. For these reasons, online learning has become popular with working students and parents."]]},
    {n:"C2",k:"open",i:"Take the paragraph you wrote in Set 1. Revise it here.  Topic sentence at the beginning? · SVO word order everywhere? · Correct a/an/the? · Every sentence supports the main idea?",
     q:[["Your revised paragraph",""]]}
   ]},
  {L:"D",t:"Mini Project: The “Sentence Surgeon” Revision Lab",learn:[],
   ex:[{n:"MP",k:"project",i:"You are a Sentence Surgeon. Your job is to take a sick paragraph (full of errors) and operate on it to make it healthy. You will: 1. Diagnose the problems (topic sentence missing, SVO errors, article errors). 2. Operate (rewrite the paragraph correctly). 3. Present your work (show the “before” and “after”).",x:""}]}

{n:3,t:"Problem Solved! Building a Problem-Solution Essay",s:"Problem-solution essays (part 1)",grp:"Writing & essays",tags:"problem solution essay thesis hook parallel structure outline",
 sec:[
  {L:"A",t:"Problem-solution essay (introduction + problem paragraph)",
   learn:[
    {b:"p",x:"A problem-solution essay has two main parts: 1. Introduction — Hook, background, and thesis that names the problem. 2. Problem paragraph — Describes the problem clearly (causes, effects, or both)."},
    {b:"formula",x:"[PROBLEM] IS A SERIOUS ISSUE BECAUSE [REASON], BUT IT CAN BE SOLVED BY [SOLUTION – PREVIEW]."},
    {b:"eg",x:["Example thesis: Traffic congestion is a serious issue because it wastes time and increases pollution, but it can be solved by improving public transportation."]}
   ],
   ex:[
    {n:"A1",k:"pick",i:"Read each sentence. Write P (problem) or I (introduction hook) or T (thesis).",
     o:[["P","P — problem"],["I","I — introduction hook"],["T","T — thesis"]],
     q:[["Have you ever been stuck in traffic for an hour?","I"],
        ["Traffic congestion wastes time and harms the environment.","P"],
        ["Traffic congestion is a serious issue because it wastes time, but better bus systems can help.","T"]]},
    {n:"A2",k:"open",i:"Choose one problem from the box — air pollution | smartphone addiction | low student motivation — and write a thesis statement (problem + reason + preview solution).",
     q:[["Your thesis","Smartphone addiction is a serious issue because it fragments attention and disrupts sleep, but it can be reduced by app limits and phone-free hours at school."]]}
   ]},
  {L:"B",t:"Parallel structure",
   learn:[
    {b:"p",x:"Parallel structure means using the same grammatical form for items in a list or series."},
    {b:"eg",x:["✓ I like running, swimming, and biking. (all -ing)",
              "✗ I like running, to swim, and biking. (mixed forms)",
              "✓ The problem is serious, widespread, and urgent. (all adjectives)",
              "✗ The problem is serious, widespread, and it is urgent. (mixed)"]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Correct the parallel structure error in each sentence.",
     q:[["She enjoys reading, to write, and painting.","She enjoys reading, writing, and painting."],
        ["The solution must be cheap, fast, and it should be easy.","The solution must be cheap, fast, and easy."],
        ["Students need time, space, and to have motivation.","Students need time, space, and motivation."]]},
    {n:"B2",k:"open",i:"Complete the sentences with parallel structure.",
     q:[["To solve this problem, the school should ___, ___, and ___.","To solve this problem, the school should shorten lunch queues, extend library hours, and hire a second counselor."],
        ["The causes of pollution include ___, ___, and ___.","The causes of pollution include heavy traffic, industrial waste, and poor recycling."]]}
   ]},
  {L:"C",t:"Outline an essay",

    {b:"p",x:"An outline helps you organize ideas before writing. For a problem-solution essay:"},
    {b:"table",h:["I. INTRODUCTION","II. PROBLEM PARAGRAPH"],r:[
      ["A. Hook (question, fact, or story)","A. Topic sentence (states the problem)"],
      ["B. Background (1–2 sentences)","B. Cause or effect 1"],
      ["C. Thesis (problem + solution preview)","C. Cause or effect 2"],
      ["","D. Concluding sentence"]]}

     o:[["A","First, air pollution comes from cars and factories."],["B","Did you know that 9 out of 10 people breathe polluted air?"],["C","Air pollution is a serious problem, but renewable energy can help."]],
     q:[["1. Hook","B"],["2. Thesis","C"],["3. Topic sentence (problem)","A"]]},
    {n:"C2",k:"open",i:"Complete the outline for your chosen problem.",
     q:[["My problem",""],["I. A. Hook",""],["I. B. Background",""],["I. C. Thesis",""],
        ["II. A. Topic sentence",""],["II. B. Cause/effect 1",""],["II. C. Cause/effect 2",""],["II. D. Concluding sentence",""]]}
   ]},
  {L:"D",t:"Mini Project: The “Fix My City” Campaign Poster",learn:[],
   ex:[{n:"MP",k:"project",i:"You are a concerned citizen who wants to solve a problem in your city, your neighborhood, or a place you know well. You will create a campaign poster that: 1. Names the problem (with a hook and background). 2. Explains why it matters (causes or effects). 3. Shows your solution (preview).  Your poster should convince people that the problem is real and that your solution can work.",x:""}]}

{n:4,t:"The “Sue-Proof” Writer: Solutions & Hedging",s:"Problem-solution essays (part 2): solutions + hedging",grp:"Writing & essays",tags:"solution paragraph conclusion hedging may might seems appears careful language",
 sec:[
  {L:"A",t:"Solution paragraph + Conclusion",
   learn:[
    {b:"p",x:"Last set you wrote an introduction and problem paragraph. Now you add a solution and conclusion paragraphs."},
    {b:"table",h:["Solution paragraph","Conclusion"],r:[
      ["States one clear solution","Restates the problem"],
      ["Explains how it works","Summarizes 1–2 solutions"],
      ["Gives a real example (from a city, school, or country)","Ends with a final thought (call to action or prediction)"]]},
    {b:"eg",x:["EXAMPLE SOLUTION PARAGRAPH (topic: social media FOMO): One effective solution is setting daily screen time limits. Apps like Instagram allow users to set a 30-minute daily reminder. For example, a study showed that teens who used screen limits reported less anxiety after two weeks. Clearly, this small change could make a big difference.",
              "EXAMPLE CONCLUSION: In conclusion, FOMO on social media increases anxiety and reduces sleep quality. However, setting screen limits and unfollowing toxic accounts can help. Teenagers must take control before their mental health gets worse."]}
   ],
   ex:[
    {n:"A1",k:"open",i:"Write your solution paragraph. Use the problem you chose in Set 3. Write 4–5 sentences.",
     q:[["My problem",""],["Your solution paragraph",""]]}
   ]},
  {L:"B",t:"Hedging (don’t get sued — or marked down)",
   learn:[
    {b:"p",x:"HEDGING = being careful. Not 100% certain. Academic writing and good reviews use hedging to sound fair, humble, and professional."},
    {b:"table",h:["Too strong (dangerous)","Hedged (safe, smart)"],r:[
      ["This solution will work.","This solution may work."],
      ["Social media causes anxiety.","Social media might contribute to anxiety."],
      ["The food is terrible.","The food seemed a bit salty to me."],
      ["The manager is lazy.","The manager appeared to be having an off day."]]},
    {b:"trick",x:"COMMON HEDGING WORDS: may, might, could, seems, appears, suggests, often, tends to, in my opinion"}
   ],
   ex:[
    {n:"B1",k:"open",i:"Hedge your own solution paragraph. Go back to your solution paragraph from A1. Find two sentences that sound too certain. Rewrite them with hedging.",
     q:[["Original sentence 1",""],["Hedged version 1",""],["Original sentence 2",""],["Hedged version 2",""]]},
    {n:"B2",k:"pick",i:"Read each sentence. Write S (strong/too certain) or H (hedged/safe).",
     o:[["S","S — strong / too certain"],["H","H — hedged / safe"]],
     q:[["This solution will solve the problem.","S"],
        ["This solution might reduce the problem.","H"],
        ["Social media causes anxiety in teenagers.","S"],
        ["Social media seems to contribute to anxiety in some teenagers.","H"],
        ["The food was terrible.","S"],
        ["The food seemed a bit salty to me.","H"],
        ["The manager is lazy and rude.","S"],
        ["The manager appeared to be having an off day.","H"],
        ["Students will fail if they don’t study.","S"],
        ["Students may struggle if they don’t study enough.","H"]]},
    {n:"B2b",k:"open",i:"Second part of Exercise B2 — now rewrite the five sentences you marked S, using hedging.",
     q:[["1. This solution will solve the problem.","This solution may solve the problem."],
        ["3. Social media causes anxiety in teenagers.","Social media might contribute to anxiety in teenagers."],
        ["5. The food was terrible.","The food seemed rather disappointing to me."],
        ["7. The manager is lazy and rude.","The manager appeared unhelpful on the day I visited."],
        ["9. Students will fail if they don’t study.","Students could struggle if they don’t study."]]}
   ]},
  {L:"C",t:"Mini Project: The “Sue-Proof” Review",learn:[],
   ex:[{n:"MP",k:"project",i:"The scenario: you are a content creator. You write honest reviews. A restaurant owner says your last post is false and wants to sue you. Your job: rewrite the post using hedging so it’s fair, honest, and safe.",
        x:"The dangerous original: “Joe’s Diner is the worst restaurant in the city. The burgers are dry and gross. The waiters are lazy and rude. The kitchen is dirty. The owner is greedy and charges too much. Don’t ever eat here – you will get sick. This place should be closed forever.”"}]}
 ]},

{n:5,t:"Copy-Paste Protector: Summarize, Paraphrase & Cite",s:"Using sources: summarize, paraphrase, cite",grp:"Writing & essays",tags:"summarize paraphrase cite plagiarism sources reduced relative clauses",
 sec:[
  {L:"A",t:"Summarize + Paraphrase + Cite (The “Copy-Paste Protector”)",
   learn:[
    {b:"p",x:"When you use someone else’s idea, give credit. You have three tools:"},
    {b:"table",h:["Tool","What it does","Length","Example"],r:[
      ["Summarize","Main idea only, in your words","Short","Lee (2021) argues that social media affects sleep."],
      ["Paraphrase","Same detail, different words","Similar length","According to Lee (2021), using social media before bed may reduce sleep quality."],
      ["Cite","Tell where you got the info","One line","(Lee, 2021) or According to Lee…"]]},
    {b:"trick",x:"WHY CITE?  Shows research · Makes writing stronger · Avoids plagiarism"}
   ],
   ex:[
    {n:"A1",k:"pick",i:"Read the original. Then write S (summarize) or P (paraphrase).  Original: “Loot boxes in video games encourage gambling habits because they use random rewards to trigger dopamine release.” (Chen, 2022)",
     o:[["S","S — summarize"],["P","P — paraphrase"]],
     q:[["Chen (2022) explains that random rewards in loot boxes may promote addictive behavior.","S"],
        ["Loot boxes are bad (Chen, 2022).","S"],
        ["According to Chen (2022), video game loot boxes use unpredictable rewards that could lead to gambling-like habits in young players.","P"]]},
    {n:"A2",k:"open",i:"Read the short text once. Then write: (1) summary (one sentence), (2) paraphrase (two sentences).  Original text: “Teens who spend more than 4 hours daily on TikTok report higher levels of FOMO and lower self-esteem. However, taking a 7-day break from the app improved mood in 60% of participants.” (Williams, 2023)",
     q:[["Your summary (main idea only)","Williams (2023) found that heavy TikTok use is linked to worse self-esteem, but that a short break helps."],
        ["Your paraphrase (same detail, different words)","According to Williams (2023), adolescents who use TikTok for over four hours a day tend to report more fear of missing out and lower self-worth. The same study found that a week away from the platform lifted the mood of three in five participants."]]}
   ]},
  {L:"B",t:"Reduced Relative Clauses (Shorter = More Academic)",
   learn:[
    {b:"p",x:"Relative clauses add information. Reduced clauses are shorter and better for academic writing."},
    {b:"table",h:["Full (long)","Reduced (better)"],r:[
      ["Students who are enrolled for the intensive course will start next week.","Students enrolled for the intensive course will start next week."],
      ["The study that was published in 2023 is useful.","The study published in 2023 is useful."],
      ["Social media which is used at night disrupts sleep.","Social media used at night disrupts sleep."]]}
   ],
   ex:[
    {n:"B1",k:"gap",i:"Reduce the clause. Type only the reduced part that fills the gap.",
     q:[["The research that was conducted in Brazil showed interesting results.  → The research ___ showed interesting results.",["conducted in brazil"]],
        ["Influencers who are paid by brands often hide sponsorships.  → Influencers ___ often hide sponsorships.",["paid by brands"]],
        ["The app which is designed for VSCO teens is very popular.  → The app ___ is very popular.",["designed for vsco teens"]]]},
    {n:"B2",k:"open",i:"Use reduced clauses in your essay. Write two sentences about YOUR problem-solution essay. Use one reduced relative clause in each.",
     q:[["1. (about the problem)","Students distracted by constant notifications lose roughly an hour of study time a day."],
        ["2. (about the solution)","A policy introduced in several Dublin schools removed phones from classrooms entirely."]]}
   ]},
  {L:"C",t:"Mini Project: The “Fact Check” Challenge",learn:[],
   ex:[{n:"MP",k:"project",i:"The scenario: you wrote a paragraph about a problem (fast fashion, FOMO, loot boxes, etc.). A friend says: “That’s just your opinion. Prove it.”  Your job: find ONE real fact from memory OR use the fake source below. Then write three sentences about your problem: one summary of what the source says · one paraphrase of one detail · one citation (author + year).",
        x:"Fake source you can use (or use a real fact you know): “The average teen spends 7 hours per day looking at screens. This has been linked to higher rates of anxiety, lower attention spans, and worse sleep quality. However, reducing screen time to 2 hours per day improved mood in 75% of teens after just one week.” (Martinez, 2023)"}]}
 ]}

);

{n:8,t:"Me, Myself, and I: The Art of the Personal Statement",s:"Personal statements",grp:"Writing & essays",tags:"personal statement application scholarship cohesive devices however therefore for example",
 sec:[
  {L:"A",t:"What is a personal statement?",
   learn:[
    {b:"formula",x:"A PERSONAL STATEMENT IS A SHORT PERSUASIVE ESSAY ABOUT YOU – FOR A COURSE, JOB, EXCHANGE PROGRAM, OR SCHOLARSHIP."},
    {b:"eg",x:["Bad personal statement: I am hardworking, creative, and friendly. (boring, no evidence)",
              "Good personal statement: When my team’s leader quit two days before a tournament, I organized practice sessions, assigned new roles, and kept everyone motivated. We didn’t win, but we finished strong – and I learned that leadership is about staying calm under pressure."]},
    {b:"trick",x:"The secret: Show, don’t tell. Use a specific example instead of a list of adjectives."}
   ],
   ex:[
    {n:"A1",k:"open",i:"Warm-up (talk with a partner). Imagine you’re applying for a summer exchange program in London. They ask: “Why should we choose you?”  • What would you mention first?  • How do you avoid just listing “I’m hardworking and friendly”?  Discussion question: What’s more convincing: saying “I am creative” or giving a short example of when you solved a problem in a creative way?",
     q:[["What you would mention first",""],["Your answer to the discussion question",""]]}
   ]},
  {L:"B",t:"Structure of a personal statement",
   learn:[
    {b:"table",h:["Part","What it does","Example"],r:[
      ["Opening","Who you are + what you want","I am applying for the esports gaming internship because I want to learn how events are managed."],
      ["Specific example","One concrete story (not a list)","When I organized a small tournament for 16 players, I learned to handle conflicts and schedules."],
      ["Why it matters","Connect the example to the opportunity","This experience showed me that teamwork is more important than individual skill."],
      ["Closing","What you hope to do next","I would bring my passion for fair play and organization to your team."]]},
    {b:"note",x:"REMEMBER — Never start with: “I was born in…” or “I have always been…” (too boring, too predictable)"}
   ],
   ex:[]},
  {L:"C",t:"Cohesive devices (glue for your ideas)",
   learn:[
    {b:"p",x:"Cohesive devices connect your sentences so your writing flows smoothly."},
    {b:"table",h:["Function","Cohesive device","Example"],r:[
      ["Addition","in addition, furthermore, moreover","I organized tournaments. In addition, I managed social media."],
      ["Contrast","however, although, despite","I don’t have formal experience. However, I taught myself game design."],
      ["Cause/effect","therefore, as a result, consequently","I practiced daily. Therefore, my skills improved quickly."],
      ["Example","for example, for instance","I love solving problems. For example, I fixed a scheduling conflict last minute."]]}
   ],
   ex:[
    {n:"C1",k:"gap",i:"This personal statement is confusing because ideas jump around. Add cohesive devices from the box to make it flow.  | however | for example | as a result | although | in addition |",
     q:[["I’ve been playing video games since I was twelve. (1) ___, I started organizing small tournaments in my neighborhood.",["in addition"]],
        ["(2) ___, I realized I enjoyed leading teams more than just playing alone.",["as a result"]],
        ["(3) ___, I don’t have formal work experience.",["although|however"]],
        ["(4) ___, I taught myself basic game design using YouTube.",["however|although"]],
        ["(5) ___, I want to join your gaming internship to learn how esports events are really managed.",["for example"]]]},
    {n:"C2",k:"open",i:"Rewrite the robot version. This personal statement is grammatically correct but sounds like a robot wrote it. Rewrite it as 2–3 smooth sentences using cohesive devices.  “I love streetwear fashion. I started a small Instagram page about sneakers. I gained 500 followers. I don’t have a big budget. I focus on thrifted finds. I want to study fashion marketing. I believe my passion makes up for my lack of experience.”",
     q:[["Your rewrite","I love streetwear fashion, and I started a small Instagram page about sneakers that has gained 500 followers. Although I don’t have a big budget, I focus on thrifted finds instead. As a result, I want to study fashion marketing, because my passion more than makes up for my lack of experience."]]}
   ]},
  {L:"D",t:"Complete the personal statement",
   learn:[],
   ex:[
    {n:"D1",k:"open",i:"Use cohesive devices to finish each sentence logically.",
     q:[["I’ve never traveled abroad for a competition; however, …","…I have coached two teammates who did, and I prepared their match schedules from here."],
        ["My experience with organizing online gaming sessions taught me teamwork. For example, …","…I once rebuilt a six-team bracket in under an hour after two players dropped out."],
        ["I enjoy following sustainable fashion influencers. As a result, …","…I now buy almost everything second-hand and repair what I already own."],
        ["Although I don’t speak English perfectly, …","…I read technical articles in English every week and I am not afraid to ask questions."],
        ["I spend time watching documentary-style YouTube videos about food culture. Therefore, …","…I have learned how closely cooking is tied to history, which is why I want to study gastronomy."]]}

{n:9,t:"Combine & Conquer: Writing a Synthesis Report",s:"Synthesis report: comparing sources",grp:"Writing & essays",tags:"synthesis report sources compare combine timed reading grammar review",
 sec:[
  {L:"A",t:"Synthesis report (comparing + writing)",
   learn:[
    {b:"p",x:"A synthesis is different from a summary.  Summary = one source, restated.  Synthesis = two or more sources, compared and combined to show a new idea."},
    {b:"formula",x:"SOURCE A SAYS X. SOURCE B SAYS Y. TOGETHER, THEY SHOW Z."},
    {b:"eg",x:["Martinez (2023) argues that green spaces reduce asthma risk. Kim (2022) claims that air pollution increases breathing problems. Taken together, these studies suggest that cities with less pollution and more parks may have healthier children."]}
   ],
   ex:[
    {n:"A1",k:"open",i:"Read the two sources. Then complete the synthesis sentence.  Source A (Lee, 2021): Social media may reduce face-to-face conversation skills.  Source B (Chen, 2022): Online platforms help shy students express themselves.  —  Lee (2021) believes that social media may harm conversation skills, while Chen (2022) argues that it helps shy students. Together, these studies suggest that…",
     q:[["Complete the sentence","…the effect of social media may depend on the student: the same platform can reduce practice for confident speakers and provide it for shy ones."]]},
    {n:"A2",k:"open",i:"Write one synthesis paragraph (4–5 sentences) comparing two ideas about homework.  Source A (Williams, 2020): Homework helps students practice skills and build discipline.  Source B (Garcia, 2021): Too much homework increases stress and reduces family time.",
     q:[["Your synthesis paragraph","Williams (2020) argues that homework builds both skill and self-discipline through regular practice. Garcia (2021), in contrast, found that heavy homework loads raise stress levels and cut into family time. The two findings are not necessarily in conflict, since they may describe different quantities of the same activity. Taken together, these studies suggest that the question is not whether homework helps, but how much of it does. A moderate, well-designed load may capture the benefits Williams describes without the costs Garcia reports."]]},
    {n:"A3",k:"open",i:"Synthesis sentence frames. Read the two short sources below. Then complete the synthesis sentence with your own words.  Source A: “School uniforms reduce bullying because students cannot judge each other by their clothes.” (Santos, 2022)  Source B: “School uniforms limit students’ creativity and self-expression.” (Oliveira, 2023)  — and —  Source A: “Online learning offers flexibility and saves commuting time.” (Lee, 2022)  Source B: “Online learning reduces social interaction and makes students feel isolated.” (Martinez, 2023)",
     q:[["1. Santos (2022) argues that uniforms reduce bullying, while Oliveira (2023) claims that …","…they suppress students’ creativity and self-expression."],
        ["2. Together, these two sources suggest that …","…uniforms may trade one kind of freedom for another, and schools must decide which matters more at that age."],
        ["3. Lee (2022) believes online learning is flexible, whereas Martinez (2023) argues that …","…it reduces social interaction and leaves students feeling isolated."],
        ["4. Taken together, these studies indicate that …","…the convenience of online study comes at a social cost, which hybrid models may be able to limit."]]}
   ]},
  {L:"B",t:"Grammar review (Classes 1–6)",
   learn:[
    {b:"p",x:"Here are the grammar topics you have learned. Can you remember them?"},
    {b:"table",h:["Class","Topic","Example"],r:[
      ["1","Articles (a/an/the)","I have an idea. The idea is good."],
      ["2","Word order (SVO)","She writes essays every day. (Not: She every day writes)"],
      ["3","Parallel structure","I like running, swimming, and biking."],
      ["4","Hedging (may, might, seems)","This solution may work."],
      ["5","Reduced relative clauses","The study published in 2020 is useful."],
      ["6","Gerunds vs. Participles","Swimming is fun (gerund) vs. The swimming pool is cold (participle)"]]}
   ],
   ex:[
    {n:"B1",k:"pick",i:"Mixed grammar review. Identify the grammar topic in each sentence. Write the correct letter (A–G).",
     o:[["A","A — Articles"],["B","B — Word order"],["C","C — Parallel structure"],["D","D — Hedging"],["E","E — Reduced relative clauses"],["F","F — Gerunds"],["G","G — Participles"]],
     q:[["Walking every day is good for your health.","F"],
        ["The car manufactured in Germany is very fast.","E"],
        ["She needs a new phone. The phone she has is broken.","A"],
        ["This solution might reduce costs.","D"],
        ["He enjoys reading, writing, and to listen to music. (Error – fix to parallel)","C"],
        ["The barking dog woke me up.","G"],
        ["They to the park go every Sunday. (Error – fix word order)","B"]]},
    {n:"B2",k:"write",i:"Find the mistakes! Each sentence below has one grammar mistake from Classes 1–7. Find it, underline it, and write the correct sentence.",
     q:[["She every day drinks coffee before class.","She drinks coffee every day before class."],
        ["I need a advice about my career path.","I need advice about my career path."],
        ["He enjoys to swim, run, and biking.","He enjoys swimming, running, and biking."],
        ["The solution will solve the problem for sure. (Make it hedged using may)","The solution may solve the problem."],
        ["The book which was written in 1990 is on the shelf. (Reduce the relative clause)","The book written in 1990 is on the shelf."],
        ["Reading is my favorite hobby. (Identify: is this gerund or participle?)","Gerund — it is the subject of the sentence."],
        ["The crying baby kept everyone awake. (Identify: is this gerund or participle?)","Participle — it describes the noun baby."]]}
   ]},
  {L:"C",t:"Timed reading + find sources + write synthesis report",
   learn:[
    {b:"p",x:"You will: 1. Read two short texts (5 minutes – timed). 2. Find key ideas from each source. 3. Write a synthesis report comparing them."},
    {b:"p",x:"Text 1 – Park, 2023: Teenagers who use smartphones for more than 4 hours daily may have lower sleep quality. Park found that blue light from screens delays melatonin production, making it harder to fall asleep. However, teenagers who used “night mode” reported slightly better sleep."},
    {b:"p",x:"Text 2 – Jones, 2023: Smartphones may not be the main cause of sleep problems in teens. Jones argues that homework stress, early school start times, and social anxiety are equally important. In her study, teens with high stress slept poorly even when they did not use phones at night."}
   ],
   ex:[
    {n:"C1",k:"open",i:"Timed reading (5 minutes). Read both texts silently. You may underline key ideas. After reading – answer these questions (2 minutes).",
     q:[["1. What does Park (2023) say is the main problem?","Blue light from heavy smartphone use delays melatonin and makes it harder to fall asleep."],
        ["2. What does Jones (2023) say is different?","That phones are not the main cause — homework stress, early school start times and social anxiety matter just as much."],
        ["3. What do both texts agree on?","That teenagers are sleeping badly, and that the cause is not a single simple factor."]]},
    {n:"C2",k:"open",i:"Write synthesis report (15–20 minutes). Write a short synthesis report (one paragraph, 6–8 sentences) using both sources.  Your report must include: ❑ Summary of Park (2023) – 1–2 sentences ❑ Summary of Jones (2023) – 1–2 sentences ❑ Comparison phrase (however, in contrast, similarly, on the other hand) ❑ Your conclusion (together, these sources suggest…) ❑ Citations for both authors ❑ At least two different grammar items from the review",
     q:[["Write your synthesis report here","Park (2023) reports that teenagers who spend more than four hours a day on smartphones may sleep badly, because blue light delays melatonin production. Teenagers using night mode, she found, slept slightly better. Jones (2023), in contrast, argues that phones are not the main culprit at all. In her study, homework stress, early school start times and social anxiety predicted poor sleep even among teenagers who kept their phones away at night. The two accounts are not incompatible, since screens may worsen a problem they did not create. Together, these sources suggest that advice limited to phones may be too narrow. Schools that start later, and set lighter evening homework, might do more for adolescent sleep than any night-mode setting."],
        ["Grammar items I used","1. Reduced relative clause (“Teenagers using night mode”).  2. Hedging (may, might).  3. Articles and parallel structure in the list of causes."]]}
   ]},
  {L:"D",t:"Mini Project: The “Synthesis Showdown” Debate",learn:[],
   ex:[{n:"MP",k:"project",i:"You will work in pairs or small groups. Your teacher will give you two short “sources” with opposite opinions on a silly topic. Your job: write a one-paragraph synthesis (4–5 sentences) comparing the two sources and reaching a conclusion. Then, read your synthesis aloud. The class votes on the funniest or most creative conclusion.",x:""}]}
 ]},

{n:10,t:"Double Trouble: Paired Conjunctions & Sentence Combining",s:"both…and / not only…but also / either…or / neither…nor",grp:"Grammar core",tags:"paired conjunctions correlative both and not only but also either or neither nor sentence combining",
 sec:[
  {L:"A",t:"Paired conjunctions (both…and / not only…but also / either…or / neither…nor)",
   learn:[
    {b:"p",x:"Paired conjunctions work in two parts. They connect similar ideas or choices."},
    {b:"table",h:["Conjunction","Meaning","Example"],r:[
      ["both…and","two things together","She speaks both Spanish and French."],
      ["not only…but also","adds emphasis (second idea is stronger)","He is not only smart but also very kind."],
      ["either…or","a choice between two options","You can have either coffee or tea."],
      ["neither…nor","not the first, not the second (negative both)","She likes neither cold weather nor hot weather."]]},
    {b:"note",x:"IMPORTANT — The two parts must be parallel (same grammatical form).  ✓ She wants both to travel and to learn.  ✗ She wants both to travel and learning."}
   ],
   ex:[
    {n:"A1",k:"gap",i:"Complete each sentence with the correct paired conjunction.  | both…and | not only…but also | either…or | neither…nor |",
     q:[["___ the teacher ___ the students were happy with the test results.  (both were happy? or neither?)",["both","and"]],
        ["You can choose ___ the red shirt ___ the blue one.",["either","or"]],
        ["He is ___ a talented musician ___ a great writer.",["not only","but also"]],
        ["She likes ___ spicy food ___ sweet food. She only likes salty snacks.",["neither","nor"]]]},
    {n:"A2",k:"open",i:"Complete each sentence with your own idea. Keep the structure parallel.",
     q:[["1. I enjoy both ___ and ___.","I enjoy both cooking and eating what other people cook."],
        ["2. This class is not only useful but also ___.","…but also surprisingly funny."],
        ["3. For the project, we can either ___ or ___.","…either film an interview or build a short website."],
        ["4. Neither my friend nor I ___.","…had read the instructions before we started."]]}
   ]},
  {L:"B",t:"Sentence combining drills",
   learn:[
    {b:"p",x:"Combining short sentences makes your writing smoother and more academic."},
    {b:"eg",x:["Short: She is smart. She is hardworking.  →  Combined: She is both smart and hardworking.",
              "Short: He didn’t call. He didn’t text.  →  Combined: He neither called nor texted.",
              "Short: The solution is cheap. It is also effective.  →  Combined: The solution is not only cheap but also effective."]}
   ],
   ex:[
    {n:"B1",k:"write",i:"Combine each pair of sentences using the conjunction in parentheses.",
     q:[["The movie was funny. The movie was exciting. (both…and)","The movie was both funny and exciting."],
        ["She doesn’t eat meat. She doesn’t eat fish. (neither…nor)","She eats neither meat nor fish."],
        ["We can leave now. We can wait for Maria. (either…or)","We can either leave now or wait for Maria."],
        ["He lost his job. He also lost his apartment. (not only…but also)","He lost not only his job but also his apartment."]]}

    {n:"C2",k:"open",i:"Write sentences about one of these topics or a topic of your choice: • Social media and teenagers • Climate change solutions • School rules",

{n:11,t:"Flip It! Mastering Inversions for Formal Writing",s:"General inversions (formal/academic style)",grp:"Grammar core",tags:"inversion never only then not until rarely seldom here there formal academic",
 sec:[
  {L:"A",t:"General inversions – what are they?",
   learn:[
    {b:"p",x:"In normal English, the subject comes before the verb: I have never seen such a thing.  In inversions, the verb (or auxiliary) comes before the subject. This makes your writing more formal, dramatic, or academic."},
    {b:"eg",x:["Normal: I have never seen such a beautiful sunset.  →  Inverted: Never have I seen such a beautiful sunset.",
              "Normal: She only then understood the problem.  →  Inverted: Only then did she understand the problem."]},
    {b:"table",h:["Pattern","Example"],r:[
      ["Never + auxiliary + subject","Never have I felt so proud."],
      ["Only then + did + subject","Only then did she realize her mistake."],
      ["Not until + clause + auxiliary + subject","Not until I read the book did I understand the topic."],
      ["Here / There + verb + subject","Here is the book you requested. / There goes the bus."],
      ["Rarely / Seldom + auxiliary + subject","Rarely do we see such dedication."],
      ["Not only…but also (with inversion)","Not only did he arrive late, but he also forgot his notes."]]}
   ],
   ex:[
    {n:"A1",k:"match",i:"Match each normal sentence to its inverted version.",
     o:[["A","Only then did she hear the news."],["B","Here are the keys you lost."],["C","Rarely do we see such talent."],["D","Never have I been so embarrassed."]],
     q:[["1. I have never been so embarrassed.","D"],
        ["2. She only then heard the news.","A"],
        ["3. The keys you lost are here.","B"],
        ["4. We rarely see such talent.","C"]]},
    {n:"A2",k:"open",i:"Complete each inverted sentence with your own idea.",
     q:[["1. Never have I …","Never have I been so relieved to see a bus."],
        ["2. Only then did she …","Only then did she understand why the file kept crashing."],
        ["3. Not until … I finish this project","Not until the data arrives will I finish this project."],
        ["4. Here is the …","Here is the evidence everyone was waiting for."],
        ["5. Rarely does my teacher …","Rarely does my teacher hand back work without a comment."]]}
   ]},
  {L:"B",t:"Rewrite normal sentences as inversions",
   learn:[
    {b:"note",x:"Rule reminder: • If the normal sentence has an auxiliary (have, do, be, can, will), move it before the subject. • If the normal sentence has no auxiliary (only main verb), add did / does / do."},
    {b:"table",h:["Normal","Inverted"],r:[
      ["I have never felt better.","Never have I felt better."],
      ["She only then smiled.","Only then did she smile. (add did)"],
      ["He rarely eats meat.","Rarely does he eat meat. (add does)"]]}
   ],

    {n:"B1",k:"write",i:"Rewrite each normal sentence as an inversion. Use the word in parentheses.",

        ["We rarely see such honesty in politics. (Rarely)","Rarely do we see such honesty in politics."],
        ["He not only failed the test, but he also blamed the teacher. (Not only)","Not only did he fail the test, but he also blamed the teacher."],
        ["I realized the truth not until I read the report. (Not until)","Not until I read the report did I realize the truth."]]},
    {n:"B2",k:"open",i:"Write two normal sentences of your own. Then invert them.",

  {L:"C",t:"Write 6 inverted sentences (formal/academic style)",

    {b:"p",x:"Brainstorm topics with a partner and write 6 inverted sentences."}
   ],
   ex:[
    {n:"C1",k:"study",i:"Study the models.",h:["Pattern","Model (academic topic)"],r:[
      ["Never…","Never have researchers found a single solution to climate change."],
      ["Only then…","Only then did the government realize the severity of the crisis."],
      ["Not until…","Not until students learn time management will they reduce their stress."],
      ["Here / There…","Here are the three main causes of online learning fatigue."],
      ["Rarely / Seldom…","Seldom does a single policy address both economic and environmental concerns."],
      ["Not only…but also (with inversion)","Not only does exercise improve physical health, but it also boosts mental well-being."]]}
   ]},
  {L:"D",t:"Mini Project: The “Inversion Intrigue” Mystery Game",learn:[],
   ex:[{n:"MP",k:"project",i:"You are a detective writing clues for a mystery. Each clue must be written as an inverted sentence. Your partner will read your clues and try to guess the answer.  Step 1: Choose a secret answer (a person, place, or thing related to school or daily life).  Step 2: Write 3 inverted clues using different inversion patterns.  Step 3: Read your clues to a partner. They guess the answer.  Step 4: Switch roles.",
        x:"Challenge: Write a short paragraph (6–8 sentences) for a formal essay. Use at least 3 different inversions. Underline them."}]}

{n:13,t:"Who’s Who? Pronoun Agreement & Clarity",s:"Pronoun correspondence, agreement traps and ambiguity",grp:"Grammar core",tags:"pronoun agreement antecedent ambiguous collective nouns everyone singular they clarity",

    {b:"table",h:["Rule","Correct","Incorrect"],r:[
      ["Number (singular → singular / plural → plural)","The student forgot his book.","The student forgot their book. (traditional)"],

      ["Clarity (one clear noun – no confusion)","When John called Peter, John hung up.","When John called Peter, he hung up. (Who?)"]]},

              "The committee of senior researchers, after reviewing the data for several months, finally released their findings. (Incorrect – committee is singular, so its not their)"]},
    {b:"table",h:["Trap","Example","Correction"],r:[
      ["Long distance between noun and pronoun","The collection of rare stamps, which had been passed down for generations, lost their value over time.","…lost its value (collection = singular)"],

      ["Indefinite pronouns (everyone, each, neither)","Everyone brought their own lunch. (acceptable modern)","Traditional: Everyone brought his or her own lunch."],

{n:15,t:"The Ultimate Grammar Showdown: Review of Sets 10–14",s:"Integrated review — conjunctions, inversions, either/neither, pronouns, prepositions",grp:"Review",tags:"review sets 10-14 error correction paired conjunctions inversions neither either pronoun preposition quiz",

  {L:"B",t:"Mixed error correction + transformation",

   ex:[
    {n:"B1",k:"write",i:"Rewrite each sentence as instructed.",
     q:[["1. Normal → Inversion (Never).  Normal: I have never read such a fascinating article.","Never have I read such a fascinating article."],
        ["2. Normal → Inversion (Only then).  Normal: She understood the problem only after reading the second chapter.","Only then did she understand the problem."],
        ["3. Normal → Inversion (Not until).  Normal: I didn’t understand the theory until I saw the diagram.","Not until I saw the diagram did I understand the theory."],
        ["4. Two sentences → Paired conjunction (not only…but also).  Original: The solution is affordable. It is also easy to implement.","The solution is not only affordable but also easy to implement."],
        ["5. Correct the pronoun ambiguity.  John told his brother that he needed a break.","John told his brother, “I need a break.”"],
        ["6. Correct the verb + preposition.  The increase in sales resulted from the new marketing strategy. (Is this correct? If not, fix it)","Correct as written — the increase was caused by the strategy, so result from is right."]]},
    {n:"B2",k:"open",i:"Write one correct sentence for each prompt.",
     q:[["1. Write a sentence using neither…nor as a connector:","The report named neither the author nor the date of the study."],
        ["2. Write a sentence with an inversion beginning with Rarely:","Rarely does a first draft need so little editing."],
        ["3. Write a sentence using either as a pronoun (standing alone):","Both routes take an hour, so either is fine."],
        ["4. Write a sentence with the verb + preposition contribute to:","Regular reading contributes to a much wider vocabulary."]]}
   ]},
  {L:"C",t:"20-item quiz",
   learn:[],
   ex:[
    {n:"C1",k:"mcq",i:"Part 1: Circle the correct answer. (Items 1–10)",
     q:[["1. ___ have I seen such a creative solution.",["a) Only then","b) Never","c) Not until"],1,"Never + auxiliary + subject is the standard inversion here."],
        ["2. The committee consists ___ ten members.",["a) on","b) of","c) from"],1,"consist of = be made up of."],
        ["3. ___ of the two options seems acceptable. We need a third choice.",["a) Either","b) Neither","c) Both"],1,"The second sentence rejects both options, so neither is required."],
        ["4. Not only ___ the exam, but he also finished early.",["a) did he pass","b) he passed","c) passed he"],0,"Sentence-initial Not only forces subject–auxiliary inversion."],
        ["5. I don’t like ___ option. They are both too expensive.",["a) neither","b) either","c) both"],1,"After a negative verb (don’t like), use either — two negatives would cancel out."],
        ["6. The delay resulted ___ a software glitch.",["a) in","b) from","c) of"],1,"The glitch caused the delay, so the delay resulted from it."],
        ["7. ___ did she realize the truth.",["a) Only then","b) Never","c) Not until"],0,"Only then + did + subject. Not until would need its own clause first."],
        ["8. The professor to ___ I spoke was very helpful.",["a) who","b) whom","c) which"],1,"After a preposition, use whom for a person."],
        ["9. She is a ___ person who always helps others.",["a) kindness","b) kindly","c) kind"],2,"An adjective is needed before the noun person."],
        ["10. ___ the teacher ___ the students were happy with the results.",["a) Both / and","b) Neither / nor","c) Either / or"],0,"The sentence reports that they were happy, so both…and fits."]]},
    {n:"C2",k:"write",i:"Part 2: Each sentence has one error. Write the corrected sentence. (Items 11–20)",

        ["15. When the teacher spoke to the student, he was very nervous.","When the teacher spoke to the student, the student was very nervous."],
        ["16. Not only he finished the project, but he also presented it.","Not only did he finish the project, but he also presented it."],

        ["18. The accident resulted in a simple mistake.","The accident resulted from a simple mistake."],

{n:18,t:"Read Fast, Write Smart: Timed Reading & Paraphrasing",s:"Timed reading + paraphrasing (speed + accuracy)",grp:"Skills & writing",tags:"timed reading paraphrasing speed accuracy ielts toefl memory",
 sec:[
  {L:"A",t:"Why timed reading + paraphrasing?",
   learn:[
    {b:"p",x:"In academic and exam contexts (IELTS, TOEFL, Cambridge), you must: 1. Read quickly – find main ideas under time pressure. 2. Paraphrase accurately – restate information in your own words without copying."},
    {b:"trick",x:"Speed without accuracy = useless.  Accuracy without speed = too slow for exams.  This set trains both."},
    {b:"p",x:"Text A: Climate change refers to long-term shifts in temperatures and weather patterns. These shifts may be natural, but since the 1800s, human activities have been the main driver. Burning fossil fuels (coal, oil, and gas) releases greenhouse gases, which trap heat in the atmosphere. This process, called the greenhouse effect, has warmed the planet by approximately 1.1°C since pre-industrial times."}
   ],
   ex:[
    {n:"A1",k:"open",i:"Read this short text once. Then answer the questions without looking back.",
     q:[["1. What is the main cause of climate change since the 1800s?","Human activity — above all the burning of fossil fuels."],
        ["2. What do greenhouse gases do?","They trap heat in the atmosphere, which warms the planet."],
        ["3. How much has the planet warmed since pre-industrial times?","By approximately 1.1°C."]]}
   ]},
  {L:"B",t:"Timed reading – first attempt",
   learn:[
    {b:"p",x:"You will read a new text with a timer."},
    {b:"p",x:"Text B: Remote work, also known as telecommuting, has grown significantly since 2020. Before the pandemic, only 6% of employees worked from home regularly. By 2022, that number had risen to 25%. This shift has brought both benefits and challenges. On the positive side, remote work eliminates commuting time, which can save employees an average of 54 minutes per day. It also offers greater flexibility for parents and caregivers. However, remote work may also lead to feelings of isolation. A study by Harvard Business Review found that 40% of remote workers reported feeling less connected to their colleagues compared to in-office workers. Additionally, some employees struggle to maintain work-life boundaries when their home becomes their office. The long-term effects of this shift are still unclear, but researchers suggest that hybrid models (partly in office, partly remote) may become the new standard."}
   ],
   ex:[
    {n:"B1",k:"open",i:"Timed reading (90 seconds). Record your reading time.",
     q:[["Your reading time (seconds)",""]]},
    {n:"B2",k:"open",i:"Paraphrasing from memory. Without looking back at Text B, paraphrase (restate in your own words) the following information.",
     q:[["1. The percentage of remote workers before the pandemic versus in 2022","Home working rose from about one employee in sixteen before the pandemic to one in four by 2022."],
        ["2. One benefit of remote work mentioned in the text","Workers no longer commute, which gives back close to an hour of each day."],
        ["3. One challenge of remote work mentioned in the text","Around two in five remote workers feel less connected to their colleagues."],
        ["4. The hybrid model prediction","Researchers expect a mixture of office and home working to become the normal arrangement."]]}
   ]},
  {L:"C",t:"Speed + accuracy practice",
   learn:[
    {b:"p",x:"Now you will do a second timed reading with a new text. Try to improve your speed while maintaining accuracy."},
    {b:"p",x:"Text C (275 words): Artificial intelligence (AI) is transforming education in ways that were unimaginable a decade ago. AI-powered tools can now personalize learning by adapting to individual student’s strengths and weaknesses. For example, intelligent tutoring systems can identify when a student is struggling with a particular concept and provide additional practice problems automatically. This technology has shown promising results. A meta-analysis of 30 studies found that students using AI tutoring systems improved their test scores by an average of 15% compared to traditional instruction."},
    {b:"p",x:"However, the integration of AI in education also raises concerns. Privacy is a major issue, as many AI systems collect large amounts of student data. Without proper safeguards, this information could be misused. Additionally, there is a risk that AI could widen the digital divide. Students in wealthy schools may have access to advanced AI tools, while those in underfunded schools may not. Some educators also worry that AI might reduce human interaction in the classroom, which is essential for developing social and emotional skills."},
    {b:"p",x:"Despite these challenges, most experts agree that AI will play an increasingly important role in education. The key is to implement it carefully, with clear regulations and a focus on equity. Neither complete adoption nor total rejection seems wise. Instead, a balanced approach that combines AI tools with human teaching may offer the best outcomes for students."}
   ],
   ex:[
    {n:"C1",k:"open",i:"Timed reading (record your time – aim for faster than B1). Goal: faster than B1, but still accurate.",
     q:[["Your reading time, second attempt (seconds)",""]]},
    {n:"C2",k:"open",i:"Paraphrasing from memory. Without looking back at Text C, complete the following paraphrases.",
     q:[["1. What AI-powered tools can do (2 benefits)","They adjust to each learner’s strengths and weaknesses, and they spot the moment a student gets stuck and supply extra practice."],
        ["2. The result of the meta-analysis of 30 studies","Students taught with AI tutoring scored about 15% higher than those taught conventionally."],
        ["3. Two concerns about AI in education","The amount of student data collected, and the risk that well-funded schools get the best tools while others fall further behind."],
        ["4. The balanced approach recommended by experts","Neither adopting AI wholesale nor rejecting it outright; combining AI tools with human teaching, under clear rules and with attention to equity."]]}
   ]},
  {L:"D",t:"Mini Project: The “Paraphrase & Guess” Game",learn:[],
   ex:[{n:"MP",k:"project",i:"You will paraphrase about everyday topics – but ADD a personal twist. You will write your paraphrase on a slip of paper and put it in a bag. Your teacher will read each paraphrase aloud, and the class will try to guess who wrote it.",
        x:"Examples — “I should probably go to bed earlier.” → “Going to bed before midnight is something I rarely do, which explains why I’m always sleepy during math class.”  ·  “My phone battery dies too fast.” → “My phone gives up on life by 2pm every day – just like I do when I have to study.”  ·  “I have a lot of homework to do.” → “My hello kitty backpack is full of unfinished assignments.”"}]}
 ]},

{n:19,t:"Me, Myself, and Tomorrow: Strengths & Future Vision",s:"Life journal: strengths + future vision",grp:"Skills & writing",tags:"life journal strengths five year plan future vision goals reflection",

  {L:"C",t:"Write paragraph (strengths) + 5-year plan (3 steps)",

  {L:"D",t:"Mini Project: “Future Me” Vision Board",learn:[],

/* ══════════ STORAGE ══════════ */
var KEY='adv3-v1';
var ST={ans:{},done:{}};
function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);ST.ans=p.ans||{};ST.done=p.done||{};}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
load();
function aget(k){return ST.ans[k]||'';}
function aset(k,v){if(v===''){delete ST.ans[k];}else{ST.ans[k]=v;}save();}
function mark(k,v){if(v){ST.done[k]=1;}else{delete ST.done[k];}save();}

/* ══════════ HELPERS ══════════ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[\u2018\u2019\u02bc]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/[\u2013\u2014\u2212]/g,'-')
    .replace(/[.,;:!?"()\[\]]/g,'').replace(/'/g,'')
    .replace(/\s+/g,' ').trim();
}
function hit(val,key){
  var alts=String(key).split('|');
  var v=norm(val);
  for(var i=0;i<alts.length;i++){
    var a=norm(alts[i]);
    if(a===v) return true;
    if(a==='-'&&(v===''||v==='-'||v==='zero'||v==='no article')) return true;
    if(a===''&&v==='') return true;
  }
  return false;
}
function loose(val,key){
  if(hit(val,key)) return true;
  var v=norm(val).replace(/^(the|a|an)\s+/,''), k=norm(String(key).split('|')[0]).replace(/^(the|a|an)\s+/,'');
  if(!v) return false;
  if(v===k) return true;
  /* accept if the answer contains the model's distinctive core, e.g. "no commas" */
  if(k.length<18&&v.indexOf(k)>-1) return true;
  return false;
}
function exKey(set,ex){return 's'+set+'.'+ex;}
function itKey(set,ex,i,g){return 's'+set+'.'+ex+'.'+i+(g==null?'':'.'+g);}

function exCount(s){var c=0;s.sec.forEach(function(x){c+=x.ex.length;});return c;}
function exDone(s){var c=0;s.sec.forEach(function(x){x.ex.forEach(function(e){if(ST.done[exKey(s.n,e.n)])c++;});});return c;}

/* ══════════ SIDEBAR ══════════ */
var GROUPS=['Writing & essays','Grammar core','Review','Skills & writing'];
function buildSide(){
  var h='<button class="slink" data-go="home"><span class="num">◆</span><span class="ttl">All sets</span></button>';
  GROUPS.forEach(function(g){
    h+='<h4 data-grp="'+esc(g)+'">'+esc(g)+'</h4>';
    DATA.filter(function(s){return s.grp===g;}).forEach(function(s){
      h+='<button class="slink" data-go="'+s.n+'" data-find="'+esc((s.n+' '+s.t+' '+s.s+' '+s.tags).toLowerCase())+'">'+
         '<span class="num">'+s.n+'</span><span class="ttl">'+esc(s.t)+'</span><span class="pip" data-pip="'+s.n+'"></span></button>';
    });
  });
  document.getElementById('side').innerHTML=h;
}
function paintPips(){
  DATA.forEach(function(s){
    var el=document.querySelector('[data-pip="'+s.n+'"]');if(!el)return;
    var d=exDone(s),t=exCount(s);
    el.className='pip'+(d===0?'':(d>=t?' full':' part'));
    el.title=d+' of '+t+' activities done';
  });
}

/* ══════════ LEARN BLOCKS ══════════ */
function learnHTML(bs){
  if(!bs||!bs.length) return '';
  var h='<div class="learn">';
  bs.forEach(function(b){
    if(b.b==='p') h+='<p>'+esc(b.x)+'</p>';
    else if(b.b==='formula') h+='<div class="formula">'+esc(b.x)+'</div>';
    else if(b.b==='trick') h+='<div class="trick">'+esc(b.x)+'</div>';
    else if(b.b==='note') h+='<div class="note">'+esc(b.x)+'</div>';
    else if(b.b==='eg'){h+='<div class="egs">';b.x.forEach(function(e){h+='<div>'+esc(e)+'</div>';});h+='</div>';}
    else if(b.b==='table'){
      h+='<div class="tblwrap"><table><thead><tr>';
      b.h.forEach(function(c){h+='<th>'+esc(c)+'</th>';});
      h+='</tr></thead><tbody>';
      b.r.forEach(function(row){h+='<tr>';row.forEach(function(c){h+='<td>'+esc(c)+'</td>';});h+='</tr>';});
      h+='</tbody></table></div>';
    }
  });
  return h+'</div>';
}

/* ══════════ EXERCISE RENDERERS ══════════ */
function gapRow(set,e,i,q){
  var parts=String(q[0]).split('___'), h='<div class="q">';
  for(var g=0;g<parts.length;g++){
    h+=esc(parts[g]);
    if(g<parts.length-1){
      var k=itKey(set,e.n,i,g);
      h+='<input class="txt gapi" data-k="'+k+'" data-a="'+esc(q[1][g]||'')+'" value="'+esc(aget(k))+'" autocomplete="off" spellcheck="false">';
    }
  }
  return h+'</div><div class="why"></div>';
}
function nextBtn(n){return '<button class="btn ghost" data-act="next">'+nextTxt(n)+'</button>';}
function nextTxt(left){return left?'Reveal next answer ('+left+' left)':'All answers shown';}
/* items that have something to reveal (open items without a model answer are skipped) */
function revealables(card){
  var kind=card.getAttribute('data-kind');
  return Array.prototype.filter.call(card.querySelectorAll('.item'),function(it){
    return (kind==='open')?!!it.querySelector('.model'):true;
  });
}
function paintNext(card){
  var b=card.querySelector('[data-act="next"]');
  var all=revealables(card), left=all.filter(function(it){return !it.classList.contains('rv');}).length;
  if(b){b.textContent=nextTxt(left); b.disabled=!left;}
  var sp=card.querySelector('.score');
  if(sp&&left<all.length&&card.getAttribute('data-kind')!=='open'){sp.textContent=(all.length-left)+' / '+all.length+' shown';sp.className='score';}
}
function revealItem(card,it){
  var kind=card.getAttribute('data-kind');
  it.classList.add('rv');
  if(kind==='gap'){
    it.querySelectorAll('input.gapi').forEach(function(inp){
      if(!hit(inp.value,inp.getAttribute('data-a'))){inp.value=String(inp.getAttribute('data-a')).split('|')[0].replace(/^-$/,'–');aset(inp.getAttribute('data-k'),inp.value);}
      inp.classList.remove('no');inp.classList.add('ok');
    });
  } else if(kind==='pick'||kind==='mcq'){
    var box=it.querySelector('.opts'), ans=box.getAttribute('data-a');
    box.querySelectorAll('.opt').forEach(function(b){
      b.classList.remove('good','bad','reveal');
      var right=b.getAttribute('data-v')===String(ans);
      if(b.classList.contains('sel'))b.classList.add(right?'good':'bad');
      else if(right)b.classList.add('reveal');
    });
    var why=it.querySelector('.why');
    if(why){var t=why.getAttribute('data-txt');if(t){why.innerHTML='<b>Why:</b> '+esc(t);why.classList.add('show');}}
  } else if(kind==='match'){
    var sel=it.querySelector('select.txt');
    if(sel.value!==sel.getAttribute('data-a')){sel.value=sel.getAttribute('data-a');aset(sel.getAttribute('data-k'),sel.value);}
    sel.classList.remove('no');sel.classList.add('ok');
  } else {
    var m=it.querySelector('.model');if(m)m.classList.add('show');
  }
  it.classList.remove('rv-flash');void it.offsetWidth;it.classList.add('rv-flash');
}
function exHTML(set,e){
  var done=!!ST.done[exKey(set,e.n)];
  var h='<section class="ex'+(done?' done':'')+'" id="ex-'+set+'-'+e.n+'" data-ex="'+e.n+'" data-set="'+set+'" data-kind="'+e.k+'">'+
        '<div class="exhead"><span class="exno">'+esc(e.n)+'</span><span class="exi">'+esc(e.i)+'</span></div>';

  if(e.k==='study'){
    h+='<div class="tblwrap" style="margin-top:.9rem"><table><thead><tr>';
    e.h.forEach(function(c){h+='<th>'+esc(c)+'</th>';});
    h+='</tr></thead><tbody>';
    e.r.forEach(function(r){h+='<tr>';r.forEach(function(c){h+='<td>'+esc(c)+'</td>';});h+='</tr>';});
    h+='</tbody></table></div>';
    h+='<div class="row"><button class="btn ghost" data-act="tick">'+(done?'Done ✓':'Mark as read')+'</button></div></section>';
    return h;
  }
  if(e.k==='project'){
    var k=itKey(set,e.n,0);
    h+='<div class="project">'+esc(e.i)+(e.x?'<div class="extra">'+esc(e.x)+'</div>':'')+'</div>'+
       '<textarea class="txt" rows="5" data-k="'+k+'" placeholder="Draft it here — your text is saved on this device.">'+esc(aget(k))+'</textarea><div class="saved"></div>'+
       '<div class="row"><button class="btn ghost" data-act="tick">'+(done?'Done ✓':'Mark as done')+'</button></div></section>';
    return h;
  }

  h+='<div class="items">';
  e.q.forEach(function(q,i){
    var k=itKey(set,e.n,i);
    h+='<div class="item" data-i="'+i+'"><span class="idx">'+(i+1)+'.</span><div class="body">';
    if(e.k==='gap'){ h+=gapRow(set,e,i,q); }
    else if(e.k==='pick'){
      h+='<div class="q">'+esc(q[0])+'</div><div class="opts" data-a="'+esc(q[1])+'">';
      e.o.forEach(function(o){
        h+='<button class="opt'+(aget(k)===o[0]?' sel':'')+'" data-k="'+k+'" data-v="'+esc(o[0])+'">'+esc(o[1])+'</button>';
      });
      h+='</div><div class="why"></div>';
    }
    else if(e.k==='mcq'){
      h+='<div class="q">'+esc(q[0])+'</div><div class="opts" data-a="'+q[2]+'">';
      q[1].forEach(function(o,j){
        h+='<button class="opt'+(aget(k)===String(j)?' sel':'')+'" data-k="'+k+'" data-v="'+j+'">'+esc(o)+'</button>';
      });
      h+='</div><div class="why" data-txt="'+esc(q[3]||'')+'"></div>';
    }
    else if(e.k==='match'){
      h+='<div class="q">'+esc(q[0])+'</div><select class="txt" data-k="'+k+'" data-a="'+esc(q[1])+'"><option value="">— choose —</option>';
      e.o.forEach(function(o){
        h+='<option value="'+esc(o[0])+'"'+(aget(k)===o[0]?' selected':'')+'>'+esc(o[0])+'. '+esc(o[1])+'</option>';
      });
      h+='</select><div class="why"></div>';
    }
    else { /* write | open */
      h+='<div class="q">'+esc(q[0])+'</div>'+
         '<textarea class="txt" rows="'+(e.k==='open'?3:2)+'" data-k="'+k+'" data-a="'+esc(q[1]||'')+'" placeholder="Your answer…">'+esc(aget(k))+'</textarea>'+
         '<div class="saved"></div>'+
         (q[1]?'<div class="model"><b>Model answer</b>'+esc(q[1])+'</div>':'');
    }
    h+='</div>'+((e.k!=='open'||(q[1]&&String(q[1]).trim()))?'<button class="rvbtn" data-act="one" aria-label="Show answer '+(i+1)+'">Show</button>':'')+'</div>';
  });
  h+='</div><div class="row">';
  h=h.replace('<div class="items">', e.q.length<2?'<div class="items one">':'<div class="items">');
  if(e.k==='gap'||e.k==='pick'||e.k==='mcq'||e.k==='match') h+='<button class="btn primary" data-act="check">Check answers</button>';
  else if(e.k==='write') h+='<button class="btn primary" data-act="check">Check answers</button>';
  else {
    h+='<button class="btn primary" data-act="tick">'+(done?'Done ✓':'Mark as done')+'</button>';
  }
  h+='<button class="btn ghost" data-act="clear">Clear</button><span class="score"></span></div></section>';
  return h;
}

/* ══════════ VIEWS ══════════ */
var cur='home';
